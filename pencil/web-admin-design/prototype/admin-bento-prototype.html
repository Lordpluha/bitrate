<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitrate Admin · Bento prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Admin Overview — modern bento prototype: glass tiles over a soft aurora, an island navbar and a
   collapsible glass sidebar. Colours are the code's tokens (admin.lib.pen, three themes). */
:root {
  --bg: #0B0D12; --fg: #FFFFFF; --card: #151923; --muted: #1F2937; --muted-fg: #9CA3AF; --border: #2A303C;
  --primary: #7C3AED; --primary-fg: #FFFFFF; --accent: #A78BFA; --magenta: #EC4899; --blue: #3B82F6;
  --success: #10B981; --warning: #F59E0B; --error: #EF4444; --info: #3B82F6;
  --success-surface: #022C22; --warning-surface: #451A03; --error-surface: #450A0A; --info-surface: #172554;
  --success-text: #34D399; --warning-text: #FBBF24; --error-text: #F87171; --info-text: #60A5FA;
  --chart-1: #7C3AED; --chart-2: #3B82F6; --chart-3: #10B981; --chart-4: #F59E0B; --chart-5: #EF4444;
  --glass: color-mix(in srgb, var(--card) 58%, transparent);
  --glass-strong: color-mix(in srgb, var(--card) 78%, transparent);
  --glass-line: color-mix(in srgb, var(--fg) 9%, transparent);
  --glass-hi: color-mix(in srgb, var(--fg) 7%, transparent);
  --shadow: 0 24px 60px -24px rgb(0 0 0 / .55);
  --aurora: .55;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Unbounded", "Inter", system-ui, sans-serif;
  --r-tile: 24px; --gap: 16px; --side: 248px;
  color-scheme: dark;
}
:root[data-theme="dim"] {
  --bg: #0E1117; --fg: #E5E7EB; --card: #171B24; --muted: #1F2633; --muted-fg: #A1A7B3; --border: #2B3242; --accent: #8B5CF6;
  --success-text: #6EE7B7; --warning-text: #FCD34D; --error-text: #FCA5A5; --info-text: #93C5FD; --aurora: .38;
}
:root[data-theme="light"] {
  --bg: #FFFFFF; --fg: #0B0D12; --card: #FFFFFF; --muted: #F8FAFC; --muted-fg: #4B5563; --border: #E5E7EB; --accent: #7C3AED;
  --success: #059669; --warning: #D97706; --error: #DC2626; --info: #2563EB;
  --success-surface: #ECFDF5; --warning-surface: #FFFBEB; --error-surface: #FEF2F2; --info-surface: #EFF6FF;
  --success-text: #065F46; --warning-text: #92400E; --error-text: #991B1B; --info-text: #1E40AF;
  --chart-1: #6D28D9; --chart-2: #2563EB; --chart-3: #059669; --chart-4: #D97706; --chart-5: #DC2626;
  --glass: color-mix(in srgb, var(--card) 62%, transparent);
  --glass-strong: color-mix(in srgb, var(--card) 82%, transparent);
  --glass-line: color-mix(in srgb, var(--fg) 8%, transparent);
  --glass-hi: rgb(255 255 255 / .7);
  --shadow: 0 24px 50px -28px rgb(76 29 149 / .28);
  --aurora: .32;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  font: 14px/1.45 var(--font); color: var(--fg); background: var(--bg);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  transition: background-color .4s ease, color .4s ease;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- aurora: one fixed, non-interactive layer behind the glass ---------- */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: var(--aurora); transition: opacity .4s; }
.aurora span { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(90px); }
.aurora .a1 { background: var(--primary); top: -18vmax; left: 8vw; animation: drift1 26s ease-in-out infinite alternate; }
.aurora .a2 { background: var(--blue); bottom: -22vmax; right: -6vw; animation: drift2 32s ease-in-out infinite alternate; }
.aurora .a3 { background: var(--magenta); top: 30vh; left: 46vw; width: 30vmax; height: 30vmax; opacity: .55; animation: drift3 22s ease-in-out infinite alternate; }
.aurora::after { content: ""; position: absolute; inset: 0; background: radial-gradient(transparent 0, var(--bg) 85%); }
@keyframes drift1 { to { transform: translate(18vw, 12vh) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-16vw, -10vh) scale(.9); } }
@keyframes drift3 { to { transform: translate(-22vw, 14vh) scale(1.2); } }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--glass-line);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow);
}

/* ---------- app frame ---------- */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--side) 1fr; gap: var(--gap); padding: 16px; min-height: 100vh; transition: grid-template-columns .45s cubic-bezier(.2,.8,.2,1); }
.app.collapsed { --side: 76px; }

/* sidebar */
.side { position: sticky; top: 16px; height: calc(100vh - 32px); border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 18px; flex: none; }
.brand .mark { width: 30px; height: 30px; flex: none; }
.brand .words { display: flex; flex-direction: column; line-height: 1.1; white-space: nowrap; }
.brand b { font: 700 15px var(--display); letter-spacing: -.2px; }
.brand small { font-size: 11px; color: var(--muted-fg); }
.nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 10px; scrollbar-width: none; }
.nav h6 { margin: 14px 10px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted-fg); white-space: nowrap; }
.nav hr { display: none; border: 0; height: 1px; background: var(--glass-line); margin: 10px 14px; }
.item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 38px; padding: 0 12px; border-radius: 12px; color: var(--muted-fg); white-space: nowrap; transition: background .2s, color .2s; }
.item:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); color: var(--fg); }
.item.on { color: var(--fg); background: linear-gradient(90deg, color-mix(in srgb, var(--primary) 26%, transparent), color-mix(in srgb, var(--primary) 6%, transparent)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 35%, transparent); }
.item.on svg { color: var(--accent); }
.item .lbl { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }
.item .count { min-width: 22px; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11px; font-weight: 600; display: grid; place-items: center; background: color-mix(in srgb, var(--fg) 8%, transparent); }
.item.hot .count { background: var(--primary); color: var(--primary-fg); }
.prefs { flex: none; padding: 8px 10px 12px; border-top: 1px solid var(--glass-line); }
.app.collapsed .brand { justify-content: center; padding: 0; }
.app.collapsed .brand .words, .app.collapsed .nav h6, .app.collapsed .lbl, .app.collapsed .count { display: none; }
.app.collapsed .nav hr { display: block; }
.app.collapsed .item { justify-content: center; padding: 0; }
.app.collapsed .item.hot::after { content: ""; position: absolute; top: 7px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 2px var(--bg); }
.app.collapsed .collapse svg { transform: rotate(180deg); }
.collapse svg { transition: transform .4s; }

/* main column */
.main { min-width: 0; display: flex; flex-direction: column; gap: 22px; padding-bottom: 96px; }

/* ---------- island navbar ---------- */
.island { pointer-events: auto; display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 8px 0 10px; border-radius: 999px; background: var(--glass-strong); transition: width .5s cubic-bezier(.2,.9,.25,1.2), padding .3s; overflow: hidden; position: relative; }
.island .crumb { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; font-weight: 600; white-space: nowrap; }
.island .crumb .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 22%, transparent); }
.island .sep { width: 1px; height: 22px; background: var(--glass-line); margin: 0 4px; }
.seg { position: relative; display: flex; padding: 3px; border-radius: 999px; background: color-mix(in srgb, var(--fg) 6%, transparent); }
.seg button { position: relative; z-index: 1; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted-fg); transition: color .25s; }
.seg button.on { color: var(--primary-fg); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; border-radius: 999px; background: var(--primary); box-shadow: 0 6px 18px -6px var(--primary); transition: left .35s cubic-bezier(.2,.9,.25,1.15), width .35s; }
.search { display: flex; align-items: center; gap: 10px; height: 40px; min-width: 230px; padding: 0 8px 0 14px; border-radius: 999px; color: var(--muted-fg); background: color-mix(in srgb, var(--fg) 5%, transparent); }
.search span { flex: 1; text-align: left; white-space: nowrap; }
kbd { font: 600 11px var(--font); padding: 3px 7px; border-radius: 7px; background: color-mix(in srgb, var(--fg) 9%, transparent); color: var(--muted-fg); }
.ibtn { position: relative; width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; color: var(--fg); transition: background .2s; }
.ibtn:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.ibtn .badge { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--magenta); box-shadow: 0 0 0 2px var(--glass-strong); }
.ibtn.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: linear-gradient(135deg, var(--primary), var(--blue)); }
/* the island's live pocket: it widens for a status and folds back */
.pocket { display: flex; align-items: center; gap: 10px; max-width: 0; opacity: 0; white-space: nowrap; overflow: hidden; transition: max-width .55s cubic-bezier(.2,.9,.25,1.1), opacity .3s, padding .3s; font-size: 13px; font-weight: 600; }
.island.live .pocket { max-width: 360px; opacity: 1; padding: 0 12px 0 4px; }
.pocket .pdot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--primary) 22%, transparent); color: var(--accent); }
.pocket .bar { width: 70px; height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--fg) 12%, transparent); overflow: hidden; }
.pocket .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--blue)); }
.island.live.loading .pocket .bar i { animation: fill 1.6s ease-in-out forwards; }
@keyframes fill { to { width: 100%; } }

/* ---------- page header ---------- */
.head { display: flex; align-items: flex-end; gap: 16px; padding: 4px 4px 0; }
.head .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted-fg); }
.head h1 { margin: 6px 0 4px; font: 600 clamp(26px, 3vw, 38px)/1.1 var(--display); letter-spacing: -.8px; }
.head h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.head p { margin: 0; color: var(--muted-fg); }
.head .grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 13px; }
.pill.primary { background: var(--primary); color: var(--primary-fg); box-shadow: 0 10px 26px -10px var(--primary); }
.pill.ghost { background: color-mix(in srgb, var(--fg) 7%, transparent); }

/* ---------- bento ---------- */
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 188px; gap: var(--gap); grid-auto-flow: dense; }
.tile { position: relative; border-radius: var(--r-tile); padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; isolation: isolate;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; animation: rise .6s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 60ms); }
.tile::before { /* light that follows the pointer */
  content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .3s;
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%); }
.tile:hover { transform: translateY(-3px); }
.tile:hover::before { opacity: 1; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.w2 { grid-column: span 2; } .h2 { grid-row: span 2; }
.tile.accent { background: linear-gradient(160deg, color-mix(in srgb, var(--primary) 30%, var(--glass)) 0%, var(--glass) 55%); border-color: color-mix(in srgb, var(--primary) 30%, var(--glass-line)); }
.tile.accent::after { content: ""; position: absolute; width: 260px; height: 260px; right: -80px; top: -110px; z-index: -1; border-radius: 50%; background: var(--primary); filter: blur(70px); opacity: .35; }
.th { display: flex; align-items: center; gap: 12px; }
.th .ico { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--fg) 8%, transparent); }
.tile.accent .th .ico { background: var(--primary); color: var(--primary-fg); box-shadow: 0 8px 20px -8px var(--primary); }
.th .t { flex: 1; min-width: 0; }
.th .t b { display: block; font-size: 15px; font-weight: 600; }
.th .t small { display: block; font-size: 12px; color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th .go { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted-fg); background: color-mix(in srgb, var(--fg) 6%, transparent); transition: transform .3s, color .2s; }
.tile:hover .th .go { transform: rotate(-45deg); color: var(--fg); }
.tc { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--fg) 20%, transparent) transparent; margin-right: -8px; padding-right: 8px; }
.tc::-webkit-scrollbar { width: 6px; }
.tc::-webkit-scrollbar-thumb { border-radius: 6px; background: color-mix(in srgb, var(--fg) 20%, transparent); }

/* KPI */
.kpi .label { display: flex; align-items: center; gap: 8px; color: var(--muted-fg); font-size: 13px; }
.kpi .label .delta { margin-left: auto; }
.delta { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.delta.up { background: var(--success-surface); color: var(--success-text); }
.delta.flat { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--muted-fg); }
.kpi .value { font: 600 38px/1 var(--display); letter-spacing: -1.2px; }
.kpi .sub { font-size: 12px; color: var(--muted-fg); }
.spark { width: 100%; height: 44px; margin-top: auto; overflow: visible; }
.spark path.line { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.2s .3s ease forwards; }
.spark path.area { fill: url(#sparkFill); opacity: 0; animation: fade .8s .9s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }

/* needs action */
.act { display: flex; align-items: center; gap: 14px; padding: 9px 14px; border-radius: 16px; background: color-mix(in srgb, var(--card) 55%, transparent); border: 1px solid var(--glass-line); transition: transform .25s, background .25s; text-align: left; width: 100%; }
.act:hover { transform: translateX(4px); background: color-mix(in srgb, var(--card) 80%, transparent); }
.act .ai { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.ai.warning { background: var(--warning-surface); color: var(--warning-text); }
.ai.info { background: var(--info-surface); color: var(--info-text); }
.ai.error { background: var(--error-surface); color: var(--error-text); }
.ai.success { background: var(--success-surface); color: var(--success-text); }
.act .tx { flex: 1; min-width: 0; }
.act .tx b { display: block; font-weight: 600; }
.act .tx small { color: var(--muted-fg); font-size: 12px; }
.act .n { font: 600 26px var(--display); }
.act.urgent .ai { animation: pulse 2.4s ease-in-out infinite; }
.act.locked { cursor: default; }
.act.locked .ai { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--muted-fg); }
.act.locked:hover { transform: none; }
.ai.lock { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--muted-fg); }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--warning) 0%, transparent), 0 0 0 0 transparent; } 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--warning) 45%, transparent); } }
.eyebrow-s { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted-fg); margin-top: 4px; }
.feed { display: flex; flex-direction: column; gap: 10px; }
.tile.accent .feed { flex: none; }
.fi { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.fi i { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 10px var(--accent); }
.fi small { display: block; color: var(--muted-fg); font-size: 12px; }
.fi.new { animation: slidein .6s cubic-bezier(.2,.9,.25,1.2); }
@keyframes slidein { from { opacity: 0; transform: translateY(-10px); max-height: 0; } to { max-height: 60px; } }

/* bars */
.bars { flex: 1; display: flex; align-items: flex-end; gap: 10px; min-height: 0; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
.bar .col { width: 100%; border-radius: 10px 10px 6px 6px; background: color-mix(in srgb, var(--fg) 10%, transparent); height: 0; transition: height .9s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--k) * 50ms); position: relative; }
.bar.hi .col { background: linear-gradient(180deg, var(--accent), var(--primary)); box-shadow: 0 10px 30px -8px var(--primary); }
.bar .col b { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; white-space: nowrap; opacity: 0; transition: opacity .2s; }
.bar:hover .col b, .bar.hi .col b { opacity: 1; }
.bar small { font-size: 11px; color: var(--muted-fg); }

/* pipeline, meters */
.segbar { display: flex; gap: 4px; height: 12px; }
.segbar span { border-radius: 6px; width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); }
.legend { display: flex; flex-direction: column; gap: 9px; }
.lg { display: flex; align-items: center; gap: 10px; color: var(--muted-fg); font-size: 13px; }
.lg i { width: 8px; height: 8px; border-radius: 50%; }
.lg b { margin-left: auto; color: var(--fg); font-weight: 600; }
.meter .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
.meter .row b { font-weight: 600; }
.meter .track { height: 7px; border-radius: 7px; background: color-mix(in srgb, var(--fg) 8%, transparent); overflow: hidden; }
.meter .track i { display: block; height: 100%; width: 0; border-radius: 7px; transition: width 1s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--k) * 70ms); }
.kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--glass-line); font-size: 13px; }
.kv span { color: var(--muted-fg); }
.kv b { font-weight: 600; }
.link { color: var(--accent); font-weight: 600; font-size: 13px; margin-top: auto; display: inline-flex; align-items: center; gap: 6px; }

/* tile states */
.msg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 8px; }
.msg .mi { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
.msg b { font-weight: 600; }
.msg small { color: var(--muted-fg); max-width: 260px; }
.msg.row { flex-direction: row; text-align: left; gap: 14px; }
.msg.row > div { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.msg.row small { max-width: none; }
.sk { border-radius: 10px; background: color-mix(in srgb, var(--fg) 8%, transparent); position: relative; overflow: hidden; }
.sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--fg) 10%, transparent), transparent); animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.big-error { grid-column: 1 / -1; grid-row: span 3; }

/* ---------- dock: prototype states ---------- */
.dock { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px; background: var(--glass-strong); max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
.dock button { white-space: nowrap; }
.dock small { padding: 0 10px 0 12px; color: var(--muted-fg); font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.dock button { height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted-fg); }
.dock button.on { background: color-mix(in srgb, var(--fg) 10%, transparent); color: var(--fg); }

/* ---------- command palette ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--bg) 45%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: none; align-items: flex-start; justify-content: center; padding-top: 14vh; }
.scrim.open { display: flex; animation: fade .2s forwards; opacity: 0; }
.palette { width: min(620px, calc(100vw - 32px)); border-radius: 24px; overflow: hidden; background: var(--glass-strong); animation: pop .3s cubic-bezier(.2,.9,.25,1.2); }
@keyframes pop { from { transform: translateY(-8px) scale(.97); opacity: 0; } }
.palette .in { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 60px; border-bottom: 1px solid var(--glass-line); }
.palette input { flex: 1; font: 500 16px var(--font); background: none; border: 0; color: var(--fg); outline: none; }
.palette .list { max-height: 50vh; overflow: auto; padding: 8px; }
.palette h6 { margin: 10px 12px 6px; font-size: 11px; letter-spacing: 1.2px; color: var(--muted-fg); text-transform: uppercase; }
.palette .opt { display: flex; align-items: center; gap: 12px; width: 100%; height: 42px; padding: 0 12px; border-radius: 12px; text-align: left; }
.palette .opt.sel, .palette .opt:hover { background: color-mix(in srgb, var(--primary) 18%, transparent); }
.palette .opt span { flex: 1; }

/* ---------- phone: top bar, bottom island tab bar, menu sheet ---------- */
.mtop, .mtabs, .sheet { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; padding: 12px 12px 0; }
  .side, .topbar, .head .actions { display: none; }
  .mtop { display: flex; align-items: center; gap: 8px; position: sticky; top: 10px; z-index: 30; height: 56px; padding: 0 8px 0 14px; border-radius: 999px; }
  .mtop .brand { height: auto; padding: 0; flex: 1; }
  .bento { grid-template-columns: 1fr; grid-auto-rows: auto; }
  .w2, .h2 { grid-column: auto; grid-row: auto; }
  .tile { min-height: 190px; }
  .tile.chart { min-height: 260px; }
  .big-error { grid-row: auto; min-height: 380px; }
  .mrange { display: flex !important; }
  .mtabs { display: flex; position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 45; gap: 2px; padding: 6px; border-radius: 999px; background: var(--glass-strong); }
  .mtabs button { width: 58px; height: 48px; border-radius: 999px; display: grid; place-items: center; color: var(--muted-fg); position: relative; }
  .mtabs button.on { color: var(--primary-fg); background: var(--primary); box-shadow: 0 8px 22px -8px var(--primary); }
  .mtabs .badge { position: absolute; top: 8px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--magenta); }
  .dock { bottom: 82px; max-width: calc(100vw - 24px); overflow-x: auto; }
  .dock small { display: none; }
  .main { padding-bottom: 150px; }
  .sheet { position: fixed; inset: auto 10px 10px; z-index: 70; border-radius: 28px; padding: 10px; max-height: 80vh; overflow: auto; display: none; flex-direction: column; animation: up .4s cubic-bezier(.2,.9,.25,1.1); }
  .sheet.open { display: flex; }
  .sheet .nav { flex: none; overflow: visible; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 5px; background: var(--glass-line); margin: 4px auto 8px; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
}
.mrange { display: none; align-items: center; gap: 8px; }


/* ---------- detail: a tile grows into a full analysis panel ---------- */
.tile.live { cursor: pointer; }
.tile.live:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.dover { position: fixed; inset: 0; z-index: 55; display: none; padding: 24px; background: color-mix(in srgb, var(--bg) 55%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.dover.open { display: grid; place-items: center; }
.detail { width: min(1240px, 100%); height: min(880px, calc(100vh - 48px)); border-radius: 28px; background: var(--glass-strong); overflow: hidden; transform-origin: 0 0; display: flex; flex-direction: column; }
.dcontent { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.dh { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--glass-line); flex: none; }
.dh .ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--primary); color: var(--primary-fg); box-shadow: 0 10px 24px -10px var(--primary); flex: none; }
.dh .dt { flex: 1; min-width: 0; }
.dh .dt b { display: block; font: 600 20px var(--display); letter-spacing: -.3px; }
.dh .dt small { color: var(--muted-fg); font-size: 12px; }
.tg { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: color-mix(in srgb, var(--fg) 6%, transparent); }
.tg i { position: relative; width: 28px; height: 16px; border-radius: 8px; background: color-mix(in srgb, var(--fg) 18%, transparent); transition: background .2s; }
.tg i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); transition: left .25s cubic-bezier(.2,.9,.25,1.2); }
.tg.on i { background: var(--primary); }
.tg.on i::after { left: 14px; background: var(--primary-fg); }
.nav2 { display: flex; gap: 2px; }
.ibtn[disabled] { opacity: .3; cursor: default; }
.dbody { flex: 1; min-height: 0; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat, .dcard { border-radius: 20px; background: color-mix(in srgb, var(--card) 55%, transparent); border: 1px solid var(--glass-line); }
.stat { min-width: 0; padding: 16px; display: flex; flex-direction: column; gap: 6px; animation: rise .5s cubic-bezier(.2,.8,.2,1) backwards; }
.stat:nth-child(2) { animation-delay: 50ms; } .stat:nth-child(3) { animation-delay: 100ms; } .stat:nth-child(4) { animation-delay: 150ms; }
.stat span { color: var(--muted-fg); font-size: 12px; }
.stat b { font: 600 24px var(--display); letter-spacing: -.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat em { font-style: normal; font-size: 12px; font-weight: 600; }
.stat em.good { color: var(--success-text); }
.stat em.bad { color: var(--error-text); }
.stat em small { color: var(--muted-fg); font-weight: 400; }
.dgrid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; }
.dcard { padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dcard h4 { margin: 0; font-size: 14px; font-weight: 600; }
.dcard.wide:last-child { grid-column: 1 / -1; }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px; }
.lgb { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--fg) 6%, transparent); transition: opacity .2s; }
.lgb i { width: 10px; height: 10px; border-radius: 3px; }
.lgb.off { opacity: .4; text-decoration: line-through; }
/* line chart: HTML axes over a stretched SVG whose strokes keep their width */
.lc { position: relative; margin: 10px 0 28px 52px; }
.lc svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; animation: reveal 1s cubic-bezier(.2,.8,.2,1); }
@keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.lc .ln { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.lc .ln.dash { stroke-dasharray: 6 6; stroke-width: 2; }
.gl { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--glass-line); }
.gl span { position: absolute; right: 100%; margin-right: 10px; transform: translateY(-50%); font-size: 11px; color: var(--muted-fg); white-space: nowrap; }
.xl { position: absolute; left: 0; right: 0; top: 100%; height: 22px; }
.xl span { position: absolute; top: 8px; transform: translateX(-50%); font-size: 11px; color: var(--muted-fg); white-space: nowrap; }
.xh { position: absolute; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--fg) 30%, transparent); opacity: 0; pointer-events: none; }
.pt { position: absolute; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 3px var(--card); opacity: 0; pointer-events: none; }
.lc.hover .xh, .lc.hover .pt { opacity: 1; }
/* bar chart */
.bc { position: relative; display: flex; align-items: flex-end; gap: 3px; margin-bottom: 22px; }
.bcol { position: relative; flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.bcol .stack { width: 100%; max-width: 38px; display: flex; flex-direction: column-reverse; border-radius: 6px 6px 3px 3px; overflow: hidden; transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.8,.2,1) backwards; transition: opacity .2s; }
.bcol .stack i { display: block; min-height: 0; }
.bcol small { position: absolute; bottom: -20px; font-size: 11px; color: var(--muted-fg); white-space: nowrap; }
.bc:hover .bcol .stack { opacity: .45; }
.bc .bcol.on .stack { opacity: 1; }
@keyframes grow { from { transform: scaleY(0); } }
/* donut, heatmap, table */
.donut { position: relative; width: 180px; height: 180px; margin: 4px auto 8px; }
.donut svg { width: 100%; height: 100%; animation: spinin .9s cubic-bezier(.2,.8,.2,1); }
@keyframes spinin { from { transform: rotate(-90deg) scale(.85); opacity: 0; } }
.donut .dc { position: absolute; inset: 0; display: grid; place-items: center; }
.donut .dc b { font: 600 26px var(--display); }
.hm { display: grid; grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 3px; align-items: center; }
.hm i { aspect-ratio: 1; border-radius: 4px; background: var(--primary); }
.hm small { font-size: 11px; color: var(--muted-fg); }
.hm em { grid-row: 8; font-style: normal; font-size: 10px; color: var(--muted-fg); }
.hm span { grid-row: 8; grid-column: 1; }
.tb { width: 100%; border-collapse: collapse; font-size: 13px; }
.tb th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted-fg); padding: 8px 10px; border-bottom: 1px solid var(--glass-line); }
.tb td { padding: 10px; border-bottom: 1px solid var(--glass-line); }
.delta.down { background: var(--error-surface); color: var(--error-text); }
.ctip { position: fixed; z-index: 80; pointer-events: none; min-width: 170px; padding: 10px 12px; border-radius: 14px; background: var(--glass-strong); font-size: 12px; display: flex; flex-direction: column; gap: 5px; opacity: 0; transition: opacity .15s; }
.ctip.on { opacity: 1; }
.ctip div { display: flex; align-items: center; gap: 8px; color: var(--muted-fg); }
.ctip div i { width: 8px; height: 8px; border-radius: 50%; }
.ctip div span { margin-left: auto; padding-left: 12px; color: var(--fg); font-weight: 600; }
@media (max-width: 860px) {
  .dover { padding: 0; }
  .dover.open { place-items: end center; }
  .detail { height: 92vh; border-radius: 28px 28px 0 0; }
  .dh { flex-wrap: wrap; }
  .dh .dt { min-width: calc(100% - 110px); }
  .dh [data-export] { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 12px; }
  .stat b { font-size: 19px; }
  .stat em small { display: none; }
  .dgrid { grid-template-columns: 1fr; }
  .dcard.wide:last-child { grid-column: auto; }
  .lc { margin-left: 44px; }
}

/* ---------- top bar: search centred, the page island with status, notifications and account on the right ---------- */
.topbar { position: sticky; top: 16px; z-index: 30; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.topbar .search { grid-column: 2; height: 52px; width: min(480px, 40vw); padding: 0 10px 0 18px; background: var(--glass-strong); transition: width .5s cubic-bezier(.2,.9,.25,1); }
.topbar .island { grid-column: 3; justify-self: end; min-width: 0; max-width: 100%; }
/* while the island reports a status, the search yields room instead of being covered */
.topbar:has(.island.live) .search { width: min(320px, 26vw); }
.topbar .pocket { min-width: 0; text-overflow: ellipsis; }
.head .actions { display: flex; align-items: center; gap: 8px; }
.head .actions .ibtn { background: var(--glass-strong); border: 1px solid var(--glass-line); }


/* ---------- notification settings ---------- */
.ns-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
.ns-grid .w1 { grid-column: span 1; } .ns-grid .w4 { grid-column: 1 / -1; }
.ns-grid .tile { cursor: default; }
.ns-grid .tile:hover { transform: none; }
.ns-grid .tc { overflow: visible; margin-right: 0; padding-right: 0; }
.ns-err { min-height: 360px; }
.nacts { display: flex; align-items: center; gap: 10px; }
.savep { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--success-text); background: var(--success-surface); transition: background .2s, color .2s; }
.savep.saving { color: var(--muted-fg); background: color-mix(in srgb, var(--fg) 7%, transparent); }
.savep.saving svg { animation: spin .9s linear infinite; }
.banner { flex-direction: row; align-items: center; gap: 14px; border-color: color-mix(in srgb, var(--warning) 45%, var(--glass-line)); }
.banner .ai { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.banner .tx { flex: 1; } .banner .tx b { display: block; } .banner .tx small { color: var(--muted-fg); }
.ch-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--glass-line); }
.ch-row:last-child { border-bottom: 0; }
.ch-row .ai { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--fg) 7%, transparent); }
.ch-row .tx { flex: 1; min-width: 0; }
.ch-row .tx b { display: block; font-weight: 600; }
.ch-row .tx small { color: var(--muted-fg); font-size: 12px; }
.delta.warn { background: var(--warning-surface); color: var(--warning-text); }
.sw { position: relative; width: 42px; height: 24px; border-radius: 12px; flex: none; background: color-mix(in srgb, var(--fg) 16%, transparent); transition: background .2s; }
.sw i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--fg); transition: left .25s cubic-bezier(.2,.9,.25,1.2); }
.sw.on { background: var(--primary); }
.sw.on i { left: 21px; background: var(--primary-fg); }
.sw:disabled, .ck:disabled, .cht:disabled { opacity: .35; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; }
.field.row { flex-direction: row; align-items: center; gap: 10px; }
.field.off { opacity: .45; }
.field label { font-size: 13px; color: var(--muted-fg); }
.field .tx { flex: 1; } .field .tx b { display: block; font-weight: 600; font-size: 13px; } .field .tx small { color: var(--muted-fg); font-size: 12px; }
.field .rl { display: flex; justify-content: space-between; align-items: baseline; }
.field .rl b { font: 600 18px var(--display); }
.ns-seg { align-self: flex-start; flex-wrap: wrap; }
.ns-seg button.on { background: var(--primary); color: var(--primary-fg); }
input[type="range"] { width: 100%; accent-color: var(--primary); }
.time { font: 500 14px var(--font); color: var(--fg); padding: 7px 10px; border-radius: 10px; border: 1px solid var(--glass-line); background: color-mix(in srgb, var(--fg) 6%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipt { height: 32px; padding: 0 13px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--glass-line); transition: background .2s; }
.chipt.on { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
/* preview: a push card, the email it sends and where it goes */
.pv-push { display: flex; gap: 12px; padding: 14px; border-radius: 18px; background: color-mix(in srgb, var(--card) 70%, transparent); border: 1px solid var(--glass-line); box-shadow: 0 16px 40px -20px rgb(0 0 0 / .5); animation: rise .4s cubic-bezier(.2,.8,.2,1); }
.pv-app { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--fg) 8%, transparent); }
.pv-app .mark { width: 24px; height: 24px; }
.pv-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.pv-tx span { color: var(--muted-fg); }
.pv-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted-fg); }
.pv-top b { color: var(--fg); font-weight: 600; }
.pv-mail { margin-top: 10px; padding: 14px; border-radius: 18px; border: 1px dashed var(--glass-line); font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.pv-mail small { display: inline-block; width: 64px; color: var(--muted-fg); }
.pv-mail p { margin: 4px 0 0; color: var(--muted-fg); }
.pv-route { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.muted-s { font-size: 12px; color: var(--muted-fg); margin-right: 2px; }
/* events: a matrix on wide screens, cards with channel chips on phones */
.mx { width: 100%; border-collapse: collapse; font-size: 13px; }
.mx th { padding: 10px 8px; font-size: 12px; font-weight: 600; color: var(--muted-fg); text-align: center; white-space: nowrap; }
.mx th svg { width: 15px; height: 15px; vertical-align: -3px; margin-right: 6px; }
.mx th:first-child, .mx td:first-child { text-align: left; }
.mx th.dim { opacity: .4; }
.mx td { padding: 10px 8px; border-top: 1px solid var(--glass-line); text-align: center; }
.mx td b { display: block; font-weight: 600; }
.mx td small { color: var(--muted-fg); font-size: 12px; }
.mx .grp td { padding: 14px 8px 6px; border-top: 0; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted-fg); }
.mx tr.ev { cursor: pointer; transition: background .2s; }
.mx tr.ev:hover td { background: color-mix(in srgb, var(--fg) 3%, transparent); }
.mx tr.sel td { background: color-mix(in srgb, var(--primary) 10%, transparent); }
.mx tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
.ck { width: 26px; height: 26px; border-radius: 8px; display: inline-grid; place-items: center; border: 1.5px solid color-mix(in srgb, var(--fg) 25%, transparent); transition: background .2s, border-color .2s; }
.ck svg { width: 14px; height: 14px; opacity: 0; transform: scale(.5); transition: opacity .2s, transform .25s cubic-bezier(.2,.9,.25,1.4); }
.ck.on { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.ck.on svg { opacity: 1; transform: none; }
.evcards { display: none; flex-direction: column; gap: 14px; }
.evg h5 { margin: 4px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted-fg); }
.evc { padding: 12px; border-radius: 16px; border: 1px solid var(--glass-line); background: color-mix(in srgb, var(--card) 50%, transparent); display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.evc.sel { border-color: color-mix(in srgb, var(--primary) 55%, transparent); }
.evh { display: flex; align-items: center; gap: 8px; } .evh b { flex: 1; font-weight: 600; font-size: 13px; }
.evch { display: flex; flex-wrap: wrap; gap: 6px; }
.cht { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--glass-line); color: var(--muted-fg); }
.cht svg { width: 14px; height: 14px; }
.cht.on { background: color-mix(in srgb, var(--primary) 22%, transparent); border-color: color-mix(in srgb, var(--primary) 50%, transparent); color: var(--fg); }

/* ---------- bell popover and in-app toast ---------- */
.npop { position: fixed; top: 84px; right: 16px; z-index: 65; width: 380px; max-height: 70vh; border-radius: 22px; background: color-mix(in srgb, var(--card) 90%, transparent); border: 1px solid var(--glass-line); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(24px) saturate(150%); backdrop-filter: blur(24px) saturate(150%); display: none; flex-direction: column; overflow: hidden; }
.npop.open { display: flex; animation: pop .3s cubic-bezier(.2,.9,.25,1.2); }
.npop header, .npop footer { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; }
.npop header { border-bottom: 1px solid var(--glass-line); }
.npop footer { border-top: 1px solid var(--glass-line); justify-content: center; }
.npop .nlist { overflow: auto; padding: 6px 8px; }
.avatar { border: 0; padding: 0; cursor: pointer; transition: box-shadow .2s, transform .2s; }
.avatar:hover, .avatar[aria-expanded="true"] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 45%, transparent); }
.avatar:active { transform: scale(.94); }
.pmenu { width: 300px; }
.pmenu .who { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--glass-line); }
.pmenu .who .avatar { cursor: default; box-shadow: none; transform: none; }
.pmenu .who b { display: block; font-weight: 600; }
.pmenu .who small { display: block; color: var(--muted-fg); font-size: 12px; }
.pmenu .plist { display: flex; flex-direction: column; gap: 2px; padding: 8px; }
.pmenu .plist + .plist { border-top: 1px solid var(--glass-line); }
.prow { display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 10px; border-radius: 12px; color: var(--muted-fg); font-size: 14px; text-align: left; }
.prow:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); color: var(--fg); }
.prow .lbl { flex: 1; }

function countUp(el) {
  const to = +el.dataset.count, start = performance.now(), dur = 1100
  const step = (now) => {
    const p = Math.min(1, (now - start) / dur), e = 1 - (1 - p) ** 3
    el.textContent = fmt(Math.round(to * e))
    if (p < 1) requestAnimationFrame(step)
  }

}

/* island: a pocket that opens for live status, then folds back */
let pocketTimer
function island(html, ms = 2600, loading = false) {
  const isl = $('#island'), p = $('#pocket')
  p.innerHTML = html
  isl.classList.add('live'); isl.classList.toggle('loading', loading)
  clearTimeout(pocketTimer)
  pocketTimer = setTimeout(() => isl.classList.remove('live', 'loading'), ms)
}
function refresh() {
  if (S.view === 'error' || S.view === 'loading') return
  $$('#refreshBtn, #mrefresh').forEach((b) => { b.classList.add('spin') })
  island(`<span class="pdot">${ico('refresh')}</span>${t('Updating figures…')}<span class="bar"><i></i></span>`, 1700, true)
  setTimeout(() => {
    $$('#refreshBtn, #mrefresh').forEach((b) => { b.classList.remove('spin') })
    island(`<span class="pdot" style="color:var(--success-text);background:var(--success-surface)">${ico('check')}</span>${t('Up to date · just now')}`, 1800)
    render()
  }, 1700)
}

  ['Navigation', NAV.flatMap(([, items]) => items).map(([i, l, , p]) => [i, l, () => go(p || 'stub')])],
  ['Actions', [
    [THEME_ICON[S.theme], 'Switch theme', cycleTheme],

let sel = 0
function paletteList() {
  const q = $('#pq').value.trim().toLowerCase()
  const groups = COMMANDS().map(([g, list]) => [g, list.filter(([, l]) => t(l).toLowerCase().includes(q))]).filter(([, l]) => l.length)
  const flat = groups.flatMap(([, l]) => l)
  sel = Math.min(sel, flat.length - 1)
  let k = 0
  $('#plist').innerHTML = groups.map(([g, l]) => `<h6>${t(g)}</h6>` + l.map(([i, label]) => `<button type="button" class="opt${k === sel ? ' sel' : ''}" data-k="${k++}">${ico(i)}<span>${t(label)}</span>${ico('right')}</button>`).join('')).join('')
  return flat
}

function closePalette() { $('#scrim').classList.remove('open') }

document.addEventListener('click', (e) => {
  if (detailClick(e) || resClick(e)) return
  const b = e.target.closest('button, [data-open]')
  if (!b) { if (e.target.id === 'scrim') closePalette(); if (!e.target.closest('#npop')) closePop(); if (!e.target.closest('#ppop')) closeProfile(); return }
  if (!('profile' in b.dataset) && (!b.closest('#ppop') || b.dataset.page || 'signout' in b.dataset)) closeProfile()
  if (!b.closest('#npop') && b.id !== 'bellBtn' && b.dataset.tab !== 'alerts') closePop()
  if (demoClick(b) || nsClick(b)) return
  if (b.dataset.page) { go(b.dataset.page); if (b.dataset.pview) setView(b.dataset.pview); return }
  if (b.dataset.tab) return b.dataset.tab === 'alerts' ? togglePop() : go(b.dataset.tab)
  if ('profile' in b.dataset) return toggleProfile()
  if (b.dataset.pref === 'lang') return toggleLang()
  if (b.dataset.pref === 'theme') return cycleTheme()
  if ('signout' in b.dataset) return toast(t('Signed out'), t('Prototype only: you stay signed in.'))
  if ('readall' in b.dataset) { unread = 0; $('#npop').innerHTML = popHTML(); return badges() }
  if (b.id === 'themeBtn' || (b.closest('#sprefs') && b.querySelector('use[href^="#i-moon"], use[href^="#i-sun"], use[href^="#i-contrast"]'))) return cycleTheme()
  if (b.id === 'langBtn' || (b.closest('#sprefs') && b.querySelector('use[href="#i-languages"]'))) return toggleLang()
  if (b.id === 'collapseBtn') return toggleCollapse()
  if (b.id === 'refreshBtn' || b.id === 'mrefresh') return refresh()
  if (b.id === 'bellBtn') return togglePop()
  if (b.id === 'menuTab') return $('#sheet').classList.toggle('open')
  if (b.dataset.open === 'palette') return openPalette()
  if (b.dataset.range) { S.range = b.dataset.range; seg($('#seg')); seg($('#mseg')); return render() }
  if (b.dataset.view) return setView(b.dataset.view)
  if ('online' in b.dataset) return setView('default')
  if ('retry' in b.dataset) { putView('loading'); render(); setTimeout(() => { putView('default'); renderDock(); render() }, 1200); return }
  if (b.classList.contains('opt')) { sel = +b.dataset.k; return runSel() }
})
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return $('#scrim').classList.contains('open') ? closePalette() : openPalette() }
  if (!$('#scrim').classList.contains('open')) { if (e.key === 'Escape') { $('#sheet').classList.remove('open'); closePop(); closeProfile() } return }
  if (e.key === 'Escape') closePalette()
  else if (e.key === 'ArrowDown') { sel++; paletteList(); e.preventDefault() }
  else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); paletteList(); e.preventDefault() }
  else if (e.key === 'Enter') runSel()
})
$('#pq').addEventListener('input', () => { sel = 0; paletteList() })

const loc = () => (S.lang === 'uk' ? 'uk-UA' : 'en-US')
const compact = (n) => new Intl.NumberFormat(loc(), { notation: 'compact', maximumFractionDigits: 1 }).format(n)
const pct = (n) => `${new Intl.NumberFormat(loc(), { maximumFractionDigits: 1 }).format(n)}%`

/* deterministic data: the same range always draws the same curve */
const rnd = (seed) => () => {
  seed = (seed + 0x6d2b79f5) | 0
  let x = Math.imul(seed ^ (seed >>> 15), 1 | seed)
  x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x
  return ((x ^ (x >>> 14)) >>> 0) / 4294967296
}
const gen = (seed, n, base, { trend = 0.1, noise = 0.08, weekly = 0.12 } = {}) => {
  const r = rnd(seed * 97 + n)
  return Array.from({ length: n }, (_, i) => {
    const day = (i + 3) % 7
    const w = day >= 5 ? 1 + weekly : 1 - weekly / 3
    return Math.max(0, Math.round(base * (1 + (trend * i) / n) * w * (1 + (r() - 0.5) * noise * 2)))
  })
}
const dates = (n) => {
  const end = new Date(2026, 9, 20)
  return Array.from({ length: n }, (_, i) => new Date(end.getTime() - (n - 1 - i) * 864e5))
}
const dfmt = (d) => new Intl.DateTimeFormat(loc(), { day: 'numeric', month: 'short' }).format(d)
const sum = (a) => a.reduce((x, y) => x + y, 0)
const delta = (cur, prev) => (prev ? ((cur - prev) / prev) * 100 : 0)
const DT = { open: false, key: null, compare: true, hidden: new Set(), charts: {} }

/* ---------- chart primitives (HTML + non-scaling SVG, crisp at any width) ---------- */
let chartSeq = 0
function lineChart({ labels, series, fmt: f = compact, height = 300, y0 = true }) {
  const id = `c${++chartSeq}`
  const vis = series.filter((s) => !DT.hidden.has(s.name))
  const all = vis.flatMap((s) => s.values)
  const max = Math.max(...all, 1) * 1.08
  const min = y0 ? 0 : Math.min(...all) * 0.92
  const n = labels.length
  const X = (i) => (n === 1 ? 50 : (i / (n - 1)) * 100)
  const Y = (v) => 100 - ((v - min) / (max - min || 1)) * 100
  const path = (vals) => vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(2)} ${Y(v).toFixed(2)}`).join(' ')
  DT.charts[id] = { labels, series: vis, f, X, Y }
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((p) => min + (max - min) * p)
  const step = Math.ceil(n / 8)
  return `<div class="lc" id="${id}" style="height:${height}px">
    ${ticks.map((v) => `<div class="gl" style="top:${Y(v)}%"><span>${f(Math.round(v))}</span></div>`).join('')}
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>${vis.map((s, k) => `<linearGradient id="${id}g${k}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".32"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>
      ${vis.map((s, k) => (s.area ? `<path class="ar" d="${path(s.values)} L100 100 L0 100 Z" fill="url(#${id}g${k})"/>` : '')).join('')}
      ${vis.map((s) => `<path class="ln${s.dashed ? ' dash' : ''}" d="${path(s.values)}" stroke="${s.color}" vector-effect="non-scaling-stroke"/>`).join('')}
    </svg>
    <div class="xh"></div>${vis.map((s) => `<i class="pt" style="background:${s.color}"></i>`).join('')}
    <div class="xl">${labels.map((l, i) => ((i === n - 1 || (i % step === 0 && n - 1 - i >= step / 2)) ? `<span style="left:${X(i)}%">${l}</span>` : '')).join('')}</div>
  </div>`
}
function barChart({ labels, stacks, fmt: f = compact, height = 260 }) {
  const id = `c${++chartSeq}`
  const vis = stacks.filter((s) => !DT.hidden.has(s.name))
  const totals = labels.map((_, i) => sum(vis.map((s) => s.values[i])))
  const max = Math.max(...totals, 1) * 1.1
  DT.charts[id] = { labels, series: vis, f, bars: true }
  const step = Math.ceil(labels.length / 8)
  return `<div class="bc" id="${id}" style="height:${height}px">${labels
    .map(
      (l, i) => `<div class="bcol" data-i="${i}"><div class="stack" style="height:${(totals[i] / max) * 100}%">${vis
        .map((s) => `<i style="flex:${s.values[i]};background:${s.color}"></i>`)
        .join('')}</div><small>${(i === labels.length - 1 || (i % step === 0 && labels.length - 1 - i >= step / 2)) ? l : ''}</small></div>`,
    )
    .join('')}</div>`
}
const legend = (series) =>
  `<div class="legend-row">${series
    .map((s) => `<button type="button" class="lgb${DT.hidden.has(s.name) ? ' off' : ''}" data-series="${s.name}"><i style="background:${s.color}${s.dashed ? ';opacity:.5' : ''}"></i>${t(s.name)}</button>`)
    .join('')}</div>`
const donut = (parts, centre) => {
  const total = sum(parts.map((p) => p[1]))
  let acc = 0
  return `<div class="donut"><svg viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="15.915" fill="none" stroke="var(--glass-line)" stroke-width="5"/>${parts
    .map(([, v, c]) => {
      const len = (v / total) * 100
      const seg = `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${25 - acc}"/>`
      acc += len
      return seg
    })
    .join('')}</svg><div class="dc"><b class="num">${centre ?? compact(total)}</b></div></div><div class="legend">${parts
    .map(([l, v, c]) => `<div class="lg"><i style="background:${c}"></i>${t(l)}<b class="num">${pct((v / total) * 100)}</b></div>`)
    .join('')}</div>`
}
const meters = (rows, fmtV = (v) => pct(v)) =>
  rows
    .map(([l, v, c, max = 100], k) => `<div class="meter"><div class="row"><span>${t(l)}</span><b class="num">${fmtV(v)}</b></div><div class="track"><i style="--k:${k};background:${c}" data-w="${(v / max) * 100}"></i></div></div>`)
    .join('')
const heatmap = () => {
  const r = rnd(42)
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
  return `<div class="hm">${days
    .map((d, di) => `<small>${t(d)}</small>${Array.from({ length: 24 }, (_, h) => {
      const v = Math.min(1, (0.15 + 0.85 * Math.exp(-((h - (di >= 5 ? 22 : 20)) ** 2) / 18) + 0.25 * Math.exp(-((h - 8) ** 2) / 6)) * (0.8 + r() * 0.35))
      return `<i title="${t(d)} ${h}:00" style="opacity:${(0.12 + v * 0.88).toFixed(2)}"></i>`
    }).join('')}`)
    .join('')}<span></span>${[0, 6, 12, 18, 23].map((h) => `<em style="grid-column:${h + 2}">${h}</em>`).join('')}</div>`
}
const table = (cols, rows) =>
  `<table class="tb"><thead><tr>${cols.map((c) => `<th>${t(c)}</th>`).join('')}</tr></thead><tbody>${rows
    .map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`)
    .join('')}</tbody></table>`
const chip = (tone, label) => `<span class="delta ${tone}">${t(label)}</span>`
const stat = (label, value, d, inverse) => {
  const up = d >= 0
  const good = inverse ? !up : up
  return `<div class="stat"><span>${t(label)}</span><b class="num">${value}</b>${d === null ? '' : `<em class="${good ? 'good' : 'bad'}">${up ? '▲' : '▼'} ${pct(Math.abs(d))} <small>${t('vs previous')}</small></em>`}</div>`
}
const card = (title, body, cls = '') => `<section class="dcard ${cls}"><h4>${t(title)}</h4>${body}</section>`

/* ---------- the eight analyses ---------- */
function detail(key) {
  const n = N[S.range]
  const ds = dates(n)
  const labels = ds.map(dfmt)
  const C = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim()
  const P = C('--primary'), A = C('--accent'), B = C('--blue'), G = C('--success'), W = C('--warning'), E = C('--error'), M = C('--magenta'), Mu = C('--muted-fg')
  const prevLine = (vals, name = 'Previous period') => (DT.compare ? [{ name, color: Mu, values: vals, dashed: true }] : [])
  switch (key) {
    case 'listens': {
      const cur = gen(1, n, 240000, { trend: 0.18 }), prev = gen(2, n, 215000, { trend: 0.1 })
      const peak = cur.indexOf(Math.max(...cur))
      const series = [{ name: 'Listens', color: P, values: cur, area: true }, ...prevLine(prev)]
      return {
        icon: 'wave', title: 'Listens per day', sub: `${compact(sum(cur))} ${t('listens')}`,
        stats: [stat('Total listens', compact(sum(cur)), delta(sum(cur), sum(prev))), stat('Daily average', compact(sum(cur) / n), delta(sum(cur), sum(prev))), stat('Peak day', `${compact(cur[peak])} · ${labels[peak]}`, null), stat('Unique listeners', compact(31240 * Math.sqrt(n / 7)), 6.4)],
        main: card('Listens', legend(series) + lineChart({ labels, series })),
        side: card('By platform', donut([['Web', 46, P], ['Mobile', 41, B], ['Desktop', 13, M]], compact(sum(cur)))),
        extra: [card('Listening by hour', heatmap(), 'wide'), card('Top genres', meters([['Electronic', 31, P], ['Indie', 24, B], ['Hip-hop', 19, M], ['Ambient', 14, G], ['Jazz', 7, W]], (v) => pct(v)))],
      }
    }
    case 'listeners': {
      const daily = gen(3, n, 60, { trend: 0.2, noise: 0.25 })
      let tot = 48920 - sum(daily)
      const total = daily.map((d) => (tot += d))
      const dau = total.map((v, i) => Math.round(v * (0.27 + 0.03 * Math.sin(i / 2))))
      const series = [{ name: 'Total listeners', color: P, values: total, area: true }, { name: 'Active (DAU)', color: B, values: dau }]
      return {
        icon: 'users', title: 'Listeners', sub: `${fmt(48920)} · +${fmt(sum(daily))}`,
        stats: [stat('Total listeners', fmt(48920), 3.2), stat('New sign-ups', fmt(sum(daily)), 8.1), stat('Churned', fmt(Math.round(sum(daily) * 0.18)), -2.4, true), stat('DAU / MAU', pct(31.6), 1.2)],
        main: card('Total listeners', legend(series) + lineChart({ labels, series, y0: false })),
        side: card('Retention', meters([['Day 1', 62, P], ['Day 7', 38, B], ['Day 30', 21, M]])),
        extra: [card('Top countries', meters([['Ukraine', 34, P], ['Poland', 18, B], ['Germany', 14, M], ['USA', 11, G], ['Other', 23, Mu]]), 'wide'), card('New sign-ups', barChart({ labels, stacks: [{ name: 'New sign-ups', color: A, values: daily }], height: 200 }))],
      }
    }
    case 'artists': {
      const daily = gen(4, n, 6, { trend: 0.3, noise: 0.5 })
      let tot = 2316 - sum(daily)
      const total = daily.map((d) => (tot += d))
      const verified = total.map((v) => Math.round(v * 0.61))
      const series = [{ name: 'Total artists', color: P, values: total, area: true }, { name: 'Verified', color: G, values: verified }]
      return {
        icon: 'mic', title: 'Artists', sub: `${fmt(2316)} · ${pct(61)} ${t('Verified').toLowerCase()}`,
        stats: [stat('Total artists', fmt(2316), 1.4), stat('New artists', fmt(sum(daily)), 12.5), stat('Verified', pct(61), 2.1), stat('Pending verification', '38', -9.5, true)],
        main: card('Total artists', legend(series) + lineChart({ labels, series, y0: false })),
        side: card('Verification funnel', meters([['Submitted', 112, P, 112], ['In review', 74, B, 112], ['Verified', 68, G, 112]], (v) => fmt(v))),
        extra: [card('Newest artists', table(['Item', 'Status', 'Age'], [['Kite Harbor', chip('up', 'Verified'), `1 ${t('h')}`], ['Lumen Choir', chip('flat', 'In review'), `5 ${t('h')}`], ['Mira Sol', chip('up', 'Verified'), `1 ${t('d')}`], ['Nova & the Static', chip('flat', 'Submitted'), `2 ${t('d')}`]]), 'wide')],
      }
    }
    case 'action': {
      const filed = gen(5, n, 19, { noise: 0.4 }), resolved = filed.map((v, i) => Math.max(0, v - 2 + ((i * 7) % 5)))

function detailHTML() {
  chartSeq = 0
  DT.charts = {}
  const d = detail(DT.key)
  const i = DKEYS.indexOf(DT.key)
  return `<header class="dh">
      <span class="ico">${ico(d.icon)}</span>
      <div class="dt"><b>${t(d.title)}</b><small>${d.sub}</small></div>
      <div class="seg" id="dseg"><span class="thumb"></span></div>
      <button type="button" class="tg${DT.compare ? ' on' : ''}" data-compare><i></i>${t('Compare')}</button>
      <button type="button" class="pill ghost" data-export>${ico('download')}${t('Export')}</button>
      <div class="nav2"><button type="button" class="ibtn" data-step="-1" aria-label="${t('Previous')}" ${i ? '' : 'disabled'}>${ico('left')}</button><button type="button" class="ibtn" data-step="1" aria-label="${t('Next')}" ${i < DKEYS.length - 1 ? '' : 'disabled'}>${ico('right')}</button></div>
      <button type="button" class="ibtn" data-close aria-label="${t('Close')}">${ico('x')}</button>
    </header>
    <div class="dbody">
      <div class="stats">${d.stats.join('')}</div>
      <div class="dgrid">${d.main}${d.side}${d.extra.join('')}</div>
    </div>`
}
function paintDetail() {
  const body = $('#detail .dcontent')
  const y = $('#detail .dbody')?.scrollTop ?? 0
  body.innerHTML = detailHTML()
  $('#detail .dbody').scrollTop = y
  dseg()
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('#detail [data-w]').forEach((c) => { c.style.width = `${c.dataset.w}%` })
  }))
}
function dseg() {
  const el = $('#dseg')
  el.innerHTML = '<span class="thumb"></span>' + ['7d', '30d', '90d'].map((r) => `<button type="button" data-drange="${r}" class="${r === S.range ? 'on' : ''}">${S.lang === 'uk' ? r.replace('d', ' дн') : r}</button>`).join('')
  requestAnimationFrame(() => {
    const on = $('.on', el), th = $('.thumb', el)
    th.style.left = `${on.offsetLeft}px`; th.style.width = `${on.offsetWidth}px`
  })
}
let fromTile = null
function openDetail(tl) {
  if (DT.open) return
  DT.open = true
  DT.key = tl.dataset.detail
  DT.hidden.clear()
  fromTile = tl
  const ov = $('#dover'), panel = $('#detail')
  ov.classList.add('open')
  document.body.style.overflow = 'hidden'
  paintDetail()
  const a = tl.getBoundingClientRect(), b = panel.getBoundingClientRect()
  tl.style.visibility = 'hidden'
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  panel.animate(
    [{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})`, borderRadius: '24px' }, { transform: 'none', borderRadius: '28px' }],
    { duration: reduce ? 1 : 520, easing: 'cubic-bezier(.2,.9,.25,1)' },
  )
  $('#detail .dcontent').animate([{ opacity: 0 }, { opacity: 0, offset: 0.35 }, { opacity: 1 }], { duration: reduce ? 1 : 520 })
  ov.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 })
  setTimeout(() => $('#detail [data-close]')?.focus(), 60)
}
function closeDetail() {
  if (!DT.open) return
  const ov = $('#dover'), panel = $('#detail'), tl = fromTile
  const done = () => {
    ov.classList.remove('open')
    document.body.style.overflow = ''
    DT.open = false
    if (tl) { tl.style.visibility = ''; tl.focus({ preventScroll: true }) }
  }
  if (!tl || !tl.isConnected) return done()
  const a = tl.getBoundingClientRect(), b = panel.getBoundingClientRect()
  $('#detail .dcontent').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' })
  ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, fill: 'forwards' })
  /* finish on the animation's end, or after a fallback delay when a slow renderer lags behind */
  let finished = false
  const finish = () => {
    if (finished) return
    finished = true
    done()
    $('#detail .dcontent').getAnimations().forEach((x) => { x.cancel() })
    ov.getAnimations().forEach((x) => { x.cancel() })
  }
  panel.animate([{ transform: 'none' }, { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})`, borderRadius: '24px' }], { duration: 420, easing: 'cubic-bezier(.4,0,.2,1)' }).onfinish = finish
  setTimeout(finish, 700)
}
function stepDetail(dir) {
  const i = DKEYS.indexOf(DT.key) + dir
  if (i < 0 || i >= DKEYS.length) return
  if (fromTile) fromTile.style.visibility = ''
  DT.key = DKEYS[i]
  DT.hidden.clear()
  fromTile = $(`[data-detail="${DT.key}"]`)
  if (fromTile) fromTile.style.visibility = 'hidden'
  const c = $('#detail .dcontent')
  c.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-dir * 24}px)` }], { duration: 140 }).onfinish = () => {
    paintDetail()
    $('#detail .dbody').scrollTop = 0
    c.animate([{ opacity: 0, transform: `translateX(${dir * 24}px)` }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.2,.9,.25,1)' })
  }
}
/* returns true when the click belonged to the detail feature */
function detailClick(e) {
  if (DT.open) {
    if (e.target.id === 'dover') { closeDetail(); return true }
    const b = e.target.closest('#detail button')
    if (!b) return e.target.closest('#detail') !== null
    if ('close' in b.dataset) closeDetail()
    else if (b.dataset.step) stepDetail(+b.dataset.step)
    else if (b.dataset.drange) { S.range = b.dataset.drange; seg($('#seg')); seg($('#mseg')); render(); paintDetail() }
    else if ('compare' in b.dataset) { DT.compare = !DT.compare; paintDetail() }
    else if (b.dataset.series) { DT.hidden.has(b.dataset.series) ? DT.hidden.delete(b.dataset.series) : DT.hidden.add(b.dataset.series); paintDetail() }
    else if ('export' in b.dataset) island(`<span class="pdot">${ico('download')}</span>${t('Export')} · ${t(detail(DT.key).title)}.csv`)
    return true
  }
  const tl = e.target.closest('[data-detail]')
  if (!tl) return false
  const b = e.target.closest('button')
  if (b && !b.classList.contains('act')) return false
  openDetail(tl)
  return true
}
/* chart hover: crosshair, points and a tooltip that follows the nearest day */
const tip = () => $('#ctip')
document.addEventListener('pointermove', (e) => {
  const lc = e.target.closest?.('#detail .lc, #detail .bc')
  if (!lc) { tip().classList.remove('on'); $$('#detail .lc').forEach((x) => { x.classList.remove('hover') }); return }
  const ch = DT.charts[lc.id]
  const r = lc.getBoundingClientRect()
  const n = ch.labels.length
  const i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - r.left) / r.width) * (n - (ch.bars ? 1 : 1)) - (ch.bars ? 0.5 : 0))))
  if (!ch.bars) {
    lc.classList.add('hover')
    $('.xh', lc).style.left = `${ch.X(i)}%`
    $$('.pt', lc).forEach((p, k) => { p.style.left = `${ch.X(i)}%`; p.style.top = `${ch.Y(ch.series[k].values[i])}%` })
  } else {
    $$('.bcol', lc).forEach((c) => { c.classList.toggle('on', +c.dataset.i === i) })
  }
  const tp = tip()
  tp.innerHTML = `<b>${ch.labels[i]}</b>${ch.series.map((s) => `<div><i style="background:${s.color}"></i>${t(s.name)}<span class="num">${ch.f(s.values[i])}</span></div>`).join('')}`
  tp.classList.add('on')
  const w = tp.offsetWidth
  tp.style.left = `${Math.min(innerWidth - w - 12, e.clientX + 16)}px`
  tp.style.top = `${e.clientY + 16}px`
})
document.addEventListener('keydown', (e) => {
  if (DT.open) {
    if (e.key === 'Escape') { e.stopImmediatePropagation(); closeDetail() }
    else if (e.key === 'ArrowRight') stepDetail(1)
    else if (e.key === 'ArrowLeft') stepDetail(-1)
    return
  }
  const tl = e.target.closest?.('[data-detail]')
  if (tl && e.target === tl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDetail(tl) }
}, true)

function resClick(e) {
  if (!isRes()) return false
  const sp = RESOURCES[S.page], st = rs()
  const b = e.target.closest('button')
  if (st.menu !== null && !e.target.closest('.rfwrap')) { st.menu = null; repaintList() }
  if (b?.dataset.sel) { st.sel.has(b.dataset.sel) ? st.sel.delete(b.dataset.sel) : st.sel.add(b.dataset.sel); if (st.view === 'selected' && !st.sel.size) st.view = 'default'; repaintList(); return true }
  if (b && 'selall' in b.dataset) { const rows = visibleRows(sp, st); const all = rows.every((r) => st.sel.has(r.id)); for (const r of rows) all ? st.sel.delete(r.id) : st.sel.add(r.id); repaintList(); return true }
  if (b && 'clearsel' in b.dataset) { st.sel.clear(); if (st.view === 'selected') st.view = 'default'; renderDock(); repaintList(); return true }
  if (b?.dataset.bulk) { const n = st.sel.size; st.sel.clear(); if (st.view === 'selected') st.view = 'default'; renderDock(); repaintList(); island(`<span class="pdot" style="color:var(--success-text);background:var(--success-surface)">${ico('check')}</span>${t(b.dataset.bulk)} · ${n}`); return true }
  if (b?.dataset.sort) { const k = b.dataset.sort; st.sort = st.sort?.k === k ? { k, dir: st.sort.dir === 'asc' ? 'desc' : 'asc' } : { k, dir: 'asc' }; repaintList(); return true }
  if (b?.dataset.filter) { const i = +b.dataset.filter; st.menu = st.menu === i ? null : i; repaintList(); return true }
  if (b?.dataset.fopt) { const [i, l] = b.dataset.fopt.split('|'); st.filters[+i] = l; st.menu = null; if (st.view === 'noresults') st.view = 'default'; renderDock(); repaintList(); return true }
  if (b && 'clear' in b.dataset) { st.filters = {}; st.q = ''; st.view = 'default'; renderDock(); render(); return true }
  if (b?.dataset.dlg) { st.view = b.dataset.dlg; renderDock(); render(); setTimeout(() => $('.rdialog textarea, .rdialog [data-dlgok]')?.focus(), 30); return true }
  if (b && 'dlgclose' in b.dataset) { st.view = 'default'; renderDock(); render(); return true }
  if (!b && e.target.matches?.('.rscrim')) { st.view = 'default'; renderDock(); render(); return true }
  if (b?.dataset.dlgok) {
    const d = sp.dialogs[b.dataset.dlgok]
    if (d.field && !$('[data-dfield]').value.trim()) { st.view = 'invalid'; renderDock(); render(); setTimeout(() => $('[data-dfield]')?.focus(), 30); return true }
    st.view = 'saving'; renderDock(); render()
    island(`<span class="pdot">${ico('refresh')}</span>${t(sp.saving)}<span class="bar"><i></i></span>`, 1300, true)
    setTimeout(() => { st.view = 'default'; renderDock(); render(); island(`<span class="pdot" style="color:var(--success-text);background:var(--success-surface)">${ico('check')}</span>${t(d.action)} · ${t('just now')}`) }, 1300)
    return true
  }
  if (b && 'remember' in b.dataset) { const on = b.classList.toggle('on'); b.setAttribute('aria-checked', String(on)); return true }
  if (b && 'auth' in b.dataset) {
    const invalid = new Set(failing(sp, st))
    if (invalid.size) { st.view = 'errors'; st.formView = 'errors'; st.invalid = invalid; renderDock(); render(); return true }
    st.view = 'saving'; renderDock(); render()
    setTimeout(() => {
      st.view = 'default'
      if (S.page === 'login') { go('overview'); island(`<span class="pdot" style="color:var(--success-text);background:var(--success-surface)">${ico('check')}</span>${t('Signed in')}`) }
      else { renderDock(); render(); island(`<span class="pdot">${ico('lock')}</span>${t('Still no sections')}`) }
    }, 1100)
    return true
  }
  if (b && 'auth2' in b.dataset) { go('login'); return true }
  if (b?.dataset.swatch) { st.form.color = b.dataset.swatch; render(); return true }
  if (b?.dataset.perm) {
    const [g, i] = b.dataset.perm.split('|').map(Number)
    const item = st.form.perms[g][1][i]
    item[2] = !item[2]
    render()
    return true
  }
  if (b && 'save' in b.dataset) {
    const invalid = new Set(failing(sp, st))
    if (invalid.size) { st.view = 'errors'; st.formView = 'errors'; st.invalid = invalid; renderDock(); render(); return true }
    st.view = 'saving'; renderDock(); render()
    island(`<span class="pdot">${ico('refresh')}</span>${t(sp.saving)}<span class="bar"><i></i></span>`, 1100, true)
    setTimeout(() => { st.view = 'default'; st.fresh = false; renderDock(); render(); island(`<span class="pdot" style="color:var(--success-text);background:var(--success-surface)">${ico('check')}</span>${t('Saved · just now')}`) }, 1100)
    return true
  }
  if (b?.dataset.act) { island(`<span class="pdot">${ico('info')}</span>${t(b.dataset.act)} · ${t('Prototype only')}`); return true }
  const row = !b && e.target.closest('[data-row]')
  if (row && sp.detail) { go(sp.detail); return true }
  return false
}
