  if (!PAGES[page]) return island(`<span class="pdot">${ico('info')}</span>${t('Prototype: this section is not drawn yet')}`)
  if (DT.open) closeDetail()
  S.page = page
  if (!EMBED) history.replaceState(null, '', page === 'overview' ? location.pathname + location.search : '#notifications')
  $('#sheet').classList.remove('open')
  closePop()
  all()
  scrollTo({ top: 0, behavior: 'smooth' })
  report()
}

/* ---------- notification settings ---------- */
const CH = [
  ['inapp', 'bell', 'In-app', 'Bell and island in the admin console'],
  ['email', 'mail', 'Email', 'mara.ops@bitrate.fm'],
  ['push', 'phone', 'Push', 'This browser and the mobile app'],
  ['slack', 'hash', 'Slack', '#mod-alerts'],
]
const EVENTS = [
  ['Moderation', [['report.new', 'New report filed', 'Every report entering the queue', 'Normal'], ['report.escalated', 'Report escalated', 'A moderator asked for a second opinion', 'High'], ['report.sla', 'SLA breach', 'A report waits longer than the SLA', 'Critical']]],
  ['Releases', [['release.submitted', 'Release submitted for review', 'An artist sent a release to review', 'Normal'], ['release.resubmitted', 'Changes resubmitted', 'A release came back after requested changes', 'Normal']]],
  ['Catalog', [['track.failed', 'Track processing failed', 'An upload could not be processed', 'High'], ['pipeline.stuck', 'Pipeline stuck', 'Tracks wait in processing too long', 'Critical']]],
  ['Accounts', [['artist.verify', 'Artist verification request', 'An artist asked for the verified badge', 'Normal'], ['signup.spike', 'Unusual sign-up spike', 'Sign-ups exceed the usual rate', 'High']]],
  ['Security', [['staff.login', 'New staff sign-in', 'A staff account signed in from a new device', 'High'], ['role.changed', 'Role or permissions changed', 'Someone changed staff access', 'Critical'], ['signin.failed', 'Repeated failed sign-ins', 'Several failed attempts on a staff account', 'Critical']]],
]
const EV = Object.fromEntries(EVENTS.flatMap(([g, list]) => list.map(([id, title, desc, prio]) => [id, { g, title, desc, prio }])))
const SAMPLE = {
  'report.new': 'Track · Copyright claim · Glass Horizon',
  'report.escalated': 'leo.mod escalated a report on @driftwave',
  'report.sla': '3 reports have waited over 6 h',
  'release.submitted': 'Kite Harbor submitted “Static Lines” (EP)',
  'release.resubmitted': 'Mira Sol resubmitted “Drift Control”',
  'track.failed': '“Late Signal” failed: unsupported codec',
  'pipeline.stuck': '12 tracks waiting for over 30 min',
  'artist.verify': 'Lumen Choir asked for verification',
  'signup.spike': 'Sign-ups are 3.4× the usual hourly rate',
  'staff.login': 'sam.ops signed in from Firefox on Linux',
  'role.changed': 'root gave leo.mod the Releases permission',
  'signin.failed': '7 failed sign-ins on mara.ops in 10 min',
}
const NS = {
  ch: { inapp: true, email: true, push: true, slack: false },
  ev: Object.fromEntries(Object.entries(EV).map(([id, e]) => [id, {
    inapp: true,
    email: e.prio !== 'Normal' || id === 'release.submitted',
    push: e.prio === 'Critical',
    slack: e.prio === 'Critical',
  }])),
  sel: 'report.sla', digest: 'instant', digestAt: '09:00', quiet: true, from: '22:00', to: '07:00', bypass: true,
  sla: 6, failed: 5, spike: 3, escAfter: 15, escTo: ['Super admin', 'On-call'], savedAt: Date.now(),
}
const PRIO = { Critical: 'down', High: 'warn', Normal: 'flat' }
const sw = (on, path, label, disabled) =>
  `<button type="button" class="sw${on ? ' on' : ''}" role="switch" aria-checked="${on}" aria-label="${t(label)}" data-ns="${path}"${disabled ? ' disabled' : ''}><i></i></button>`
const segBtns = (path, opts, cur, fmtO = (o) => t(o)) =>
  `<div class="seg ns-seg">${opts.map((o) => `<button type="button" data-ns="${path}" data-val="${o}" class="${String(o) === String(cur) ? 'on' : ''}">${fmtO(o)}</button>`).join('')}</div>`
const blocked = () => S.nview === 'blocked'
const chOn = (c) => NS.ch[c] && !(c === 'push' && blocked())
function route(id) {
  const e = EV[id], sel = NS.ev[id]
  const chans = CH.filter(([c]) => sel[c] && chOn(c)).map(([, , l]) => t(l))
  if (!chans.length) return `<span class="delta flat">${t('Nowhere — all channels are off for this event')}</span>`
  const held = NS.quiet && !(e.prio === 'Critical' && NS.bypass)
  return `<span class="muted-s">${t(held ? 'Held by quiet hours until' : 'Delivered to')}${held ? ` ${NS.to}` : ''}</span>${chans.map((c) => `<span class="delta up">${c}</span>`).join('')}`
}
function previewHTML() {
  const e = EV[NS.sel]
  return `<div class="pv-push"><span class="pv-app"><svg class="mark" aria-hidden="true"><use href="#bitrate-mark"/></svg></span>
      <div class="pv-tx"><div class="pv-top"><b>Bitrate Admin</b><small>${t('now')}</small></div><b>${t(e.title)}</b><span>${SAMPLE[NS.sel]}</span></div></div>
    <div class="pv-mail"><div><small>${t('From')}</small>Bitrate Admin &lt;alerts@bitrate.fm&gt;</div><div><small>Subject</small><b>[${t(e.prio)}] ${t(e.title)}</b></div><p>${SAMPLE[NS.sel]}. <span class="link">Open in admin →</span></p></div>
    <div class="pv-route">${route(NS.sel)}</div>`
}
function matrixHTML() {
  const head = `<thead><tr><th>${t('Event')}</th><th>${t('Priority')}</th>${CH.map(([c, i, l]) => `<th class="${chOn(c) ? '' : 'dim'}">${ico(i)}<span>${t(l)}</span></th>`).join('')}</tr></thead>`
  const body = EVENTS.map(([g, list]) => `<tr class="grp"><td colspan="${2 + CH.length}">${t(g)}</td></tr>${list
    .map(([id, title, desc, prio]) => `<tr class="ev${NS.sel === id ? ' sel' : ''}" data-sel="${id}"><td><b>${t(title)}</b><small>${t(desc)}</small></td><td><span class="delta ${PRIO[prio]}">${t(prio)}</span></td>${CH.map(([c]) => `<td><button type="button" class="ck${NS.ev[id][c] ? ' on' : ''}" role="checkbox" aria-checked="${NS.ev[id][c]}" aria-label="${t(title)} · ${t(c === 'inapp' ? 'In-app' : c[0].toUpperCase() + c.slice(1))}" data-ev="${id}" data-ch="${c}"${chOn(c) ? '' : ' disabled'}>${ico('tick')}</button></td>`).join('')}</tr>`)
    .join('')}`).join('')
  const cards = EVENTS.map(([g, list]) => `<div class="evg"><h5>${t(g)}</h5>${list
    .map(([id, title, , prio]) => `<div class="evc${NS.sel === id ? ' sel' : ''}" data-sel="${id}"><div class="evh"><b>${t(title)}</b><span class="delta ${PRIO[prio]}">${t(prio)}</span></div><div class="evch">${CH.map(([c, i, l]) => `<button type="button" class="cht${NS.ev[id][c] ? ' on' : ''}" aria-pressed="${NS.ev[id][c]}" data-ev="${id}" data-ch="${c}"${chOn(c) ? '' : ' disabled'}>${ico(i)}${t(l)}</button>`).join('')}</div></div>`)
    .join('')}</div>`).join('')
  return `<table class="mx">${head}<tbody>${body}</tbody></table><div class="evcards">${cards}</div>`
}
const nTile = (cls, i, icon, title, meta, body, extra = '') =>
  `<article class="tile glass ${cls}" style="--i:${i}"><div class="th"><span class="ico">${ico(icon)}</span><div class="t"><b>${t(title)}</b><small>${t(meta)}</small></div>${extra}</div><div class="tc">${body}</div></article>`
function notifHTML() {
  const head = `<header class="head"><div><div class="eyebrow">${t('SETTINGS · NOTIFICATIONS')}</div><h1>${t('Notifications')}</h1><p>${t('Choose what reaches you, where and when. Changes save automatically.')}</p></div><div class="grow"></div>
    <div class="actions nacts"><span class="savep" id="savep">${ico('check')}<span>${t('Saved')} · ${t('just now')}</span></span><button type="button" class="pill primary" data-test>${ico('send')}${t('Send test')}</button></div></header>`
  if (S.nview === 'loading')
    return `${head}<section class="ns-grid">${['w2', 'w2', 'w4', 'w2', 'w2'].map((w, i) => `<article class="tile glass ${w}" style="--i:${i}"><div class="th"><span class="sk" style="width:36px;height:36px;border-radius:12px"></span><div class="t"><div class="sk" style="width:140px;height:12px;margin-bottom:6px"></div><div class="sk" style="width:90px;height:10px"></div></div></div><div class="tc">${skRows(i === 2 ? 7 : 4, i === 2 ? 22 : 14)}</div></article>`).join('')}</section>`
  if (S.nview === 'error')
    return `${head}<section class="ns-grid"><article class="tile glass w4 ns-err">${msg('error', 'Couldn’t load your notification settings', 'Nothing was changed. Try again in a moment.', 'Try again')}</article></section>`
  const banner = blocked()
    ? `<article class="tile glass w4 banner" style="--i:0"><span class="ai warning">${ico('alert')}</span><div class="tx"><b>${t('Browser notifications are blocked')}</b><small>${t('Allow notifications for this site in the browser settings, then try again.')}</small></div><button type="button" class="pill ghost" data-unblock>${ico('refresh')}${t('Try again')}</button></article>`
    : ''
  const channels = CH.map(([c, i, l, d]) => {
    const isBlocked = c === 'push' && blocked()
    const status = isBlocked ? ['down', 'Blocked'] : NS.ch[c] ? ['up', c === 'email' ? 'Verified' : 'Connected'] : ['flat', 'Off']
    return `<div class="ch-row"><span class="ai ${NS.ch[c] && !isBlocked ? 'info' : ''}">${ico(i)}</span><div class="tx"><b>${t(l)}</b><small>${t(d)}</small></div><span class="delta ${status[0]}">${t(status[1])}</span>${sw(NS.ch[c] && !isBlocked, `ch.${c}`, l, isBlocked)}</div>`
  }).join('')
  const delivery = `<div class="field"><label>${t('Digest')}</label>${segBtns('digest', ['instant', 'hourly', 'daily', 'weekly'], NS.digest, (o) => t(o[0].toUpperCase() + o.slice(1)))}</div>
    ${NS.digest === 'daily' || NS.digest === 'weekly' ? `<div class="field row"><label>${t('Send at')}</label><input class="time" type="time" value="${NS.digestAt}" data-ns="digestAt"></div>` : ''}
    <div class="field row"><div class="tx"><b>${t('Quiet hours')}</b><small>${t('Pause non-critical alerts overnight')}</small></div>${sw(NS.quiet, 'quiet', 'Quiet hours')}</div>
    <div class="field row${NS.quiet ? '' : ' off'}"><label>${t('From')}</label><input class="time" type="time" value="${NS.from}" data-ns="from"${NS.quiet ? '' : ' disabled'}><label>${t('To')}</label><input class="time" type="time" value="${NS.to}" data-ns="to"${NS.quiet ? '' : ' disabled'}></div>
    <div class="field row${NS.quiet ? '' : ' off'}"><div class="tx"><b>${t('Critical alerts bypass quiet hours')}</b></div>${sw(NS.bypass, 'bypass', 'Critical alerts bypass quiet hours', !NS.quiet)}</div>`
  const range = (path, label, min, max, step, unit) =>
    `<div class="field"><div class="rl"><label>${t(label)}</label><b class="num" data-out="${path}">${NS[path]}${unit}</b></div><input type="range" min="${min}" max="${max}" step="${step}" value="${NS[path]}" data-ns="${path}" data-unit="${unit}" aria-label="${t(label)}"></div>`
  const thresholds = range('sla', 'SLA breach after', 1, 24, 1, ` ${t('h')}`) + range('failed', 'Failed tracks per hour', 1, 50, 1, '') + range('spike', 'Sign-up spike at', 1.5, 10, 0.5, '×')
  const escalation = `<div class="field"><label>${t('Escalate after')}</label>${segBtns('escAfter', [5, 15, 30, 60], NS.escAfter, (o) => `${o} ${t('min')}`)}</div>
    <div class="field"><label>${t('to')}</label><div class="chips">${['Super admin', 'Moderator', 'Operations', 'On-call'].map((r) => `<button type="button" class="chipt${NS.escTo.includes(r) ? ' on' : ''}" aria-pressed="${NS.escTo.includes(r)}" data-role="${r}">${t(r)}</button>`).join('')}</div></div>`
  return `${head}<section class="ns-grid">${banner}
    ${nTile('w2', 1, 'bell', 'Channels', 'Where alerts can reach you', channels)}
    ${nTile('w2 accent', 2, 'eye', 'Preview', 'How the selected event arrives', `<div id="pv">${previewHTML()}</div>`)}
    ${nTile('w4 ns-matrix', 3, 'list', 'Events', 'Pick channels per event. Click an event to preview it.', `<div id="mx">${matrixHTML()}</div>`)}
    ${nTile('w2', 4, 'clock', 'Delivery', 'Digest and quiet hours', delivery)}
    ${nTile('w1', 5, 'sliders', 'Thresholds', 'When an alert fires', thresholds)}
    ${nTile('w1', 6, 'shield', 'Escalation', 'Unacknowledged critical alerts', escalation)}
  </section>`
}
let saveTimer
function saved() {
  const p = $('#savep')
  if (p) { p.classList.add('saving'); p.lastElementChild.textContent = t('Saving…') }
  clearTimeout(saveTimer)
  saveTimer = setTimeout(() => {
    NS.savedAt = Date.now()
    if (p) { p.classList.remove('saving'); p.lastElementChild.textContent = `${t('Saved')} · ${t('just now')}` }
    island(`<span class="pdot" style="color:var(--success-text);background:var(--success-surface)">${ico('check')}</span>${t('Saved')}`, 1400)
  }, 450)
}
const repaintPreview = () => { const pv = $('#pv'); if (pv) pv.innerHTML = previewHTML() }
const repaintMatrix = () => { const mx = $('#mx'); if (mx) mx.innerHTML = matrixHTML() }
function nsClick(b) {
  if (S.page !== 'notifications') return false
  if (b.dataset.ns) {
    const path = b.dataset.ns
    if ('val' in b.dataset) NS[path] = Number.isNaN(+b.dataset.val) ? b.dataset.val : +b.dataset.val
    else if (path.startsWith('ch.')) NS.ch[path.slice(3)] = !NS.ch[path.slice(3)]
    else NS[path] = !NS[path]
    render(); saved(); return true
  }
  if (b.dataset.ev) {
    const v = NS.ev[b.dataset.ev]
    v[b.dataset.ch] = !v[b.dataset.ch]
    NS.sel = b.dataset.ev
    repaintMatrix(); repaintPreview(); saved(); return true
  }
  if (b.dataset.role) {
    const r = b.dataset.role
    NS.escTo = NS.escTo.includes(r) ? NS.escTo.filter((x) => x !== r) : [...NS.escTo, r]
    b.classList.toggle('on'); b.setAttribute('aria-pressed', NS.escTo.includes(r)); saved(); return true
  }
  if ('test' in b.dataset) { sendTest(); return true }
  if ('unblock' in b.dataset) { S.nview = 'default'; renderDock(); render(); return true }
  if ('retry' in b.dataset) { S.nview = 'loading'; render(); setTimeout(() => { S.nview = 'default'; renderDock(); render() }, 1100); return true }
  return false
}
document.addEventListener('click', (e) => {
  const row = e.target.closest('[data-sel]')
  if (row && !e.target.closest('button') && S.page === 'notifications') { NS.sel = row.dataset.sel; repaintMatrix(); repaintPreview() }
})
document.addEventListener('input', (e) => {
  const el = e.target
  if (!el.dataset?.ns || S.page !== 'notifications') return
  NS[el.dataset.ns] = el.type === 'range' ? +el.value : el.value
  const out = $(`[data-out="${el.dataset.ns}"]`)
  if (out) out.textContent = `${el.value}${el.dataset.unit ?? ''}`
  if (['from', 'to'].includes(el.dataset.ns)) repaintPreview()
  saved()
})
function sendTest() {
  const e = EV[NS.sel]
  const chans = CH.filter(([c]) => NS.ev[NS.sel][c] && chOn(c)).map(([, , l]) => t(l))
  island(`<span class="pdot">${ico('send')}</span>${t('Test sent')} · ${chans.join(', ') || '—'}`, 2400)
  toast(t(e.title), SAMPLE[NS.sel])
}
function toast(title, body) {
  const el = $('#toast')
  el.innerHTML = `<span class="pv-app"><svg class="mark" aria-hidden="true"><use href="#bitrate-mark"/></svg></span><div class="pv-tx"><div class="pv-top"><b>Bitrate Admin</b><small>${t('now')}</small></div><b>${title}</b><span>${body}</span></div>`
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on')
  clearTimeout(toast.tm)
  toast.tm = setTimeout(() => el.classList.remove('on'), 4200)
}

/* ---------- bell: recent notifications ---------- */
let unread = 3
const RECENT = [
  ['flag', 'warning', 'New report filed', 'Track · Copyright claim · Glass Horizon', '2 min', true],
  ['alert', 'error', 'SLA breach', '3 reports have waited over 6 h', '18 min', true],
  ['disc', 'info', 'Release submitted for review', 'Kite Harbor submitted “Static Lines” (EP)', '1 h', true],
  ['shield', 'success', 'New staff sign-in', 'sam.ops signed in from Firefox on Linux', '3 h', false],
  ['audio', 'error', 'Track processing failed', '“Late Signal” failed: unsupported codec', '5 h', false],
]
function popHTML() {
  return `<header><b>${t('Notifications')}</b><button type="button" class="link" data-readall>${t('Mark all read')}</button></header>
    <div class="nlist">${RECENT.map(([i, tone, title, body, ago, un], k) => `<div class="nitem${un && k < unread ? ' un' : ''}"><span class="ai ${tone}">${ico(i)}</span><div class="tx"><b>${t(title)}</b><small>${body}</small><small>${ago}</small></div></div>`).join('')}</div>
    <footer><button type="button" class="pill ghost" data-page="notifications">${ico('sliders')}${t('Notification settings')}</button></footer>`
}
function togglePop() {
  const p = $('#npop')
  if (p.classList.contains('open')) return closePop()
  p.innerHTML = popHTML()
  p.classList.add('open')
}
function closePop() { $('#npop')?.classList.remove('open') }
function badges() { $$('.ibtn .badge, .mtabs .badge').forEach((b) => { b.hidden = unread === 0 }) }

/* ---------- prototype dock: states per page, desktop ⇄ mobile ---------- */
const VIEWS = { overview: ['default', 'loading', 'empty', 'partial', 'error', 'restricted', 'offline'], notifications: ['default', 'loading', 'error', 'blocked'] }
const VIEW_LABEL = { default: 'Default', loading: 'Loading', empty: 'Empty', partial: 'Partial', error: 'Error', restricted: 'Restricted', offline: 'Offline', blocked: 'Push blocked' }
const curView = () => (S.page === 'overview' ? S.view : S.nview)
function setView(v) {
  if (S.page === 'overview') S.view = v
  else S.nview = v
  renderDock(); render(); report()
  if (v === 'offline') island(`<span class="pdot" style="color:var(--warning-text);background:var(--warning-surface)">${ico('wifi-off')}</span>${t('Offline · 09:42')}`, 3200)
}
function renderDock() {
  const d = $('#dock')
  if (!d) return
  d.innerHTML = `<small>State</small>${VIEWS[S.page].map((v) => `<button type="button" data-view="${v}" class="${v === curView() ? 'on' : ''}">${VIEW_LABEL[v]}</button>`).join('')}
    <span class="dsep"></span><button type="button" data-device="mobile">${ico('phone')}Mobile</button>`
}

/* ---------- the mobile demo: the same prototype inside a phone ---------- */
const EMBED = new URLSearchParams(location.search).has('embed')
if (EMBED) document.documentElement.classList.add('embed')
const report = () => { if (EMBED) parent.postMessage({ type: 'state', page: S.page, view: curView() }, '*') }
const frame = () => $('#frame')
const send = (msg) => frame()?.contentWindow?.postMessage({ type: 'demo', ...msg }, '*')
let demo = { page: 'overview', view: 'default' }
function demoHTML() {
  const g = (label, key, opts, cur, fmtO = (o) => o) =>
    `<div class="grp"><small>${label}</small><div class="opts">${opts.map((o) => `<button type="button" data-demo="${key}" data-val="${o}" class="${o === cur ? 'on' : ''}">${fmtO(o)}</button>`).join('')}</div></div>`
  return `<h3>Mobile demo</h3><p>The same prototype at 390 × 844. Tap inside the phone, or drive it from here.</p>
    ${g('Page', 'page', ['overview', 'notifications'], demo.page, (o) => PAGES[o])}
    ${g('State', 'view', VIEWS[demo.page], demo.view, (o) => VIEW_LABEL[o])}
    ${g('Theme', 'theme', THEMES, S.theme, (o) => o[0].toUpperCase() + o.slice(1))}
    ${g('Language', 'lang', ['en', 'uk'], S.lang, (o) => (o === 'en' ? 'English' : 'Українська'))}
    <div class="grp"><small>Try</small><div class="opts">${[['detail', 'Open an analysis'], ['menu', 'Open the menu'], ['alerts', 'Open notifications'], ['search', 'Search'], ['test', 'Send a test alert']].map(([a, l]) => `<button type="button" data-demo="action" data-val="${a}">${l}</button>`).join('')}</div></div>
    <button type="button" class="pill ghost" data-device="desktop">${ico('monitor')}Back to desktop</button>`
}
function fitPhone() { document.documentElement.style.setProperty('--s', Math.min(1, (innerHeight - 40) / 868).toFixed(3)) }
function device(mode) {
  document.body.classList.toggle('device', mode === 'mobile')
  if (mode !== 'mobile') { $('#frame').src = 'about:blank'; return }
  demo = { page: S.page, view: curView() }
  $('#demo').innerHTML = demoHTML()
  fitPhone()
  const base = location.href.split('#')[0].split('?')[0]
  frame().onload = () => send({ page: demo.page, view: demo.view, theme: S.theme, lang: S.lang })
  frame().src = `${base}?embed=1`
}
addEventListener('resize', fitPhone)
addEventListener('message', (e) => {
  const m = e.data || {}
  if (m.type === 'state' && !EMBED) { demo = { page: m.page, view: m.view }; $('#demo').innerHTML = demoHTML() }
  if (m.type !== 'demo' || !EMBED) return
  if (m.theme) S.theme = m.theme
  if (m.lang) S.lang = m.lang
  if (m.page && m.page !== S.page) { S.page = m.page; closePop(); $('#sheet').classList.remove('open') }
  if (m.view) { if (S.page === 'overview') S.view = m.view; else S.nview = m.view }
  if (m.theme || m.lang || m.page || m.view) { all(); renderDock() }
  if (m.action === 'detail') { if (S.page !== 'overview') go('overview'); setTimeout(() => { const tl = $('[data-detail="listens"]'); if (tl) openDetail(tl) }, 250) }
  if (m.action === 'menu') $('#sheet').classList.toggle('open')
  if (m.action === 'alerts') togglePop()
  if (m.action === 'search') openPalette()
  if (m.action === 'test') { if (S.page !== 'notifications') go('notifications'); setTimeout(sendTest, 300) }
  report()
})
function demoClick(b) {
  if (b.dataset.device) { device(b.dataset.device); return true }
  if (!b.dataset.demo) return false
  const k = b.dataset.demo, v = b.dataset.val
  if (k === 'theme') { S.theme = v; chrome() }
  if (k === 'lang') { S.lang = v; all() }
  if (k === 'page') demo = { page: v, view: 'default' }
  if (k === 'view') demo.view = v
  send(k === 'action' ? { action: v } : k === 'page' ? { page: v, view: 'default' } : { [k]: v })
  $('#demo').innerHTML = demoHTML()
  return true
}

all()
renderDock()
</script>
</body>
</html>
