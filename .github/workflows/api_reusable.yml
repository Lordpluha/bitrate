name: "[api] Reusable"

on:
  workflow_call:
    inputs:
      push-image:
        description: Push API image
        required: true
        type: boolean
      image-tags:
        description: Docker tags for API image (multiline)
        required: true
        type: string
      timeout-build:
        description: Timeout for API build job
        required: false
        default: 15
        type: number
      run-biome:
        description: Run Biome and i18n drift checks (in the API Tests job, so needs run-tests)
        required: false
        default: true
        type: boolean
      run-tests:
        description: Run API tests (in parallel with the image build)
        required: false
        default: true
        type: boolean
      cache-write:
        description: >-
          Export the BuildKit registry cache. Only the develop push sets it: a PR that writes the
          shared ref overwrites develop's cache with its own layers, and a mode=max export cost
          380s of a 573s PR build.
        required: false
        default: false
        type: boolean
    secrets:
      turbo-token:
        description: >-
          Turbo remote cache token, mounted into the Dockerfile's turbo build. Without it turbo
          runs uncached (fork PRs, local builds).
        required: false

permissions:
  contents: read
  packages: write
  # The image scan uploads its SARIF to code scanning.
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: lordpluha/${{ github.event.repository.name }}

jobs:
  api-build:
    name: API Build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker + registries
        uses: ./.github/actions/setup-docker
        with:
          ghcr: "true"
          ghcr-registry: ${{ env.REGISTRY }}
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: ${{ inputs.push-image }}
          # Loaded as well, so the scan below reads this exact image instead of a rebuild.
          load: true
          tags: ${{ inputs.image-tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/api:buildcache
          # zstd compresses the node_modules layers several times faster than the default gzip;
          # ignore-error keeps a registry hiccup on the export from failing a finished build.
          # Only develop/master export the cache: a PR that writes the shared ref replaces
          # develop's layers with its own, and a gzip mode=max export cost minutes per run.
          cache-to: ${{ inputs.cache-write && format('type=registry,ref={0}/{1}/cache/api:buildcache,mode=max,compression=zstd,ignore-error=true', env.REGISTRY, env.IMAGE_PREFIX) || '' }}
          secrets: |
            turbo_token=${{ secrets.turbo-token }}
          target: production

      - name: Resolve image reference for scanning
        id: scan-ref
        env:
          TAGS: ${{ inputs.image-tags }}
        run: echo "ref=$(printf '%s\n' "$TAGS" | sed -e 's/^[[:space:]]*//' -e '/^$/d' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Scan image
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ steps.scan-ref.outputs.ref }}
          service: api

  api-tests:
    # No `needs: api-build`: nothing here uses the image, so the two run side by side.
    if: ${{ inputs.run-tests }}
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/test_shadow
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      WEB_HOST: http://localhost:3001
      JWT_SECRET: api-ci-secret-value
      PORT: 3000
      # Object storage is required to boot. These are the preprod compose defaults for the
      # bucket-scoped application identity of the SeaweedFS service started below (published
      # on loopback by the CI overlay).
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_BUCKET: bitrate-audio
      S3_ACCESS_KEY: bitrateDevAccessKey
      S3_SECRET_KEY: bitrateDevSecretKeyChangeMe0001

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Here rather than in api-build, which no longer needs Node: one pnpm setup instead of two.
      - name: Run Biome check
        if: ${{ inputs.run-biome }}
        run: pnpm exec biome ci apps/api packages/contracts

      - name: Check i18n dictionary drift
        if: ${{ inputs.run-biome }}
        run: pnpm --filter @bitrate/api run check:i18n

      - name: Generate Prisma Client
        run: pnpm --filter @bitrate/api run db:gen
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/test_shadow

      - name: Create shadow database
        run: |
          PGPASSWORD=test psql -h localhost -U test -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'test_shadow'" | grep -q 1 || \
          PGPASSWORD=test psql -h localhost -U test -d postgres -c "CREATE DATABASE test_shadow;"

      - name: Run migrations
        run: pnpm --filter @bitrate/api run db:migration:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/test_shadow

      # The seed specs import types from @bitrate/ncs-parser, which ship only in its build output,
      # so the package has to be built before any test (and before the contract check below).
      - name: Build ncs-parser
        run: pnpm --filter @bitrate/ncs-parser run build

      - name: Run converter tests
        run: pnpm --filter @bitrate/converter run test

      - name: Run unit tests
        run: pnpm --filter @bitrate/api run test

      # The shipped SeaweedFS definition (same image, entrypoint and bucket-scoped identity
      # as production), not a stock service container: a service container cannot override
      # the image command, and the default `mini` command takes no S3 identity config. The
      # preprod file defaults every variable, so no env is needed; the CI overlay publishes
      # the S3 port on loopback for the runner. See ADR-0050.
      - name: Start SeaweedFS object store
        run: |
          COMPOSE="docker compose -f infra/docker-compose.preprod.yaml -f infra/docker-compose.ci.yaml"
          $COMPOSE up -d --wait seaweedfs
          $COMPOSE run --rm seaweedfs-init

      - name: Run integration tests
        run: pnpm --filter @bitrate/api run test:int
        env:
          # The preprod compose defaults for the bucket-scoped application identity.
          S3_INT_ENDPOINT: http://127.0.0.1:8333
          S3_INT_BUCKET: bitrate-audio
          S3_INT_ACCESS_KEY: bitrateDevAccessKey
          S3_INT_SECRET_KEY: bitrateDevSecretKeyChangeMe0001

      - name: Run e2e tests
        run: pnpm --filter @bitrate/api run test:e2e

      - name: Show SeaweedFS logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.preprod.yaml -f infra/docker-compose.ci.yaml logs --tail=100 seaweedfs

      - name: Verify generated API contracts
        run: |
          pnpm --filter @bitrate/api run start > /tmp/bitrate-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl --fail --silent http://localhost:3000/swagger/json > /dev/null && break
            if [ "$i" = 30 ]; then
              cat /tmp/bitrate-api.log
              exit 1
            fi
            sleep 1
          done
          pnpm --filter @bitrate/contracts run gen:api
          git diff --exit-code -- packages/contracts/src/api/v1.ts

      - name: Upload API startup log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-startup-log
          path: /tmp/bitrate-api.log
          if-no-files-found: ignore

      # Regenerating the contract needs a running API, so a developer without
      # Postgres and Redis to hand cannot produce this file locally. On a drift
      # failure the freshly generated one is right here — download and commit it.
      - name: Upload regenerated API contract
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-api-contract
          path: packages/contracts/src/api/v1.ts
          if-no-files-found: ignore
