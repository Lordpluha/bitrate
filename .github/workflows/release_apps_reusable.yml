name: "[release] Installable Apps Reusable"

# Builds the user-installable apps at a release tag and attaches them to that tag's GitHub
# Release, so a user can download the new version straight from the Releases page:
#
#   desktop  -- Tauri bundles: AppImage/.deb/.rpm (Linux), .msi/.exe (Windows), .dmg (macOS)
#   android  -- a release APK, built on the runner with Gradle (no EAS account needed)
#
# iOS is not attached: an .ipa installs only through the App Store, TestFlight or an
# enterprise/ad-hoc profile, none of which a GitHub Release asset can provide.
#
# Both the release workflow (right after it creates the Release) and release_apps.yml (a
# hand-run backfill for an existing tag) call this. The tag is checked out explicitly, so the
# binaries always match the tagged tree, and the app versions are pinned to it at build time.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (`v1.4.0`) whose Release receives the assets
        required: true
        type: string
    secrets:
      android-keystore-base64:
        description: >-
          Base64 of the upload keystore (.jks). Without it the APK keeps Gradle's debug
          signature, and Android refuses to install the next release over it.
        required: false
      android-keystore-password:
        required: false
      android-key-alias:
        required: false
      android-key-password:
        required: false

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          # Apple silicon runner: the .dmg is aarch64.
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 15
        uses: ./.github/actions/tauri-linux-deps

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile --filter @bitrate/desktop...

      # tauri.conf.json carries its own version, which the release does not bump. The tag is
      # the product version, so it is what the installer and the About box must say.
      - name: Build the installers
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          pnpm --filter @bitrate/desktop run tauri build --config "{\"version\":\"${version}\"}"

      - name: Attach to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          bundle=apps/desktop/src-tauri/target/release/bundle
          files=("${bundle}"/appimage/*.AppImage "${bundle}"/deb/*.deb "${bundle}"/rpm/*.rpm \
                 "${bundle}"/msi/*.msi "${bundle}"/nsis/*.exe "${bundle}"/dmg/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::tauri build produced no installer under ${bundle}"
            exit 1
          fi
          printf 'Attaching %s\n' "${files[@]}"
          gh release upload "${TAG}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile --filter @bitrate/mobile...

      # versionCode must grow on every release or Android refuses the update, so it is derived
      # from the tag: v1.4.2 -> 10402.
      - name: Pin the app version to the release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node - "${TAG#v}" <<'JS'
          const fs = require('node:fs');
          const version = process.argv[2];
          const [major, minor, patch] = version.split('-')[0].split('.').map(Number);
          const path = 'apps/mobile/app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo.version = version;
          app.expo.android.versionCode = major * 10000 + minor * 100 + patch;
          fs.writeFileSync(path, `${JSON.stringify(app, null, 2)}\n`);
          console.log(`version ${version}, versionCode ${app.expo.android.versionCode}`);
          JS

      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      # Re-signing replaces Gradle's debug signature. apksigner keeps the zipalign Gradle did.
      - name: Sign with the upload key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.android-keystore-base64 }}
          KEYSTORE_PASSWORD: ${{ secrets.android-keystore-password }}
          KEY_ALIAS: ${{ secrets.android-key-alias }}
          KEY_PASSWORD: ${{ secrets.android-key-password }}
          TAG: ${{ inputs.tag }}
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::No Android keystore secret: the APK keeps the debug signature, so users must uninstall before installing the next release."
            out="Bitrate-${TAG#v}-android-debug-signed.apk"
          else
            ks="${RUNNER_TEMP}/upload.jks"
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${ks}"
            apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n1)/apksigner"
            "${apksigner}" sign --ks "${ks}" --ks-key-alias "${KEY_ALIAS}" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD "${apk}"
            "${apksigner}" verify "${apk}"
            rm -f "${ks}"
            out="Bitrate-${TAG#v}-android.apk"
          fi
          cp "${apk}" "${RUNNER_TEMP}/${out}"
          echo "apk=${RUNNER_TEMP}/${out}" >> "${GITHUB_OUTPUT}"

      - name: Attach to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          APK: ${{ steps.sign.outputs.apk }}
        run: gh release upload "${TAG}" "${APK}" --clobber --repo "${GITHUB_REPOSITORY}"
