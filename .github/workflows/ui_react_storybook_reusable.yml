name: "[ui-react] Storybook Reusable"

on:
  workflow_call:
    inputs:
      push-image:
        description: Push docker image
        required: true
        type: boolean
      tags:
        description: Docker tags (multiline)
        required: true
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 60
        type: number
      cache-to-registry:
        description: >-
          Export the BuildKit registry cache. Only develop/master set it; a PR reads the shared
          cache and writes nothing, so no per-PR cache package is left behind in GHCR.
        required: false
        default: false
        type: boolean
    secrets:
      turbo-token:
        description: Turbo remote cache token for the turbo build inside the Dockerfile
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: lordpluha/${{ github.event.repository.name }}

jobs:
  storybook-build:
    name: Storybook Build and Docker
    runs-on: ubuntu-latest
    # Two builds run inside this image: the ui-react library build (which generates
    # src/icons/svgr/ that the stories import) and then the Storybook build itself. Neither
    # is fast, so the default timeout is deliberately generous.
    timeout-minutes: ${{ inputs.timeout-minutes }}

    # Biome, tokens and the Vitest projects for packages/ui-react run as sibling jobs in
    # ui_react.yml. This workflow only produces the image, so it does not repeat them.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker + registries
        uses: ./.github/actions/setup-docker
        with:
          ghcr: "true"
          ghcr-registry: ${{ env.REGISTRY }}
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}

      # The production target serves the prebuilt storybook-static bundle from nginx on 8080
      # and reads no configuration, so this image carries no build args and is
      # environment-agnostic.
      - name: Build Storybook Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/ui-react/Dockerfile
          push: ${{ inputs.push-image }}
          tags: ${{ inputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/storybook:buildcache
          cache-to: ${{ inputs.cache-to-registry && format('type=registry,ref={0}/{1}/cache/storybook:buildcache,mode=max,compression=zstd,ignore-error=true', env.REGISTRY, env.IMAGE_PREFIX) || '' }}
          secrets: |
            turbo_token=${{ secrets.turbo-token }}
          target: production
