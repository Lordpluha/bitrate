name: "[docker] Web Integration Test"

on:
  pull_request:
    branches: [master, develop]
    paths:
      - 'docker-compose*.yaml'
      - 'infra/docker-compose*.yaml'
      - 'infra/nginx/**'
      - 'apps/api/**'
      - 'apps/web-player/**'
      - 'apps/web-artists/**'
      - 'turbo.json'
      - '.github/workflows/web-integration-test.yml'
      - '.github/workflows/web-integration-test_reusable.yml'
      - '.github/actions/setup-docker/**'
  push:
    branches: [develop, master]
    paths:
      - 'docker-compose*.yaml'
      - 'infra/docker-compose*.yaml'
      - 'infra/nginx/**'
      - 'apps/api/**'
      - 'apps/web-player/**'
      - 'apps/web-artists/**'
      - 'turbo.json'
      - '.github/workflows/web-integration-test.yml'
      - '.github/workflows/web-integration-test_reusable.yml'
      - '.github/actions/setup-docker/**'
  workflow_dispatch:

permissions:
  contents: read
  # The called workflow's image builds pull the GHCR `cache/<app>:buildcache` refs the per-app
  # jobs maintain. A called workflow can only narrow what the caller grants, so the scope has to
  # be declared here too — same shape as monitoring.yml. Read-only: nothing here publishes.
  packages: read

jobs:
  integration-test:
    uses: ./.github/workflows/web-integration-test_reusable.yml
