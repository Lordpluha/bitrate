name: "[desktop] Native Build Reusable"

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Artifact name prefix
        required: true
        type: string
      platform:
        description: Platform filter (all/linux/windows/macos)
        required: false
        default: all
        type: string

jobs:
  desktop-native-build:
    name: Desktop Native Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Only the requested platforms get a runner. Filtering with step-level `if:` instead still
      # started (and queued) a Windows and a macOS runner on every PR just to skip every step.
      matrix:
        include: ${{ fromJSON(inputs.platform == 'linux' && '[{"os":"ubuntu-latest","platform":"linux"}]' || inputs.platform == 'windows' && '[{"os":"windows-latest","platform":"windows"}]' || inputs.platform == 'macos' && '[{"os":"macos-latest","platform":"macos"}]' || '[{"os":"ubuntu-latest","platform":"linux"},{"os":"windows-latest","platform":"windows"},{"os":"macos-latest","platform":"macos"}]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 15
        uses: ./.github/actions/tauri-linux-deps

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile --filter @bitrate/desktop...

      - name: Build desktop app (native)
        run: pnpm --filter @bitrate/desktop run tauri build

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
          retention-days: 7
          if-no-files-found: warn
