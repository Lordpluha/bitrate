name: "[platform] Release Monitoring"

# Production is the only deployed environment, and a schedule always runs on the default branch
# (develop), so the old develop/master split meant production was never checked on schedule.
# One run now checks production whichever branch triggered it.

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [develop, master]
    paths:
      - '.github/workflows/monitoring.yml'
      - '.github/workflows/monitoring_reusable.yml'
      - '.github/workflows/monitoring_health_reusable.yml'
      - '.github/workflows/monitoring_dependency_reusable.yml'
      - '.github/workflows/monitoring_ssl_reusable.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  monitoring:
    uses: $/.github/workflows/monitoring_reusable.yml
