name: "[platform] Release Monitoring"

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [develop, master]
    paths:
      - '.github/workflows/monitoring.yml'
      - '.github/workflows/monitoring_reusable.yml'
      - '.github/workflows/monitoring_health_reusable.yml'
      - '.github/workflows/monitoring_dependency_reusable.yml'
      - '.github/workflows/monitoring_image_size_reusable.yml'
      - '.github/workflows/monitoring_ssl_reusable.yml'
      - '.github/workflows/monitoring_backup_reusable.yml'
      - '.github/workflows/monitoring_restore_reusable.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  monitoring-develop:
    if: ${{ github.ref == 'refs/heads/develop' }}
    uses: ./.github/workflows/monitoring_reusable.yml
    with:
      branch-name: develop
      backup-max-age-hours: '72'
    secrets:
      monitor-host: ${{ secrets.DEVELOP_SERVER_HOST || secrets.SERVER_HOST }}
      deploy-host: ${{ secrets.DEVELOP_SERVER_HOST || secrets.SERVER_HOST }}
      deploy-user: ${{ secrets.DEVELOP_SERVER_USER || secrets.SERVER_USER }}
      deploy-path: ${{ secrets.DEVELOP_DEPLOY_PATH || secrets.DEPLOY_PATH }}
      deploy-ssh-key: ${{ secrets.DEVELOP_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
      backup-dir-secret: ${{ secrets.DEVELOP_BACKUP_DIR || secrets.BACKUP_DIR }}

  monitoring-master:
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/monitoring_reusable.yml
    with:
      branch-name: master
      backup-max-age-hours: '48'
      # Production is the only target backup.yml writes a bucket for, so it is the only one
      # with an off-host copy to rehearse a restore from. The develop job leaves this off.
      restore-rehearsal: true
      backup-s3-endpoint: ${{ vars.BACKUP_S3_ENDPOINT }}
      backup-s3-bucket: ${{ vars.BACKUP_S3_BUCKET }}
      backup-s3-region: ${{ vars.BACKUP_S3_REGION || 'auto' }}
      backup-s3-prefix: ${{ vars.BACKUP_S3_PREFIX || 'production' }}
    secrets:
      monitor-host: ${{ secrets.SERVER_HOST }}
      deploy-host: ${{ secrets.SERVER_HOST }}
      deploy-user: ${{ secrets.SERVER_USER }}
      deploy-path: ${{ secrets.DEPLOY_PATH }}
      deploy-ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      backup-dir-secret: ${{ secrets.BACKUP_DIR }}
      # A separate, read-only credential is the right one here. The rehearsal only ever needs
      # ListBucket + GetObject; giving it the writing key would let a compromised monitoring
      # run overwrite the backups it is meant to be checking.
      backup-s3-access-key-id: ${{ secrets.BACKUP_S3_READ_ACCESS_KEY_ID || secrets.BACKUP_S3_ACCESS_KEY_ID }}
      backup-s3-secret-access-key: ${{ secrets.BACKUP_S3_READ_SECRET_ACCESS_KEY || secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
