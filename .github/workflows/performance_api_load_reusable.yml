name: "[performance] API Load Reusable"

on:
  workflow_call:

# `issues: write` is what `issues.createComment` needs to comment on a PR; `pull-requests:
# write` was redundant for that call and is dropped.
permissions:
  contents: read
  issues: write

jobs:
  api-load-test:
    name: API Load Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spotify
          POSTGRES_PASSWORD: spotify_password
          POSTGRES_DB: spotify_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create shadow database
        run: |
          psql -h localhost -U spotify -d spotify_test -c "CREATE DATABASE spotify_test_shadow;" || true
        env:
          PGPASSWORD: spotify_password

      - name: Build ncs-parser
        run: pnpm --filter @spotify/ncs-parser run build

      - name: Generate Prisma Client
        run: |
          cd apps/api
          pnpm prisma generate
        env:
          DATABASE_URL: postgresql://spotify:spotify_password@localhost:5432/spotify_test
          SHADOW_DATABASE_URL: postgresql://spotify:spotify_password@localhost:5432/spotify_test_shadow

      - name: Build API
        run: |
          pnpm --filter @spotify/api run build
          ls -la apps/api/dist || echo "dist folder not found"
        env:
          DATABASE_URL: postgresql://spotify:spotify_password@localhost:5432/spotify_test
          SHADOW_DATABASE_URL: postgresql://spotify:spotify_password@localhost:5432/spotify_test_shadow

      - name: Setup database
        run: |
          cd apps/api
          pnpm prisma migrate deploy
          pnpm prisma db seed
        env:
          DATABASE_URL: postgresql://spotify:spotify_password@localhost:5432/spotify_test
          SHADOW_DATABASE_URL: postgresql://spotify:spotify_password@localhost:5432/spotify_test_shadow

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load tests
        shell: bash
        run: |
          set -Eeuo pipefail

          api_log="${RUNNER_TEMP}/api-load-test.log"
          pnpm --filter @spotify/api run start:prod >"${api_log}" 2>&1 &
          api_pid=$!

          cleanup() {
            kill "${api_pid}" 2>/dev/null || true
            wait "${api_pid}" 2>/dev/null || true
          }
          print_api_log() {
            echo "--- API server log ---"
            tail -n 200 "${api_log}" || true
          }
          trap cleanup EXIT
          trap print_api_log ERR

          ready=false
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3001/api/v1/health/ready >/dev/null 2>&1; then
              ready=true
              echo "API readiness check passed"
              break
            fi
            if ! kill -0 "${api_pid}" 2>/dev/null; then
              echo "API process exited before becoming ready"
              print_api_log
              exit 1
            fi
            echo "Waiting for API readiness... (${i}/30)"
            sleep 1
          done

          if [[ "${ready}" != "true" ]]; then
            echo "API did not become ready after 30 attempts"
            print_api_log
            exit 1
          fi

          pnpm --filter @spotify/performance-test run load:api
        env:
          API_URL: http://localhost:3001
          DATABASE_URL: postgresql://spotify:spotify_password@localhost:5432/spotify_test
          SHADOW_DATABASE_URL: postgresql://spotify:spotify_password@localhost:5432/spotify_test_shadow
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          WEB_HOST: http://localhost:3000
          JWT_SECRET: performance_test_secret_at_least_32_characters
          STORAGE_DRIVER: local
          NODE_ENV: test
          PORT: 3001
          # The global ThrottlerGuard is keyed by client IP; the whole load test arrives from
          # one localhost IP, so the production ceiling of 100 req/min would make this job
          # measure the throttler instead of the API. Auth routes keep their own 10/min limit.
          API_RATE_LIMIT_MAX: '1000000'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: |
            packages/performance-test/results.json
            packages/performance-test/summary.json
            ${{ runner.temp }}/api-load-test.log
          if-no-files-found: ignore

      # NOTE: performance.yml has no `pull_request` trigger today, so this step is currently
      # unreachable. Kept (rather than deleted) so adding that trigger just works.
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // k6 runs with cwd packages/performance-test, so both the --summary-export file
            // and handleSummary's output land there, not at the repo root.
            const candidates = [
              'packages/performance-test/results.json',
              'packages/performance-test/summary.json',
            ];
            const resultsPath = candidates.find((p) => fs.existsSync(p));
            if (!resultsPath) {
              console.log('No k6 results file found - load test may have failed');
              return;
            }

            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            if (!results.metrics || !results.metrics.http_reqs) {
              console.log('No metrics found in results - load test did not complete successfully');
              return;
            }

            const metrics = results.metrics;
            const comment = `## 📊 Performance Test Results

            | Metric | Value |
            |--------|-------|
            | Requests | ${metrics.http_reqs?.values?.count || 0} |
            | Failed Requests | ${metrics.http_req_failed?.values?.passes || 0} |
            | Avg Response Time | ${metrics.http_req_duration?.values?.avg?.toFixed(2) || 'N/A'}ms |
            | P95 Response Time | ${metrics.http_req_duration?.values?.['p(95)']?.toFixed(2) || 'N/A'}ms |
            | P99 Response Time | ${metrics.http_req_duration?.values?.['p(99)']?.toFixed(2) || 'N/A'}ms |
            | RPS | ${metrics.http_reqs?.values?.rate?.toFixed(2) || 'N/A'} |
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
