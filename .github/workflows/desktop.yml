name: "[desktop] Checks"

on:
  push:
    branches: [develop, master]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop_native_reusable.yml'
      - '.github/actions/tauri-linux-deps/**'
      - '!apps/desktop/**/*.md'
      - '!apps/desktop/Dockerfile*'
      - '!apps/desktop/docker-compose*'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, master]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop_native_reusable.yml'
      - '.github/actions/tauri-linux-deps/**'
      - '!apps/desktop/**/*.md'
      - '!apps/desktop/Dockerfile*'
      - '!apps/desktop/docker-compose*'
      - 'pnpm-lock.yaml'
      - '.github/actions/app-changed/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: pr
        type: choice
        options:
          - pr
          - develop
          - master
      platform:
        description: "Platform to build (native build only)"
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  # On a pull request the path filter only starts this workflow; this decides whether the app
  # really changed (not just its docs, Docker files or another app's lockfile entries).
  changes:
    if: ${{ github.event_name == 'pull_request' }}
    name: Did desktop change?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.app.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: app
        uses: ./.github/actions/app-changed
        with:
          package: '@bitrate/desktop'
          app-dir: apps/desktop
          ci-paths: '^\.github/(workflows/desktop|actions/(tauri-linux-deps|app-changed|setup-node-pnpm)/)'

  # Linux only on a PR: it catches Rust and renderer breakage for a fraction of the cost
  # of three release builds. The full matrix still runs on every push to develop below.
  desktop-pr-native:
    needs: changes
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.changes.outputs.changed == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'pr')) }}
    uses: ./.github/workflows/desktop_native_reusable.yml
    with:
      artifact-prefix: desktop-pr
      # All three OSes in parallel: the slowest one sets the wall time, and with the Rust cache
      # a Windows/macOS-only breakage is caught on the PR instead of after the merge.
      platform: ${{ github.event.inputs.platform || 'all' }}

  desktop-develop-native:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'develop') }}
    uses: ./.github/workflows/desktop_native_reusable.yml
    with:
      artifact-prefix: desktop-develop
      platform: all

  desktop-master-native:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'master') }}
    uses: ./.github/workflows/desktop_native_reusable.yml
    with:
      artifact-prefix: desktop-master
      platform: all
