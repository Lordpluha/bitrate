name: "[mobile] Expo Reusable"

on:
  workflow_call:
    inputs:
      expo-image-tag:
        description: Docker tag for Expo development image
        required: true
        type: string
      expo-container-name:
        description: Docker container name for Expo dev server test
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: lordpluha/${{ github.event.repository.name }}

jobs:
  expo-dev-server-check:
    name: Expo Dev Server Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: ./.github/actions/setup-docker
        with:
          ghcr: "true"
          ghcr-registry: ${{ env.REGISTRY }}
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Expo Server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/mobile/Dockerfile
          target: development
          load: true
          push: false
          tags: ${{ inputs.expo-image-tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/mobile-dev:buildcache
          # Registry only, and never from a PR: a PR reads develop's cache and writes nothing.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}/cache/mobile-dev:buildcache,mode=max,compression=zstd,ignore-error=true', env.REGISTRY, env.IMAGE_PREFIX) || '' }}

      - name: Run Expo Server
        run: |
          docker run -d \
            -p 8081:8081 \
            -p 19000:19000 \
            --name ${{ inputs.expo-container-name }} \
            ${{ inputs.expo-image-tag }}

      - name: Check Metro Bundler
        # Metro needs longer to start on Expo SDK 57 than a fixed sleep allowed.
        run: |
          for attempt in $(seq 1 36); do
            if curl -sf http://localhost:8081/status; then
              exit 0
            fi
            sleep 5
          done
          echo "Metro did not answer on :8081 within 180s"
          exit 1

      - name: Show logs
        if: failure()
        run: docker logs ${{ inputs.expo-container-name }}

      - name: Cleanup
        if: always()
        run: docker stop ${{ inputs.expo-container-name }} && docker rm ${{ inputs.expo-container-name }} || true
