name: "[platform] Deploy Production"

# Triggered by the push itself rather than by workflow_run after the image
# workflows. workflow_run cannot express "wait for whichever subset of the five
# image workflows this commit's path filters actually started", and it runs with
# repository secrets in a context the caller does not choose. Instead this
# workflow starts on the push and its first job polls the runs that exist for
# this exact SHA -- see the await-images job in deploy_reusable.yml.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy mode"
        required: true
        default: full
        type: choice
        options:
          # Wait for this commit's images, then render, deploy, migrate, probe.
          - full
          # Skip the image wait -- for redeploying images that already exist.
          - redeploy
          # Probe production only. Touches nothing on the server.
          - health-only

# Never cancel a deploy in flight: a half-applied `compose up` plus a cancelled
# migration is worse than a queued second deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The deploy pushes nothing and publishes nothing. `actions: read` exists solely
# so the await-images job can read this commit's workflow run statuses; the
# called workflow narrows further, per job.
permissions:
  contents: read
  actions: read

jobs:
  # One caller job, deliberately. The alternative -- one job per dispatch mode,
  # as in api.yml -- would repeat the eleven-secret `secrets:` block three times,
  # and a secret dropped from one copy fails at deploy time rather than at review
  # time. With a single job the "if: conditions are mutually exclusive" question
  # cannot arise; `inputs.mode` is an empty string on a push, so both expressions
  # short-circuit on `event_name == 'push'`.
  production:
    name: Production
    uses: ./.github/workflows/deploy_reusable.yml
    with:
      wait-for-images: ${{ github.event_name == 'push' || inputs.mode == 'full' }}
      run-deploy: ${{ github.event_name == 'push' || inputs.mode != 'health-only' }}
    secrets:
      postgres-password: ${{ secrets.POSTGRES_PASSWORD }}
      redis-password: ${{ secrets.REDIS_PASSWORD }}
      jwt-secret: ${{ secrets.JWT_SECRET }}
      database-url: ${{ secrets.DATABASE_URL }}
      deploy-ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
      smtp-user: ${{ secrets.SMTP_USER }}
      smtp-pass: ${{ secrets.SMTP_PASS }}
      oauth-google-client-secret: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
      oauth-facebook-app-secret: ${{ secrets.OAUTH_FACEBOOK_APP_SECRET }}
      metrics-token: ${{ secrets.METRICS_TOKEN }}
      sentry-dsn: ${{ secrets.SENTRY_DSN }}
