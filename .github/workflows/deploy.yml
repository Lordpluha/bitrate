name: "[platform] Deploy Production"

# Triggered by the push itself rather than by workflow_run after the image
# workflows. workflow_run cannot express "wait for whichever subset of the five
# image workflows this commit's path filters actually started", and it runs with
# repository secrets in a context the caller does not choose. Instead this
# workflow starts on the push and its first job polls the runs that exist for
# this exact SHA -- see the await-images job in deploy_reusable.yml.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy mode"
        required: true
        default: full
        type: choice
        options:
          # Wait for this commit's images, then render, deploy, migrate, probe.
          - full
          # Skip the image wait -- for redeploying images that already exist.
          - redeploy
          # Probe production only. Touches nothing on the server.
          - health-only

# Never cancel a deploy in flight: a half-applied `compose up` plus a cancelled
# migration is worse than a queued second deploy. A future staging caller gets
# its own group -- do not widen this one to cover both environments.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The deploy pushes nothing and publishes nothing. `actions: read` exists solely
# so the await-images job can read this commit's workflow run statuses; the
# called workflow narrows further, per job. `secrets: inherit` below does not
# change this token's scope -- it governs the secrets context, not permissions.
permissions:
  contents: read
  actions: read

jobs:
  # One caller job, deliberately. `inputs.mode` is an empty string on a push, so
  # both `with:` expressions short-circuit on `event_name == 'push'`.
  #
  # `secrets: inherit` rather than an explicit eleven-secret mapping. This is
  # forced, not preferred. Production configuration now lives at *environment*
  # scope, and a job that calls a reusable workflow may not declare
  # `environment:` -- GitHub allows only name/uses/with/secrets/needs/if/
  # permissions/strategy/concurrency on such a job. This caller therefore has no
  # environment, so `${{ secrets.JWT_SECRET }}` written here would resolve
  # against repository scope and yield an empty string, and the deploy would
  # succeed while starting the API with a blank signing key. Passing `inherit`
  # moves secret resolution into the called workflow's `deploy` job, which does
  # carry `environment:` and therefore sees the environment's values.
  #
  # The cost is real and deliberate: `inherit` exposes *every* repository secret
  # to deploy_reusable.yml, not just the eleven the deploy consumes. That is
  # acceptable only because the called workflow is in this same repository and
  # is reviewed with this file; it would not be acceptable for a third-party or
  # cross-repository reusable workflow.
  production:
    name: Production
    uses: ./.github/workflows/deploy_reusable.yml
    with:
      environment: production
      wait-for-images: ${{ github.event_name == 'push' || inputs.mode == 'full' }}
      run-deploy: ${{ github.event_name == 'push' || inputs.mode != 'health-only' }}
    secrets: inherit
