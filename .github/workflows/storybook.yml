name: "[storybook] Image"

# The composed Storybook catalogue at ui.bitrate.me: the ui-react host plus the player and admin
# UI kit Storybooks as refs, all built into one image by packages/ui-react/Dockerfile. Each
# package's own workflow runs its checks (and builds its Storybook as a compile gate); this one
# only produces the image, so it triggers on any of the three.
#
# `master` is deliberately absent from the push trigger. Release builds do not come through
# here: release_images_reusable.yml calls storybook_reusable.yml directly, alongside the other
# images, because the production compose file pulls every service at one shared ${IMAGE_TAG}.
# See ADR-0029. The `master` mode below is only a hand-run escape hatch.
on:
  push:
    branches: [develop]
    paths:
      - 'packages/ui-react/**'
      - 'packages/tailwind/**'
      - 'packages/player/**'
      # The whole app, not just src/app/presentation/ui: the kit's stories compile against the
      # app's tsconfig, global styles and angular.json, and a narrower filter goes stale silently.
      - 'apps/admin/**'
      # The production stage copies this nginx config into the image.
      - 'infra/nginx/static-site.conf'
      - 'turbo.json'
      - '.github/workflows/storybook.yml'
      - '.github/workflows/storybook_reusable.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, master]
    paths:
      - 'packages/ui-react/**'
      - 'packages/tailwind/**'
      - 'packages/player/**'
      - 'apps/admin/**'
      - 'infra/nginx/static-site.conf'
      - 'turbo.json'
      - '.github/workflows/storybook.yml'
      - '.github/workflows/storybook_reusable.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: pr
        type: choice
        options:
          - pr
          - develop
          - master
      release-tag:
        description: >-
          Product version tag (`v1.4.0`) for a hand-run master Storybook image, in addition to
          :master and :<sha>. Normally empty: releases build it through release_images_reusable.yml.
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Read-only by default. Only the image jobs below raise packages: write.
permissions:
  contents: read

jobs:
  storybook-pr:
    permissions:
      contents: read
      packages: write
      security-events: write
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'pr') }}
    uses: ./.github/workflows/storybook_reusable.yml
    with:
      push-image: false
      tags: ghcr.io/lordpluha/${{ github.event.repository.name }}/storybook:pr-${{ github.sha }}
      timeout-minutes: 60
      cache-to-registry: false
    secrets:
      turbo-token: ${{ secrets.TURBO_TOKEN }}

  storybook-develop:
    permissions:
      contents: read
      packages: write
      security-events: write
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'develop') }}
    uses: ./.github/workflows/storybook_reusable.yml
    with:
      push-image: true
      tags: |
        ghcr.io/lordpluha/${{ github.event.repository.name }}/storybook:develop
        ghcr.io/lordpluha/${{ github.event.repository.name }}/storybook:develop-${{ github.sha }}
      timeout-minutes: 60
      cache-to-registry: true
    secrets:
      turbo-token: ${{ secrets.TURBO_TOKEN }}

  storybook-master:
    permissions:
      contents: read
      packages: write
      security-events: write
    # Release builds are dispatched, never pushed into existence (ADR-0029): a release goes
    # through release_images_reusable.yml. This mode rebuilds just this service's `:master`.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'master' }}
    uses: ./.github/workflows/storybook_reusable.yml
    with:
      push-image: true
      # Three tags, and the third one is the rollback handle:
      #   :master  -- moving convenience pointer, never a rollback target
      #   :<sha>   -- immutable, but unreadable and not chronologically sortable
      #   :v<x.y.z> -- immutable; what IMAGE_TAG is pinned to, and the rollback
      #                handle. Empty unless release-tag was passed.
      # The third line evaluates to an empty string on a hand-run master build;
      # docker/build-push-action drops empty entries from a multiline tag list.
      tags: |
        ghcr.io/lordpluha/${{ github.event.repository.name }}/storybook:master
        ghcr.io/lordpluha/${{ github.event.repository.name }}/storybook:${{ github.sha }}
        ${{ inputs.release-tag != '' && format('ghcr.io/lordpluha/{0}/storybook:{1}', github.event.repository.name, inputs.release-tag) || '' }}
      timeout-minutes: 60
      cache-to-registry: true
    secrets:
      turbo-token: ${{ secrets.TURBO_TOKEN }}
