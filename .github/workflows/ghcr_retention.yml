name: "[platform] GHCR Retention"

# Every develop push publishes `:develop-<sha>` for six images, and every cache export leaves
# the previous manifest behind untagged. Nothing removed either, so the registry only grew.
#
# Kept: release tags (`v<x.y.z>`), the moving `:develop` / `:master` pointers, the newest
# ten other tags per image (rollback room for develop), and each cache's `:buildcache`.
# Removed: older tags, untagged versions, and ghost/partial/orphaned manifests. The action
# resolves image indexes and attestations before deleting, so an untagged platform or
# provenance manifest that a kept tag still points at is never removed.
#
# GITHUB_TOKEN can only delete from a package whose "Manage Actions access" lists this
# repository with the Admin role. A package without it fails here with a 403.

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would be deleted
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  packages: write

jobs:
  images:
    name: App images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prune app image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: lordpluha
          packages: bitrate/api,bitrate/web-player,bitrate/web-artists,bitrate/admin,bitrate/docs,bitrate/storybook
          use-regex: true
          exclude-tags: ^(v\d+\.\d+\.\d+.*|develop|master)$
          keep-n-tagged: 10
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}

  caches:
    name: Build caches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prune superseded cache manifests
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: lordpluha
          packages: bitrate/cache/api,bitrate/cache/web-player,bitrate/cache/web-artists,bitrate/cache/admin,bitrate/cache/docs,bitrate/cache/storybook,bitrate/cache/mobile-web,bitrate/cache/mobile-dev
          exclude-tags: buildcache
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
