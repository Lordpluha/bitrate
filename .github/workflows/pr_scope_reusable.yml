name: "[monorepo] PR Scope Reusable"

# Runs scripts/check-pr-scope.mjs, which owns the limits and what counts toward them.
#
# Exempt, because touching every workspace is what they are for:
#   - release/*     release PRs into master (the caller only listens on develop anyway)
#   - backmerge/*   master merged back into develop after a release
#   - changeset-release/*  the changesets version PR
#   - dependabot/*  grouped dependency bumps across workspace manifests
#   - any PR labelled `pr-scope/exempt` — a mechanical sweep (rename, linter migration,
#     regeneration) whose description says why it cannot be split into PRs that stand alone.

on:
  workflow_call:
    inputs:
      base-sha:
        description: Base commit of the pull request
        required: true
        type: string
      head-ref:
        description: Head branch name of the pull request
        required: true
        type: string
      exempt-label:
        description: Whether the pull request carries the pr-scope/exempt label
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scope:
    name: PR Scope
    runs-on: ubuntu-latest

    steps:
      - name: Decide exemption
        id: exempt
        env:
          HEAD_REF: ${{ inputs.head-ref }}
          EXEMPT_LABEL: ${{ inputs.exempt-label }}
        run: |
          case "${HEAD_REF}" in
            release/*|backmerge/*|changeset-release/*|dependabot/*) reason="branch ${HEAD_REF}" ;;
            *) reason="" ;;
          esac
          if [ -z "${reason}" ] && [ "${EXEMPT_LABEL}" = "true" ]; then
            reason="label pr-scope/exempt"
          fi
          if [ -n "${reason}" ]; then
            echo "::notice::PR scope gate skipped: ${reason}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.exempt.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PR scope
        if: steps.exempt.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ inputs.base-sha }}
        run: node scripts/check-pr-scope.mjs "${BASE_SHA}" HEAD
