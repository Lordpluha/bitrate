name: "[monitoring] Reusable"

on:
  workflow_call:

permissions:
  contents: read
  issues: write

jobs:
  health:
    uses: $/.github/workflows/monitoring_health_reusable.yml

  ssl:
    uses: $/.github/workflows/monitoring_ssl_reusable.yml

  dependencies:
    uses: $/.github/workflows/monitoring_dependency_reusable.yml
    with:
      branch-name: develop

  # A red scheduled run nobody looks at is not monitoring. Open one issue per outage and comment
  # on it while it lasts; it is closed by hand once the cause is fixed.
  alert:
    name: Open or update the outage issue
    needs: [health, ssl]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '🚨 Production monitoring is failing'
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `The scheduled health/SSL check failed: ${run}`
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'infra',
            })
            const existing = open.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['infra'] })
            }
