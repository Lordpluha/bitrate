name: "[web-player] Reusable"

on:
  workflow_call:
    inputs:
      push-image:
        description: Push docker image
        required: true
        type: boolean
      tags:
        description: Docker tags (multiline)
        required: true
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 20
        type: number
      run-biome:
        description: Run biome check before docker build
        required: false
        default: false
        type: boolean
      run-tests:
        description: Run web-player typecheck and Vitest
        required: false
        default: true
        type: boolean
      run-e2e:
        description: Run Playwright E2E
        required: false
        default: false
        type: boolean
      run-screenshot:
        description: Run Playwright route screenshot regression
        required: false
        default: false
        type: boolean
      cache-to-registry:
        description: Export build cache to GHCR registry
        required: false
        default: true
        type: boolean
    secrets:
      turbo-token:
        description: Turbo remote cache token for the turbo build inside the Dockerfile
        required: false
      sentry-auth-token:
        description: Sentry token the Dockerfile uses to upload source maps
        required: false

permissions:
  contents: read
  packages: write
  # The image scan uploads its SARIF to code scanning.
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: lordpluha/${{ github.event.repository.name }}

  # Deployment URLs, declared once because the two build steps below would otherwise each
  # carry their own copy — which is how the wrong values survived unnoticed.
  #
  # NEXT_PUBLIC_* are inlined into the client bundle by `next build`, so whatever is used
  # here is what the published image serves forever; it cannot be corrected at deploy time
  # by an env var on the server. The repository declares no Actions variables, so these
  # fallbacks are the values that actually apply. `vars.*` stays as the override hook for
  # forks and a future staging environment.
  BUILD_NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.bitrate.me' }}
  BUILD_NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://bitrate.me' }}

  # Server-side only, and also build-time: next.config.ts bakes it into the
  # `/api-media/:path*` rewrite destination. The internal service address is what
  # infra/docker-compose.prod.yaml defaults API_URL to, so the SSR hop stays on the
  # compose network instead of leaving the host and coming back through nginx/TLS.
  BUILD_API_URL: ${{ vars.API_URL || 'http://api:3000' }}

  # Sentry. The DSN is inlined into the client bundle by `next build`, so like the
  # NEXT_PUBLIC_* values above it is fixed at image build time. Unset, the SDK
  # initialises disabled and the image simply reports nothing — there is no
  # hardcoded fallback in the source. SENTRY_AUTH_TOKEN is a secret and only
  # enables the source map upload; without it the build still succeeds.
  BUILD_NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
  BUILD_NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT || 'production' }}

jobs:
  web-player-checks:
    name: Web Player Build and Docker
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        if: ${{ inputs.run-biome || inputs.run-tests || inputs.run-e2e || inputs.run-screenshot }}
        uses: $/.github/actions/setup-node-pnpm

      - name: Run Biome check
        if: ${{ inputs.run-biome }}
        run: pnpm exec biome ci apps/web-player packages/ui-react packages/tailwind packages/contracts

      - name: Build ui-react
        if: ${{ inputs.run-tests }}
        run: pnpm --filter @bitrate/ui-react run build

      # `@bitrate/player` and its `/engine` entry resolve to the player's dist in tests.
      - name: Build player
        if: ${{ inputs.run-tests }}
        run: pnpm --filter @bitrate/player run build

      - name: Generate Next.js route types
        if: ${{ inputs.run-tests }}
        run: pnpm --filter @bitrate/web-player exec next typegen

      - name: Run web-player typecheck
        if: ${{ inputs.run-tests }}
        run: pnpm --filter @bitrate/web-player check-types

      - name: Run web-player unit and integration tests
        if: ${{ inputs.run-tests }}
        run: pnpm --filter @bitrate/web-player test

      # Pull-request runs only. On `develop`, on a release rebuild, and on a
      # hand-dispatched run there is no base ref to diff against and no reason to
      # narrow anything: those keep running the complete suites. When this step
      # is skipped its outputs are empty strings, and every `!= 'false'` below
      # therefore falls through to the full run.
      - name: Select impacted Playwright specs
        id: select-playwright
        if: ${{ github.event_name == 'pull_request' && (inputs.run-e2e || inputs.run-screenshot) }}
        env:
          SNIFFLER_BASE_REF: ${{ github.event.pull_request.base.sha }}
          SNIFFLER_HEAD_REF: ${{ github.sha }}
        run: node apps/web-player/scripts/select-playwright-tests.mjs

      - name: Install Playwright Chromium
        if: ${{ (inputs.run-e2e || inputs.run-screenshot) && steps.select-playwright.outputs.any != 'false' }}
        run: pnpm exec playwright install chromium --with-deps

      - name: Run web-player E2E tests
        if: ${{ inputs.run-e2e && steps.select-playwright.outputs.e2e != 'false' }}
        env:
          PLAYWRIGHT_E2E_FILTERS: ${{ steps.select-playwright.outputs.e2e-args }}
        run: pnpm --filter @bitrate/web-player test:e2e $PLAYWRIGHT_E2E_FILTERS

      - name: Run web-player screenshot tests
        if: ${{ inputs.run-screenshot && steps.select-playwright.outputs.screenshot != 'false' }}
        env:
          PLAYWRIGHT_SCREENSHOT_FILTERS: ${{ steps.select-playwright.outputs.screenshot-args }}
        run: pnpm --filter @bitrate/web-player test:screenshot $PLAYWRIGHT_SCREENSHOT_FILTERS

      - name: Upload screenshot test failure artifacts
        if: ${{ inputs.run-screenshot && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-player-screenshot-diffs
          path: apps/web-player/test-results/
          retention-days: 7

      - name: Setup Docker + registries
        uses: $/.github/actions/setup-docker
        with:
          ghcr: "true"
          ghcr-registry: ${{ env.REGISTRY }}
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Player Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/web-player/Dockerfile
          push: ${{ inputs.push-image }}
          # Loaded as well, so the scan below reads this exact image instead of a rebuild.
          load: true
          tags: ${{ inputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/web-player:buildcache
          # Only develop/master export the cache: a PR that writes the shared ref replaces
          # develop's layers with its own, and a gzip mode=max export cost minutes per run.
          cache-to: ${{ inputs.cache-to-registry && format('type=registry,ref={0}/{1}/cache/web-player:buildcache,mode=max,compression=zstd,ignore-error=true', env.REGISTRY, env.IMAGE_PREFIX) || '' }}
          secrets: |
            turbo_token=${{ secrets.turbo-token }}
            sentry_auth_token=${{ secrets.sentry-auth-token }}
          build-args: |
            API_URL=${{ env.BUILD_API_URL }}
            NEXT_PUBLIC_API_URL=${{ env.BUILD_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.BUILD_NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.BUILD_NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ env.BUILD_NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
            SENTRY_RELEASE=${{ github.sha }}
          target: production

      - name: Resolve image reference for scanning
        id: scan-ref
        env:
          TAGS: ${{ inputs.tags }}
        run: echo "ref=$(printf '%s\n' "$TAGS" | sed -e 's/^[[:space:]]*//' -e '/^$/d' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Scan image
        uses: $/.github/actions/scan-image
        with:
          image-ref: ${{ steps.scan-ref.outputs.ref }}
          service: web-player
