name: "[web-player] Reusable"

on:
  workflow_call:
    inputs:
      push-image:
        description: Push docker image
        required: true
        type: boolean
      tags:
        description: Docker tags (multiline)
        required: true
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 20
        type: number
      run-biome:
        description: Run biome check before docker build
        required: false
        default: false
        type: boolean
      run-tests:
        description: Run web-player typecheck and Vitest
        required: false
        default: true
        type: boolean
      run-e2e:
        description: Run Playwright E2E
        required: false
        default: false
        type: boolean
      run-screenshot:
        description: Run Playwright route screenshot regression
        required: false
        default: false
        type: boolean
      cache-to-registry:
        description: Export build cache to GHCR registry
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: lordpluha/${{ github.event.repository.name }}

jobs:
  web-player-checks:
    name: Web Player Build and Docker
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        if: ${{ inputs.run-biome || inputs.run-tests || inputs.run-e2e || inputs.run-screenshot }}
        uses: ./.github/actions/setup-node-pnpm

      - name: Run Biome check
        if: ${{ inputs.run-biome }}
        run: pnpm exec biome ci apps/web-player packages/ui-react packages/contracts

      - name: Build ui-react
        if: ${{ inputs.run-tests }}
        run: pnpm --filter @spotify/ui-react run build

      - name: Generate Next.js route types
        if: ${{ inputs.run-tests }}
        run: pnpm --filter @spotify/web-player exec next typegen

      - name: Run web-player typecheck
        if: ${{ inputs.run-tests }}
        run: pnpm --filter @spotify/web-player check-types

      - name: Run web-player unit and integration tests
        if: ${{ inputs.run-tests }}
        run: pnpm --filter @spotify/web-player test

      - name: Install Playwright Chromium
        if: ${{ inputs.run-e2e || inputs.run-screenshot }}
        run: pnpm exec playwright install chromium --with-deps

      - name: Run web-player E2E tests
        if: ${{ inputs.run-e2e }}
        run: pnpm --filter @spotify/web-player test:e2e

      - name: Run web-player screenshot tests
        if: ${{ inputs.run-screenshot }}
        run: pnpm --filter @spotify/web-player test:screenshot

      - name: Setup Docker + registries
        uses: ./.github/actions/setup-docker
        with:
          ghcr: "true"
          ghcr-registry: ${{ env.REGISTRY }}
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Player Docker image (with registry cache export)
        if: ${{ inputs.cache-to-registry }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web-player/Dockerfile
          push: ${{ inputs.push-image }}
          tags: ${{ inputs.tags }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/web-player:buildcache
            type=gha,scope=web-player
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/web-player:buildcache,mode=max
            type=gha,mode=max,scope=web-player
          target: production

      - name: Build Web Player Docker image (GHA cache export only)
        if: ${{ !inputs.cache-to-registry }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web-player/Dockerfile
          push: ${{ inputs.push-image }}
          tags: ${{ inputs.tags }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/web-player:buildcache
            type=gha,scope=web-player
          cache-to: |
            type=gha,mode=max,scope=web-player
          target: production
