name: "[storybook] Reusable"

on:
  workflow_call:
    inputs:
      push-image:
        description: Push docker image
        required: true
        type: boolean
      tags:
        description: Docker tags (multiline)
        required: true
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 60
        type: number
      cache-to-registry:
        description: Export build cache to GHCR registry
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: lordpluha/${{ github.event.repository.name }}

jobs:
  storybook-build:
    name: Storybook Build and Docker
    runs-on: ubuntu-latest
    # Two builds run inside this image: the ui-react library build (which generates
    # src/icons/svgr/ that the stories import) and then the Storybook build itself. Neither
    # is fast, so the default timeout is deliberately generous.
    timeout-minutes: ${{ inputs.timeout-minutes }}

    # Biome, typecheck, and the four Vitest projects for packages/ui-react are already gated
    # by ui_react.yml on the same path filter. This workflow only produces the image, so it
    # does not repeat them.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker + registries
        uses: ./.github/actions/setup-docker
        with:
          ghcr: "true"
          ghcr-registry: ${{ env.REGISTRY }}
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}

      # The production target serves the prebuilt storybook-static bundle from nginx on 8080
      # and reads no configuration, so this image carries no build args and is
      # environment-agnostic.
      - name: Build Storybook Docker image (with registry cache export)
        if: ${{ inputs.cache-to-registry }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/ui-react/Dockerfile
          push: ${{ inputs.push-image }}
          tags: ${{ inputs.tags }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/storybook:buildcache
            type=gha,scope=storybook
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/storybook:buildcache,mode=max
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
          target: production

      # PR-scoped registry cache, not type=gha: GHA's cache API writes the same content ~10x
      # slower than a registry push (measured on this repo's own builds: ~23s via registry vs
      # ~270s via GHA for equivalent layers) — mostly the dependencies-stage pnpm store, exactly
      # the layer worth caching between commits on the same PR. Never touches the canonical
      # storybook:buildcache ref that develop/master maintain — a PR that never merges just
      # leaves one unused cache image behind, same as any other stale PR image tag already
      # accumulating in this registry.
      - name: Build Storybook Docker image (PR-scoped registry cache)
        if: ${{ !inputs.cache-to-registry }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/ui-react/Dockerfile
          push: ${{ inputs.push-image }}
          tags: ${{ inputs.tags }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/storybook:buildcache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/storybook-pr-${{ github.event.pull_request.number }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/storybook-pr-${{ github.event.pull_request.number }}:buildcache,mode=max
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
          target: production
