name: "[monitoring] SSL Reusable"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ssl-check:
    name: SSL / ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        host:
          - bitrate.me
          - api.bitrate.me
          - artists.bitrate.me
          - docs.bitrate.me
          - ui.bitrate.me

    steps:
      - name: Check certificate
        env:
          HOST: ${{ matrix.host }}
        run: |
          expiry=$(echo | openssl s_client -servername "$HOST" -connect "$HOST:443" 2>/dev/null \
            | openssl x509 -noout -enddate | cut -d= -f2)
          if [ -z "$expiry" ]; then
            echo "::error title=SSL check failed::could not read the certificate of $HOST"
            exit 1
          fi
          days_left=$(( ($(date -d "$expiry" +%s) - $(date +%s)) / 86400 ))
          echo "$HOST certificate expires $expiry ($days_left days)"
          if [ "$days_left" -lt 14 ]; then
            echo "::error title=Certificate expiring::$HOST expires in $days_left days"
            exit 1
          fi
