name: "[docs] Reusable"

on:
  workflow_call:
    inputs:
      push-image:
        description: Push docker image
        required: true
        type: boolean
      tags:
        description: Docker tags (multiline)
        required: true
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 30
        type: number
      run-typecheck:
        description: Run the Docusaurus typecheck before the docker build
        required: false
        default: true
        type: boolean
      cache-to-registry:
        description: Export build cache to GHCR registry
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: lordpluha/${{ github.event.repository.name }}

jobs:
  docs-build:
    name: Docs Build and Docker
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The site is configured in TypeScript (docusaurus.config.ts), so a broken config is a
      # type error rather than a runtime one. Biome does not cover apps/docs.
      - name: Setup Node.js and pnpm
        if: ${{ inputs.run-typecheck }}
        uses: ./.github/actions/setup-node-pnpm

      - name: Run docs typecheck
        if: ${{ inputs.run-typecheck }}
        run: pnpm --filter @bitrate/docs check-types

      - name: Setup Docker + registries
        uses: ./.github/actions/setup-docker
        with:
          ghcr: "true"
          ghcr-registry: ${{ env.REGISTRY }}
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}

      # The production target serves the prebuilt bundle from nginx on 8080 and reads no
      # configuration, so this image carries no build args and is environment-agnostic.
      - name: Build Docs Docker image (with registry cache export)
        if: ${{ inputs.cache-to-registry }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/docs/Dockerfile
          push: ${{ inputs.push-image }}
          tags: ${{ inputs.tags }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/docs:buildcache
            type=gha,scope=docs
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/docs:buildcache,mode=max
          target: production

      # PR builds (cache-to-registry: false) never write the canonical docs:buildcache ref —
      # a PR that never merges would otherwise leave abandoned layers there, and concurrent PRs
      # writing to the same ref race each other (a real "blob not found" was seen from exactly
      # this kind of race). type=gha was the original stand-in, but GHA's cache API writes the
      # same content roughly 10x slower than a registry push does (measured on this repo's own
      # apps: ~23s via registry vs ~270s via GHA for equivalent layers) — mostly the
      # dependencies-stage pnpm store, which is exactly the layer worth caching between commits
      # on the same PR. A PR-scoped registry tag gets registry's write speed without touching
      # the canonical ref: nothing outside this PR ever reads cache/docs-pr-<N>:buildcache, and
      # an abandoned PR just leaves an unused image behind (no different from any other stale
      # PR image tag already accumulating in this registry).
      - name: Build Docs Docker image (PR-scoped registry cache)
        if: ${{ !inputs.cache-to-registry }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/docs/Dockerfile
          push: ${{ inputs.push-image }}
          tags: ${{ inputs.tags }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/docs:buildcache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/docs-pr-${{ github.event.pull_request.number }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache/docs-pr-${{ github.event.pull_request.number }}:buildcache,mode=max
          target: production
