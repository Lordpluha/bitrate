name: "[docker] Web Integration Test Reusable"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Every variable in docker-compose.preprod.yaml is declared with a `:-default`, so the
    # stack needs no env file to come up. These are the values CI pins deliberately, set as
    # job-level environment so `docker compose` picks them up through shell interpolation in
    # every step below.
    #
    # They are NOT written to a `.env` file: `-f infra/docker-compose.preprod.yaml` makes
    # `infra/` the project directory, so compose looks for `infra/.env` and ignores a root
    # one entirely. The step this replaced wrote a root `.env`, which compose never read.
    #
    # DATABASE_URL is absent on purpose — the compose file builds it from POSTGRES_USER /
    # POSTGRES_PASSWORD / POSTGRES_DB rather than interpolating DATABASE_URL, so setting it
    # here would do nothing. Pin the three parts instead; the `psql -U admin` and
    # `bitrate_shadow` lookups further down depend on exactly these values.
    env:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bitrate
      SHADOW_DATABASE_URL: postgresql://admin:admin@postgres:5432/bitrate_shadow
      JWT_SECRET: test_secret_key_for_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # Remove unnecessary packages
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          # Clean Docker
          docker system prune -af --volumes

          # Show available space
          df -h

      - name: Build application images
        run: |
          docker compose -f infra/docker-compose.preprod.yaml build api web-player web-artists

      - name: Start services
        run: |
          docker compose -f infra/docker-compose.preprod.yaml up -d postgres redis
          sleep 10

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until docker compose -f infra/docker-compose.preprod.yaml exec -T postgres pg_isready -U admin; do sleep 1; done'
          docker compose -f infra/docker-compose.preprod.yaml exec -T redis redis-cli ping

      - name: Start application services
        run: |
          docker compose -f infra/docker-compose.preprod.yaml up -d api web-player web-artists
          sleep 20

      - name: Check container status
        run: |
          docker compose -f infra/docker-compose.preprod.yaml ps
          docker compose -f infra/docker-compose.preprod.yaml logs --tail=50 api
          docker compose -f infra/docker-compose.preprod.yaml logs --tail=50 web-player
          docker compose -f infra/docker-compose.preprod.yaml logs --tail=50 web-artists

      - name: Run health checks
        run: |
          for i in {1..30}; do
            echo "=== Health check attempt $i/30 ==="

            # Check API health endpoint
            if curl -sf http://localhost:3000/api/v1/health; then
              echo "✅ API is healthy"
              API_OK=1
            else
              echo "❌ API health check failed"
              API_OK=0
            fi

            # Check Web - run inside container (curl not guaranteed on host)
            if docker compose -f infra/docker-compose.preprod.yaml exec -T web-player node -e "const req=require('http').get('http://localhost:3001', (r)=>{console.log('Web status:', r.statusCode); process.exit(0);}); req.on('error', (e)=>{console.error('Web error:', e.message); process.exit(1);});"; then
              echo "✅ Web is healthy"
              WEB_OK=1
            else
              echo "❌ Web health check failed"
              WEB_OK=0
            fi

            # All healthy?
            if [ "$API_OK" = "1" ] && [ "$WEB_OK" = "1" ]; then
              echo "✅ All services are healthy"
              exit 0
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done
          echo "❌ Services failed to become healthy"
          exit 1

      - name: Run database migrations
        run: |
          docker compose -f infra/docker-compose.preprod.yaml exec -T postgres psql -U admin -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='bitrate_shadow'" | grep -q 1 || \
            docker compose -f infra/docker-compose.preprod.yaml exec -T postgres psql -U admin -d postgres -c "CREATE DATABASE bitrate_shadow;"
          docker compose -f infra/docker-compose.preprod.yaml exec -T api pnpm --filter @bitrate/api run db:gen
          docker compose -f infra/docker-compose.preprod.yaml exec -T api pnpm --filter @bitrate/api run db:migration:start

      - name: Seed database
        run: |
          docker compose -f infra/docker-compose.preprod.yaml exec -T api sh -c "cd apps/api && pnpm prisma db seed"

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== API Logs ==="
          docker compose -f infra/docker-compose.preprod.yaml logs api
          echo "=== Web Logs ==="
          docker compose -f infra/docker-compose.preprod.yaml logs web-player
          echo "=== Postgres Logs ==="
          docker compose -f infra/docker-compose.preprod.yaml logs postgres

      - name: Cleanup
        if: always()
        run: docker compose -f infra/docker-compose.preprod.yaml down -v
