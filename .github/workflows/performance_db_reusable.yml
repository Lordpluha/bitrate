name: "[performance] DB Reusable"

on:
  workflow_call:

jobs:
  db-performance:
    name: Database Performance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bitrate
          POSTGRES_PASSWORD: bitrate_password
          POSTGRES_DB: bitrate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create shadow database
        run: |
          psql -h localhost -U bitrate -d bitrate_test -c "CREATE DATABASE bitrate_test_shadow;" || true
        env:
          PGPASSWORD: bitrate_password

      - name: Build ncs-parser
        run: pnpm --filter @bitrate/ncs-parser run build

      - name: Generate Prisma Client
        run: |
          cd apps/api
          pnpm prisma generate
        env:
          DATABASE_URL: postgresql://bitrate:bitrate_password@localhost:5432/bitrate_test
          SHADOW_DATABASE_URL: postgresql://bitrate:bitrate_password@localhost:5432/bitrate_test_shadow

      - name: Setup database
        run: |
          cd apps/api
          pnpm prisma migrate deploy
          pnpm prisma db seed
        env:
          DATABASE_URL: postgresql://bitrate:bitrate_password@localhost:5432/bitrate_test
          SHADOW_DATABASE_URL: postgresql://bitrate:bitrate_password@localhost:5432/bitrate_test_shadow
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Enable pg_stat_statements extension
        run: |
          psql -h localhost -U bitrate -d bitrate_test -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;" \
            || echo "pg_stat_statements not available; skipping"
        env:
          PGPASSWORD: bitrate_password

      - name: Run query performance tests
        run: |
          cd apps/api
          pnpm run test:e2e:performance
        env:
          DATABASE_URL: postgresql://bitrate:bitrate_password@localhost:5432/bitrate_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Analyze slow queries
        run: |
          psql -h localhost -U bitrate -d bitrate_test -c "SELECT query, calls, total_exec_time, mean_exec_time FROM pg_stat_statements ORDER BY mean_exec_time DESC LIMIT 10;" \
            || echo "pg_stat_statements not available; skipping"
        env:
          PGPASSWORD: bitrate_password
