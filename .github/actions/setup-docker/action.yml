name: Setup Docker Buildx
description: Setup Docker Buildx (and optional QEMU/GHCR login)
inputs:
  qemu:
    description: Enable QEMU for multi-arch builds
    required: false
    default: "false"
  buildx-driver-opts:
    description: Driver options for buildx (optional)
    required: false
    default: ""
  ghcr:
    description: Login to GHCR
    required: false
    default: "false"
  ghcr-registry:
    description: GHCR registry URL
    required: false
    default: ghcr.io
  ghcr-username:
    description: GHCR username
    required: false
    default: ""
  ghcr-password:
    description: GHCR password/token
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up QEMU
      if: ${{ inputs.qemu == 'true' }}
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: ${{ inputs.buildx-driver-opts }}
        # Hosted runners are discarded after the job, so tearing the builder down buys nothing;
        # its post step ("Removing builder") took 102s after a cache export on api-pr.
        cleanup: false

    - name: Log in to GHCR
      if: ${{ inputs.ghcr == 'true' && inputs.ghcr-username != '' && inputs.ghcr-password != '' }}
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ${{ inputs.ghcr-registry }}
        username: ${{ inputs.ghcr-username }}
        password: ${{ inputs.ghcr-password }}
