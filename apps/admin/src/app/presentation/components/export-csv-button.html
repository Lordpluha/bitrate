<div class="flex flex-wrap items-center justify-end gap-3">
  @if (failure()) {
    <p role="alert" class="text-sm text-error-text">{{ 'ui.export.failed' | transloco }}</p>
  }
  @if (truncated()) {
    <p role="status" class="text-sm text-muted-foreground">
      {{ 'ui.export.truncated' | transloco: { max: maxRows } }}
    </p>
  }
  <button
    hlmBtn
    variant="secondary"
    type="button"
    [disabled]="pending()"
    [attr.aria-busy]="pending()"
    (click)="run()"
  >
    <ng-icon name="lucideDownload" aria-hidden="true" />
    {{ (pending() ? 'ui.export.busy' : 'ui.export.action') | transloco }}
  </button>
</div>
