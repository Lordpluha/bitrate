@let data = series();
@let activeIndex = hover.activeIndex();
@let tooltipState = tooltip();
@let head = headline();

<figure class="flex h-full flex-col rounded-lg border border-border bg-card p-4">
  <div class="flex flex-wrap items-start justify-between gap-2">
    <figcaption class="text-sm font-semibold text-foreground">{{ title() }}</figcaption>
    @if (head) {
      <div class="text-right">
        <span class="block text-lg font-semibold tabular-nums text-foreground">{{ head.value }}</span>
        <span class="block text-[11px] text-muted-foreground">{{ head.label }}</span>
      </div>
    }
  </div>
  <p class="mt-0.5 min-h-8 text-xs text-muted-foreground">{{ description() }}</p>
  <ng-content />

  @if (loading()) {
    <p class="mt-3 text-sm text-muted-foreground">Loading…</p>
  } @else if (failure(); as message) {
    <p class="mt-3 text-sm text-destructive" role="alert">{{ message }}</p>
  } @else if (hasPoints()) {
    <div class="relative mt-3 overflow-hidden" #plotHost>
      <svg class="w-full" [style.height.px]="height" [attr.viewBox]="'0 0 ' + width() + ' ' + height" aria-hidden="true">
        @for (tick of yTicks(); track tick) {
          @if (tick !== 0) {
            <line
              [attr.x1]="paddingLeftPercent() + '%'"
              [attr.x2]="100 - paddingRightPercent() + '%'"
              [attr.y1]="tickY(tick)"
              [attr.y2]="tickY(tick)"
              class="stroke-border"
              stroke-width="1"
            />
          }
          <text
            [attr.x]="paddingLeftPercent() + '%'"
            dx="-6"
            [attr.y]="tickY(tick) + 3"
            text-anchor="end"
            class="fill-muted-foreground text-xs"
          >
            {{ tickLabel(tick) }}
          </text>
        }

        <line
          [attr.x1]="paddingLeftPercent() + '%'"
          [attr.x2]="paddingLeftPercent() + '%'"
          [attr.y1]="plotTop"
          [attr.y2]="axisBottomY()"
          class="stroke-border"
          stroke-width="1"
        />
        <line
          [attr.x1]="paddingLeftPercent() + '%'"
          [attr.x2]="100 - paddingRightPercent() + '%'"
          [attr.y1]="axisBottomY()"
          [attr.y2]="axisBottomY()"
          class="stroke-border"
          stroke-width="1"
        />

        @for (index of xLabelIndexes(); track index) {
          <text
            [attr.x]="groupCenterX(index)"
            [attr.y]="height - 4"
            text-anchor="middle"
            class="fill-muted-foreground text-xs"
          >
            {{ categories()[index] }}
          </text>
        }

        @if (activeIndex !== null) {
          <rect
            [attr.x]="columnX(activeIndex)"
            [attr.y]="plotTop"
            [attr.width]="columnWidth()"
            [attr.height]="plotHeight"
            class="fill-muted"
          />
        }

        @for (group of groups(); track group.category) {
          @for (rect of group.rects; track rect.colorVar) {
            <rect
              [attr.x]="rect.x"
              [attr.y]="rect.y"
              [attr.width]="rect.width"
              [attr.height]="rect.height"
              [attr.fill]="'var(' + rect.colorVar + ')'"
              rx="2"
            />
          }
        }
      </svg>

      <div
        class="absolute inset-0 flex"
        [style.paddingLeft.%]="paddingLeftPercent()"
        [style.paddingRight.%]="paddingRightPercent()"
      >
        @for (category of categories(); track category; let i = $index) {
          <button
            type="button"
            class="h-full flex-1 cursor-pointer rounded-sm outline-none focus-visible:ring-2 focus-visible:ring-ring"
            [attr.aria-label]="tooltipLabel(i)"
            (pointerenter)="hover.activate(i)"
            (pointermove)="hover.activate(i)"
            (focus)="hover.activate(i)"
            (pointerleave)="hover.clear()"
            (blur)="hover.clear()"
          ></button>
        }
      </div>

      @if (tooltipState) {
        <app-chart-tooltip [state]="tooltipState" />
      }
    </div>

    @if (data.length > 1) {
      <ul class="mt-2 flex flex-wrap gap-3 text-xs text-muted-foreground">
        @for (item of data; track item.id) {
          <li class="flex items-center gap-1.5">
            <span
              class="h-2 w-2 rounded-full"
              [style.backgroundColor]="'var(' + item.colorVar + ')'"
            ></span>
            {{ item.label }}
          </li>
        }
      </ul>
    }

    <table class="sr-only">
      <caption>
        {{
          title()
        }}
      </caption>
      <thead>
        <tr>
          <th scope="col">Category</th>
          @for (item of data; track item.id) {
            <th scope="col">{{ item.label }}</th>
          }
        </tr>
      </thead>
      <tbody>
        @for (category of categories(); track category; let i = $index) {
          <tr>
            <th scope="row">{{ category }}</th>
            @for (item of data; track item.id) {
              <td>{{ item.values[i] }}</td>
            }
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <p class="mt-3 text-sm text-muted-foreground">{{ emptyMessage() }}</p>
  }
</figure>
