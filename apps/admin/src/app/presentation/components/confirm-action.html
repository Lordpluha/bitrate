<div class="space-y-3 rounded-2xl border border-error/30 bg-error-surface/40 p-4">
  <p class="text-sm text-error-text" role="alert">{{ consequence() }}</p>

  <div class="space-y-1">
    <label hlmLabel for="confirm-action-reason">{{ 'ui.confirm.reason' | transloco }}</label>
    <textarea
      #reasonField
      id="confirm-action-reason"
      class="w-full min-w-0 rounded-xl border border-glass-line bg-foreground/5 px-3 py-2 text-sm text-foreground outline-none transition-[border-color,box-shadow] placeholder:text-muted-foreground focus-visible:border-primary/60 focus-visible:ring-3 focus-visible:ring-primary/20 disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50"
      rows="2"
      [attr.maxlength]="maxLength"
      [disabled]="pending()"
      [value]="reason()"
      (input)="setReason(reasonField.value)"
    ></textarea>
  </div>

  <div class="flex gap-2">
    <button
      hlmBtn
      size="sm"
      variant="destructive"
      type="button"
      [disabled]="pending()"
      (click)="onConfirm()"
    >
      {{ pending() ? ('ui.working' | transloco) : confirmLabel() }}
    </button>
    <button
      hlmBtn
      size="sm"
      variant="ghost"
      type="button"
      [disabled]="pending()"
      (click)="cancelled.emit()"
    >
      {{ 'ui.cancel' | transloco }}
    </button>
  </div>
</div>
