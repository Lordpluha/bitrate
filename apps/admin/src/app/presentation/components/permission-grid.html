<div class="grid gap-3 sm:grid-cols-2">
  @for (group of groups(); track group.resource) {
    <fieldset
      class="flex flex-col gap-1 rounded-2xl border border-glass-line bg-foreground/3 p-3.5 disabled:opacity-60"
      [disabled]="disabled()"
    >
      <legend class="px-1 text-xs font-semibold uppercase tracking-[0.08em] text-muted-foreground">
        {{
          groupKey(group.resource) ? (groupKey(group.resource) ?? '' | transloco) : group.resource
        }}
      </legend>
      @for (permission of group.permissions; track permission) {
        <label
          class="flex min-h-9 items-center gap-2.5 rounded-xl px-2 text-[0.8125rem] text-foreground hover:bg-glass-hover"
          [for]="permission"
        >
          <input
            #box
            class="size-4 shrink-0 accent-primary"
            type="checkbox"
            [id]="permission"
            [checked]="isChecked(permission)"
            [disabled]="disabled()"
            (change)="toggle(permission, box.checked)"
          />
          <span class="min-w-0 flex-1 truncate font-mono text-xs">{{ permission }}</span>
          @if (heldByFor(permission); as count) {
            <span class="shrink-0 text-xs text-muted-foreground">{{
              'permissions.holders' | transloco: { count }
            }}</span>
          } @else if (heldByFor(permission) === 0) {
            <span hlmBadge variant="outline">{{ 'permissions.unheld' | transloco }}</span>
          }
        </label>
      }
    </fieldset>
  }
</div>
