<div class="space-y-6">
  @for (group of groups(); track group.resource) {
    <fieldset class="space-y-3 rounded-md border border-border p-4" [disabled]="disabled()">
      <legend class="px-1 text-sm font-medium capitalize text-foreground">
        {{ group.resource }}
      </legend>
      <div class="grid gap-2 sm:grid-cols-2">
        @for (permission of group.permissions; track permission) {
          <label class="flex items-center gap-2 text-sm text-foreground" [for]="permission">
            <input
              type="checkbox"
              [id]="permission"
              [checked]="isChecked(permission)"
              [disabled]="disabled()"
              (change)="toggle(permission, $any($event.target).checked)"
            />
            <span>{{ permission }}</span>
            @if (heldByFor(permission); as count) {
              <span class="text-xs text-muted-foreground"
                >{{ count }} holder{{ count === 1 ? '' : 's' }}</span
              >
            } @else if (heldByFor(permission) === 0) {
              <span hlmBadge variant="outline" class="text-xs">unheld</span>
            }
          </label>
        }
      </div>
    </fieldset>
  }
</div>
