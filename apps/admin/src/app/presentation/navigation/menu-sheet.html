<div
  class="flex max-h-[min(80dvh,720px)] w-screen flex-col overflow-hidden rounded-t-[1.75rem] border border-b-0 border-glass-line bg-glass-strong shadow-glass backdrop-blur-[22px] backdrop-saturate-150"
>
  <span
    class="mx-auto mb-1 mt-2.5 h-1 w-10 shrink-0 rounded-full bg-glass-line"
    aria-hidden="true"
  ></span>

  <nav class="flex-1 overflow-y-auto px-3 pb-2" [attr.aria-label]="'nav.aria.sections' | transloco">
    @for (section of sections(); track $index; let first = $first) {
      @if (section.label; as label) {
        <p
          class="px-3 pb-1.5 text-[0.6875rem] font-semibold uppercase tracking-[0.1em] text-muted-foreground"
          [class.pt-4]="!first"
          [class.pt-2]="first"
        >
          {{ label | transloco }}
        </p>
      }
      <ul class="space-y-0.5">
        @for (item of section.items; track item.kind === 'link' ? item.path : item.id) {
          <li><app-nav-item [item]="item" /></li>
        }
      </ul>
    }
  </nav>

  <div
    class="shrink-0 space-y-0.5 border-t border-glass-line px-3 pb-[calc(env(safe-area-inset-bottom)+1rem)] pt-2"
  >
    <app-locale-toggle />
    <app-theme-toggle />
  </div>
</div>
