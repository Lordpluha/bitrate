<header
  class="sticky top-4 z-30 hidden grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-4 lg:grid"
>
  <span aria-hidden="true"></span>

  <button
    class="flex h-[52px] w-[min(480px,40vw)] items-center gap-3 rounded-full border border-glass-line bg-glass-strong pl-[18px] pr-2.5 text-sm text-muted-foreground shadow-glass backdrop-blur-[22px] backdrop-saturate-150 transition-colors hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
    type="button"
    aria-haspopup="dialog"
    (click)="openPalette()"
  >
    <ng-icon class="shrink-0 text-lg" name="lucideSearch" aria-hidden="true" />
    <span class="flex-1 truncate text-left">{{ 'shell.search' | transloco }}</span>
    <kbd class="rounded-md bg-glass-hover px-1.5 py-0.5 text-[0.6875rem] font-semibold">{{
      hint
    }}</kbd>
  </button>

  <div
    class="flex h-14 items-center gap-1.5 justify-self-end rounded-full border border-glass-line bg-glass-strong pl-3 pr-2 shadow-glass backdrop-blur-[22px] backdrop-saturate-150"
  >
    @if (crumb(); as key) {
      <span
        class="flex items-center gap-2 px-1.5 text-sm font-semibold text-foreground"
        aria-live="polite"
      >
        <span
          class="size-2 rounded-full bg-success ring-3 ring-success/25"
          aria-hidden="true"
        ></span>
        {{ key | transloco }}
      </span>
      <span class="mx-1 h-[22px] w-px bg-glass-line" aria-hidden="true"></span>
    }
    <app-profile-menu />
  </div>
</header>
