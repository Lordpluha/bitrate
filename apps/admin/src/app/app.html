@if (staff(); as operator) {
  <div class="flex min-h-screen">
    <nav class="w-56 shrink-0 border-r border-border bg-card p-4" aria-label="Sections">
      <p class="mb-6 text-sm font-semibold text-card-foreground">Bitrate operators</p>
      <ul class="space-y-1">
        <li>
          <a
            class="block rounded-md px-3 py-2 text-sm text-foreground hover:bg-muted"
            routerLink="/moderation"
          >
            Moderation queue
          </a>
        </li>
      </ul>
    </nav>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex items-center justify-between border-b border-border px-8 py-4">
        <span class="text-sm text-muted-foreground">
          {{ operator.username }} · {{ operator.role }}
        </span>
        <button hlmBtn size="sm" variant="outline" type="button" (click)="signOut()">
          Sign out
        </button>
      </header>
      <main class="min-w-0 flex-1"><router-outlet /></main>
    </div>
  </div>
} @else {
  <router-outlet />
}
