@if (staff()) {
  <a
    class="sr-only z-50 rounded-lg bg-primary p-3 text-primary-foreground focus:not-sr-only focus:fixed focus:left-4 focus:top-4"
    href="#main-content"
  >
    {{ 'shell.skipToContent' | transloco }}
  </a>
  <div class="min-h-dvh lg:flex lg:items-start lg:gap-4 lg:p-4">
    <app-sidebar />

    <div
      class="flex min-w-0 flex-1 flex-col gap-5 px-3 pb-28 pt-2.5 lg:gap-[22px] lg:px-0 lg:pb-8 lg:pt-0"
    >
      <app-top-bar />
      <app-mobile-bars />
      <main class="min-w-0 focus:outline-hidden" id="main-content" tabindex="-1">
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <router-outlet />
}
