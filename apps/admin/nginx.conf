# Serves the built Angular SPA inside the admin image. The stack's edge nginx proxies to this
# container; this config only has to answer for static files and the SPA fallback.
server {
    listen 3005;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build output — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on the old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Client-side routing: every unknown path is a route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
