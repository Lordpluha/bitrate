packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
autoInstallPeers: true
# pnpm 11+ defaults to "install": pnpm exec/run re-installs when node_modules looks stale. The
# Docker stages copy only part of the workspace on purpose, so that would prune their node_modules.
verifyDepsBeforeRun: false

publicHoistPattern:
  - "*react*"
  - "*@react-navigation*"
  - "*expo-router*"

overrides:
  "react": "19.3.1"
  "react-dom": "19.3.1"
  "@types/react": "~19.3.0"
  "@types/react-dom": "~19.3.0"
  "esbuild": "0.28.2"
  "tar": "^7.5.22"
  "browserslist": "^4.28.9"
  "fast-uri": "^3.1.7"
  "multer": "^2.5.0"
  "nanoid": "^3.3.18"
  "shell-quote": "^1.9.0"
  "socket.io-parser": "^4.2.7"
  "svgo": "^3.3.5"
  "dompurify": "^3.4.17"
  "http-proxy-middleware": "^2.0.10"
  "mermaid": "^11.17.2"
  "qs": "^6.16.0"
  "valibot": "^1.4.2"
  "webpack-dev-server": "^5.2.6"
  "body-parser@1": "^1.20.9"
  "body-parser@2": "^2.4.0"
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@2": "^2.1.4"
  "brace-expansion@5": "^5.0.9"
  "js-yaml@3": "^3.15.2"
  "js-yaml@4": "^4.3.2"
  "undici@6": "^6.29.1"
  "undici@7": "^7.30.1"
  "undici@8": "^8.12.2"
  "ajv@8": "^8.20.0"
  "hono": "^4.12.34"
  "mysql2": "^3.23.1"
  "picomatch@4": "^4.0.7"
  "postcss@8": "^8.5.28"
  "sharp": "^0.35.1"
  "uuid@7": "^11.1.1"
  "uuid@8": "^11.1.1"
  "uuid@11": "^11.1.1"
  # Docusaurus core still asks for tinypool ^1; 2.x keeps the Tinypool/run/destroy API it uses.
  "tinypool@1": "^2.2.0"
  "deepmerge-ts@7": "^8.0.2"
  "serialize-javascript@6": "^7.1.2"
  "postcss-selector-parser@6": "^7.1.6"
  "katex@<0.18.2": "^0.18.2"
  "ws@8": "^8.21.3"
  # Security floors for transitive deps (Dependabot alerts, Nov 2026).
  # Angular 22.2.3 pins vite 8.3.0; 8.3.5 (>=8.3.3) fixes the dev-server and launch-editor advisories.
  "vite@8": "8.3.5"
  "launch-editor": "^2.14.2"
  "seroval": "^1.6.12"
  "seroval-plugins": "^1.6.12"
  # minimatch/glob fixes exist only in 11.x/14.x; the named-export API consumers use is unchanged.
  "minimatch@9": "^11.0.5"
  "minimatch@10": "^11.0.5"
  "glob@10": "^14.0.4"
  "glob@13": "^14.0.4"
  # Storybook's webpack builder asks for ^6; the path-traversal fix exists only in 7.4.6/8.3.0.
  "webpack-dev-middleware@6": "^7.4.6"
  "tmp@<0.2.6": "^0.2.7"
  "zod": "4.6.7"
  "@tanstack/react-query": "5.104.1"
  "@tanstack/react-query-devtools": "5.104.1"

# Advisories with no patched release anywhere. Both packages run only inside Expo's build
# tooling (@expo/cli code signing, Metro's file map) for apps/mobile, never in a served runtime.
# Re-check on every Expo upgrade and drop an entry as soon as a fixed version exists.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge <=1.4.0
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3

allowBuilds:
  "@compodoc/compodoc": true
  "@nestjs/core": true
  "@parcel/watcher": true
  "@prisma/engines": true
  "@scarf/scarf": true
  "@sentry/cli": true
  "@sentry/node-cpu-profiler": true
  "@swc/core": true
  "argon2": true
  "aws-sdk": true
  "better-sqlite3": true
  "core-js": true
  "esbuild": true
  "ffmpeg-static": true
  "lefthook": true
  "msgpackr-extract": true
  "prisma": true
  "sharp": true
  "unrs-resolver": true
  # Not built under pnpm 10 either; pnpm 12 fails the install unless the choice is explicit.
  "lmdb": false
  "nx": false

peerDependencyRules:
  allowedVersions:
    "openapi-typescript>typescript": "6"
    "tsconfck>typescript": "6"
    "i18next>typescript": "6"
    "@expo/require-utils>typescript": "6"
    "nestjs-zod>@nestjs/common": "12"
    "nestjs-zod>@nestjs/swagger": "12"
    "@sentry/nestjs>@nestjs/common": "12"
    "@sentry/nestjs>@nestjs/core": "12"
patchedDependencies:
  nestjs-zod@5.5.0: patches/nestjs-zod@5.5.0.patch
