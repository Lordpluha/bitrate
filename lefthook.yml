pre-commit:
  commands:
    biome:
      run: pnpm exec biome check --staged --write --no-errors-on-unmatched
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    build:
      run: |
        if [ "$WEB_ONLY" = "true" ]; then
          echo "Building web stack (api, web-player, web-artists, ui-react)..."
          pnpm --filter @bitrate/api --filter @bitrate/web-player --filter @bitrate/web-artists --filter @bitrate/ui-react build
        else
          echo "Building full monorepo..."
          pnpm build
        fi
