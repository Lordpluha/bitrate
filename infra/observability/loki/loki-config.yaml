# See ADR-0046. Single-node, filesystem-backed — no S3/GCS, same spirit as prometheus_data/
# grafana_data in infra/docker-compose.preprod.yaml. `store: tsdb` is the current recommended
# index (Loki 2.8+); `boltdb-shipper`, which this repo's grill-me interview originally settled
# on, is deprecated as of Loki 3.x and slated for removal in Loki 4.0 — verified against
# Grafana's own docs while implementing, not the version assumed during the interview.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h # required for retention — see compactor below.

limits_config:
  retention_period: 168h # 7d — same retention the grill-me interview settled on.

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem # required once retention_enabled is true.
