# Minimal development infrastructure: PostgreSQL, Redis, and the SeaweedFS object store.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bitrate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bitrate_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bitrate_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # S3-compatible object store for audio (ADR-0050). Same image, entrypoint and bucket-scoped
  # identity as the preprod/prod definitions; the credentials default to the dev-only values
  # that apps/api/.env.example uses. The S3 port is published on loopback only, so an API
  # started natively (`pnpm dev`) reaches it at http://localhost:8333. Always on: the API has no
  # other storage backend.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        printf '{"identities":[{"name":"bitrate-app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:%s","Write:%s","List:%s","Tagging:%s"]}]}\n' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" > /tmp/s3.json
        exec /entrypoint.sh server -s3 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bitrateDevAccessKey}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-bitrateDevSecretKeyChangeMe0001}
      S3_BUCKET: ${S3_BUCKET:-bitrate-audio}
      GOMEMLIMIT: 800MiB
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9333/cluster/healthz && wget -qO /dev/null http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # One-shot: creates the bucket if it is missing, then exits 0. Safe on every `up -d`.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if echo s3.bucket.list | weed shell -master=seaweedfs:9333 | grep -q "^[[:space:]]*$$S3_BUCKET[[:space:]]"; then
          echo "bucket $$S3_BUCKET already exists"
        else
          echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=seaweedfs:9333
        fi
    environment:
      S3_BUCKET: ${S3_BUCKET:-bitrate-audio}
    depends_on:
      seaweedfs:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_test_data:
  seaweedfs_data:
