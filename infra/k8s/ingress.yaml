apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bitrate
  namespace: bitrate
spec:
  ingressClassName: traefik
  rules:
    - host: bitrate.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web-player, port: { number: 3001 } }
    - host: api.bitrate.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 3000 } }
    - host: artists.bitrate.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web-artists, port: { number: 3002 } }
    - host: admin.bitrate.localhost
      http:
        paths:
          - path: /api/v1/admin
            pathType: Prefix
            backend:
              service: { name: admin-api, port: { number: 3007 } }
          - path: /api/v1/health
            pathType: Prefix
            backend:
              service: { name: admin-api, port: { number: 3007 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: admin, port: { number: 3005 } }
    - host: mail.bitrate.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: mailpit, port: { number: 8025 } }
