apiVersion: v1
kind: Service
metadata:
  name: web-player
spec:
  selector:
    app: web-player
  ports:
    - port: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-player
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-player
  template:
    metadata:
      labels:
        app: web-player
    spec:
      containers:
        - name: web-player
          image: bitrate/web-player:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://api.bitrate.localhost
            - name: NEXT_PUBLIC_SITE_URL
              value: http://bitrate.localhost
            - name: API_URL
              value: http://api:3000
            - name: WEB_ARTISTS_URL
              value: http://web-artists:3002
          ports:
            - containerPort: 3001
          readinessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }