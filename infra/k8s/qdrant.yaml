# Support knowledge index (ADR-0075). Derived data the API rebuilds from its bundled help
# articles, so storage is an emptyDir like Redis. Cluster-internal only.
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: bitrate
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: bitrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.20.2-unprivileged
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef: { name: bitrate-env, key: QDRANT_API_KEY }
          ports:
            - containerPort: 6333
          readinessProbe:
            tcpSocket: { port: 6333 }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: storage, mountPath: /qdrant/storage }
            - { name: snapshots, mountPath: /qdrant/snapshots }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: storage, emptyDir: {} }
        - { name: snapshots, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
