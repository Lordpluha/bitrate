apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 660
      containers:
        - name: worker
          image: bitrate/api:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "apps/api/dist/src/main.worker.js"]
          envFrom:
            - secretRef:
                name: bitrate-env
          env:
            - name: AUDIO_PROCESSING_WORKER_ENABLED
              value: "true"
            - name: AUDIO_SCRATCH_ROOT
              value: /app/worker-tmp
            - name: S3_SOCKET_TIMEOUT_MS
              value: "120000"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9101
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          volumeMounts:
            - name: scratch
              mountPath: /app/worker-tmp
      volumes:
        - name: scratch
          emptyDir: {}