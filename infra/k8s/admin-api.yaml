apiVersion: v1
kind: Service
metadata:
  name: admin-api
  namespace: bitrate
spec:
  selector:
    app: admin-api
  ports:
    - port: 3007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: bitrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: admin-api
          image: bitrate/api:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: ["node", "apps/api/dist/src/main.admin.js"]
          envFrom:
            - secretRef:
                name: bitrate-env
          env:
            - name: ADMIN_API_PORT
              value: "3007"
            - name: AUDIO_PROCESSING_WORKER_ENABLED
              value: "false"
          ports:
            - containerPort: 3007
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3007
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
