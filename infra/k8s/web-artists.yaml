apiVersion: v1
kind: Service
metadata:
  name: web-artists
spec:
  selector:
    app: web-artists
  ports:
    - port: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-artists
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-artists
  template:
    metadata:
      labels:
        app: web-artists
    spec:
      containers:
        - name: web-artists
          image: bitrate/web-artists:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: VITE_API_URL
              value: http://api.bitrate.localhost
            - name: VITE_PLAYER_URL
              value: http://bitrate.localhost
            - name: API_URL
              value: http://api:3000
          ports:
            - containerPort: 3002
          readinessProbe:
            tcpSocket:
              port: 3002
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }