apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: bitrate
spec:
  selector:
    app: seaweedfs
  ports:
    - { name: s3, port: 8333 }
    - { name: master, port: 9333 }
    - { name: master-grpc, port: 19333 }
    - { name: filer, port: 8888 }
    - { name: filer-grpc, port: 18888 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: bitrate
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.53
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              printf '{"identities":[{"name":"bitrate-app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:%s","Write:%s","List:%s","Tagging:%s"]}]}\n' \
                "$S3_ACCESS_KEY" "$S3_SECRET_KEY" "$S3_BUCKET" "$S3_BUCKET" "$S3_BUCKET" "$S3_BUCKET" > /tmp/s3.json
              exec /entrypoint.sh server -ip="$POD_IP" -ip.bind=0.0.0.0 -s3 -s3.config=/tmp/s3.json
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: bitrate-env, key: S3_ACCESS_KEY }
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: bitrate-env, key: S3_SECRET_KEY }
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef: { name: bitrate-env, key: S3_BUCKET }
            - name: GOMEMLIMIT
              value: 800MiB
            - { name: HOME, value: /tmp }
          ports:
            - containerPort: 8333
            - containerPort: 9333
            - containerPort: 19333
            - containerPort: 8888
            - containerPort: 18888
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -qO /dev/null http://127.0.0.1:9333/cluster/healthz && wget -qO /dev/null http://127.0.0.1:8333/healthz
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-init
  namespace: bitrate
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: init
          image: chrislusf/seaweedfs:4.53
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if echo s3.bucket.list | weed shell -master=seaweedfs:9333 | grep -q "^[[:space:]]*$S3_BUCKET[[:space:]]"; then
                echo "bucket $S3_BUCKET already exists"
              else
                echo "s3.bucket.create -name $S3_BUCKET" | weed shell -master=seaweedfs:9333
              fi
          env:
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef: { name: bitrate-env, key: S3_BUCKET }
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
