# Off-site backups to Cloudflare R2 — runbook: README.md next to this file.
#
# Credentials: `bitrate-env` (database + SeaweedFS source) and `backup-env` (R2 target +
# restic password). `backup-env` is created outside kustomize (task k8s:backup:secret)
# so the app stack applies without backup credentials; a run without it fails loudly.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres
  namespace: bitrate
spec:
  schedule: "15 */6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: tools
              image: restic/restic:0.18.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              command: ["cp", "/usr/bin/restic", "/tools/restic"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 64Mi }
          containers:
            - name: backup
              image: postgres:16-alpine
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              command: ["sh", "/scripts/backup-postgres.sh"]
              envFrom:
                - secretRef: { name: bitrate-env }
                - secretRef: { name: backup-env }
              env:
                - { name: RESTIC_CACHE_DIR, value: /work/restic-cache }
              volumeMounts:
                - { name: tools, mountPath: /tools }
                - { name: scripts, mountPath: /scripts }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
          volumes:
            - { name: tools, emptyDir: {} }
            - { name: work, emptyDir: {} }
            - { name: scripts, configMap: { name: backup-scripts } }
            - { name: tmp, emptyDir: {} }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-audio
  namespace: bitrate
spec:
  schedule: "45 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # The first run uploads the whole bucket; later runs only the difference.
      activeDeadlineSeconds: 21600
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: rclone/rclone:1.69.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              command: ["sh", "/scripts/backup-audio.sh"]
              envFrom:
                - secretRef: { name: bitrate-env }
                - secretRef: { name: backup-env }
              env:
                - { name: HOME, value: /tmp }
              volumeMounts:
                - { name: scripts, mountPath: /scripts }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
          volumes:
            - { name: scripts, configMap: { name: backup-scripts } }
            - { name: tmp, emptyDir: {} }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verify
  namespace: bitrate
spec:
  schedule: "30 5 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            # postgres in the alpine image; initdb refuses to run as root
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: tools
              image: restic/restic:0.18.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              command: ["cp", "/usr/bin/restic", "/tools/restic"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 64Mi }
          containers:
            - name: verify
              image: postgres:16-alpine
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              command: ["sh", "/scripts/verify-restore.sh"]
              envFrom:
                - secretRef: { name: bitrate-env }
                - secretRef: { name: backup-env }
              volumeMounts:
                - { name: tools, mountPath: /tools }
                - { name: scripts, mountPath: /scripts }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 200m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
          volumes:
            - { name: tools, emptyDir: {} }
            - { name: work, emptyDir: {} }
            - { name: scripts, configMap: { name: backup-scripts } }
            - { name: tmp, emptyDir: {} }
