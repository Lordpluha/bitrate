# Preprod / plain-HTTP entrypoint.
#
# Production does NOT use this file — it mounts templates/prod.conf.template instead, which
# adds TLS and the real server_name. Both include the same two snippets, so the routes and
# upstreams cannot drift between the two stacks.

include /etc/nginx/snippets/upstreams.conf;

server {
    listen 80;
    server_name localhost;

    include /etc/nginx/snippets/app-routes.conf;
}
