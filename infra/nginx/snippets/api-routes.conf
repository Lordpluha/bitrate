# Routes for the API on its own host.
#
# The service sets `setGlobalPrefix('api')` for its endpoints but deliberately leaves Swagger and
# the static mount outside it, so a single catch-all rewrite cannot serve everything: prefixing
# /swagger turns it into a 404. Each shape gets its own location instead.
#
# `set` precedes every `rewrite` on purpose — both are rewrite-phase directives executed in
# order, and `break` ends the phase, so a `set` after a rewrite never runs and nginx fails the
# request with "invalid URL prefix".
#
# The including server block owns `listen`, `server_name`, and TLS.

    # Endpoints as the clients currently address them: /api/v1/…
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        set $api_host_upstream http://api:3000;
        proxy_pass $api_host_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        # The API trusts exactly this proxy hop. Never append a client-supplied
        # X-Forwarded-For value, otherwise rate-limit and audit IPs are spoofable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger and the static mount sit outside the global prefix — passed through untouched.
    location /swagger {
        set $api_swagger_upstream http://api:3000;
        proxy_pass $api_swagger_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        set $api_static_upstream http://api:3000;
        proxy_pass $api_static_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
    }

    # Everything else is an endpoint addressed without the prefix: api.<domain>/v1/… . Kept so
    # the clients can drop the redundant segment without a flag day.
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        set $api_root_upstream http://api:3000;
        rewrite ^/(.*)$ /api/$1 break;
        proxy_pass $api_root_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
