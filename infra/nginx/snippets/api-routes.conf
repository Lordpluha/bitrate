# Routes for the API on its own host.
#
# The service sets `setGlobalPrefix('api')`, so its own paths start with /api. Requests that
# omit the prefix are rewritten to add it, which means both api.<domain>/v1/… and
# api.<domain>/api/v1/… reach the same handler — the clients can drop the redundant segment
# later without a flag day, and the path route on the main domain keeps working meanwhile.
#
# The including server block owns `listen`, `server_name`, and TLS.

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        rewrite ^/(?!api/)(.*)$ /api/$1 break;
        set $api_host_upstream http://api:3000;
        proxy_pass $api_host_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        # The API trusts exactly this proxy hop. Never append a client-supplied
        # X-Forwarded-For value, otherwise rate-limit and audit IPs are spoofable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
