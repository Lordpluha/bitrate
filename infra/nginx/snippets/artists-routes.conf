# Routes for the artists portal, served on its own host.
#
# It has to be a separate origin rather than a path under the main domain: the web player is on
# Next.js and serves its build from /_next/…, while this portal is on TanStack Start and serves
# its own from /assets/…. Under path routing the portal's assets resolved against the web player,
# which does not have them.
#
# The including server block owns `listen`, `server_name`, and TLS.

    # Build output, outside the page rate limit — a single page load requests dozens of files
    # at once and nginx answers a limited request with 503 and an HTML body.
    #
    # /assets/, not /_next/static/: Nitro emits the client bundle under /assets/. Leaving the
    # Next path here would have sent every stylesheet and chunk through the page rate limit.
    location /assets/ {
        set $artists_static_upstream http://web-artists:3002;
        proxy_pass $artists_static_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        limit_req zone=general_limit burst=20 nodelay;
        set $artists_upstream http://web-artists:3002;
        proxy_pass $artists_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $server_name;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
    }
