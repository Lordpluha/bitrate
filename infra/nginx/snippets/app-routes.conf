# Shared server-context routes. Included by every server block that serves the application,
# so preprod over HTTP and production over HTTPS route identically.
#
# The including server block owns `listen`, `server_name`, and TLS.

    # Security headers (set at server level to avoid redefinition issues)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # No server-level Cache-Control and no server-level CORS. Both used to be set here and were
    # inherited by every location, including /api: authenticated API responses were served with
    # `public, max-age=3600` and `Access-Control-Allow-Origin: *`. Caching belongs to the
    # locations that serve cacheable bytes, and CORS belongs to the API, which knows which
    # origins it trusts.

    # Web player (main)
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://web_player_frontend;
        proxy_http_version 1.1;
        # Only allow websocket upgrades, not h2c (prevent H2C smuggling)
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $server_name;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Artists web app
    location /artists {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://web_artists_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $server_name;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints
    location /api {
        limit_req zone=api_limit burst=5 nodelay;
        # No rewrite. main.ts calls setGlobalPrefix('api'), so the API already serves under
        # /api — stripping the prefix here made every proxied request 404.
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        # The API trusts exactly this proxy hop. Never append a client-supplied
        # X-Forwarded-For value, otherwise rate-limit and audit IPs are spoofable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files from API (uploaded content)
    location /uploads {
        proxy_pass http://api_backend;
        proxy_cache_valid 200 1d;
        expires 1d;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        # Same trusted-hop contract as /api: this block reaches the API too, so a
        # client-supplied X-Forwarded-For must never survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Documentation
    location /docs {
        limit_req zone=general_limit burst=10 nodelay;
        # Resolved at request time, not at startup: the docs service sits behind a compose
        # profile and is absent from the production stack. A static upstream here makes nginx
        # refuse to start whenever docs is not running, taking the whole site down with it.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $docs_upstream http://docs:3003;
        proxy_pass $docs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
