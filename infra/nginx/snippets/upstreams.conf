# Shared http-context configuration: upstreams, websocket maps, rate-limit zones.
# Included by conf.d/default.conf (preprod) and templates/prod.conf.template (production),
# so the two stacks cannot drift apart on where traffic goes.

# Upstream servers
upstream api_backend {
    least_conn;
    server api:3000 max_fails=3 fail_timeout=30s;
}

upstream web_player_frontend {
    least_conn;
    server web-player:3001 max_fails=3 fail_timeout=30s;
}

upstream web_artists_frontend {
    least_conn;
    server web-artists:3002 max_fails=3 fail_timeout=30s;
}

# WebSocket upgrade map (prevents H2C smuggling)
map $http_upgrade $connection_upgrade {
    websocket upgrade;
    default   close;
}

# Validate upgrade header is websocket
map $http_upgrade $validated_upgrade {
    websocket websocket;
    default   "";
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
