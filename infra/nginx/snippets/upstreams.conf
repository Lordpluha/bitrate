# Shared http-context configuration: DNS resolver, websocket maps, rate-limit zones.
#
# There are deliberately no `upstream` blocks. nginx resolves the host in an upstream once, at
# startup, and caches the address for the life of the process — so every `docker compose up`
# that recreates a container hands it a new IP and nginx keeps answering 502 until someone
# restarts it. Routing through a variable defers the lookup to request time instead.
# Included by conf.d/default.conf (preprod) and templates/prod.conf.template (production),
# so the two stacks cannot drift apart on where traffic goes.

# Upstream servers
# WebSocket upgrade map (prevents H2C smuggling)
map $http_upgrade $connection_upgrade {
    websocket upgrade;
    default   close;
}

# Validate upgrade header is websocket
map $http_upgrade $validated_upgrade {
    websocket websocket;
    default   "";
}

# Docker's embedded DNS. Required for the variable-based proxy_pass in app-routes.conf.
resolver 127.0.0.11 valid=10s ipv6=off;

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
# CMAF fragment ranges (`/tracks/:id/cmaf/:bitrate`): a track switch fetches the init segment, a
# buffer of fragments and the next track's prefetch at once, far past the generic API burst. The
# API's own throttler (1200/min) and real-time pacing still bound what one listener can pull.
limit_req_zone $binary_remote_addr zone=media_limit:10m rate=20r/s;
# A refused request is "slow down", not "the server is broken": 503 made the player treat it as
# an outage and give up on the track after three quick retries.
limit_req_status 429;
# Staff sign-in and token refresh on the operator host (#458): a password-guessing budget, not a
# traffic one. The API's own throttler still applies behind it.
limit_req_zone $binary_remote_addr zone=admin_auth_limit:10m rate=10r/m;
