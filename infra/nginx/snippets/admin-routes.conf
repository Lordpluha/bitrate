# Routes for the operator panel, served on its own host.
#
# The upstream container serves a prebuilt Angular SPA from its own nginx, so everything here is
# a plain proxy — there is no node process and no SSR.
#
# The operator API (#458, ADR-0068) is served from this same origin by the `admin-api` process:
# only its routes and health go there. Its Swagger is deliberately not routed — /swagger falls
# through to the SPA — and api.<domain> answers 404 for these paths.
#
# The including server block owns `listen`, `server_name`, and TLS.

    location /api/v1/admin/auth/ {
        limit_req zone=admin_auth_limit burst=5 nodelay;
        set $admin_api_auth_upstream http://admin-api:3007;
        proxy_pass $admin_api_auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        # The API trusts exactly this proxy hop. Never append a client-supplied
        # X-Forwarded-For value, otherwise rate-limit and audit IPs are spoofable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/admin/ {
        limit_req zone=api_limit burst=20 nodelay;
        set $admin_api_upstream http://admin-api:3007;
        proxy_pass $admin_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Readiness of the operator API, for the deploy gate and the external monitor.
    location /api/v1/health/ {
        set $admin_api_health_upstream http://admin-api:3007;
        proxy_pass $admin_api_health_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general_limit burst=20 nodelay;
        set $admin_upstream http://admin:3005;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
    }
