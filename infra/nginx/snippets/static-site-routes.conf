# Routes for a static site served by nginx inside its own container — the documentation site and
# the Storybook workshop. Shared by both hosts, so the including server block picks the backend by
# setting `$static_upstream` before the include:
#
#     set $static_upstream http://docs:8080;
#     include /etc/nginx/snippets/static-site-routes.conf;
#
# A server-level `set` runs before location selection, so the variable is visible below. It also
# has to be a variable rather than a literal host: without one, nginx resolves the name once at
# startup and caches the address, so a container that is recreated with a new IP keeps getting 502
# until nginx itself is restarted.
#
# The including server block owns `listen`, `server_name`, and TLS.

    # Assets are fingerprinted and requested dozens at a time; nginx answers a rate-limited
    # request with 503 and an HTML body, which a page then tries to execute as a script.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|webp|avif|svg|ico|map)$ {
        proxy_pass $static_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general_limit burst=40 nodelay;
        proxy_pass $static_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
    }
