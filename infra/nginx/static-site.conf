# Serves a prebuilt static site from inside its own container. Shared by the docs and Storybook
# images; the edge nginx proxies to it and owns TLS, rate limiting, and the security headers that
# apply to every host.
#
# Port 8080, not 80: these containers run as the unprivileged `nginx` user, which cannot bind a
# port below 1024. The pid and temp paths move to /tmp for the same reason — the image's defaults
# under /var/run and /var/cache are only writable by root.

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    access_log off;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Fingerprinted bundles: safe to cache for a year because a rebuild changes the filename.
        location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|webp|avif|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }
    }
}
