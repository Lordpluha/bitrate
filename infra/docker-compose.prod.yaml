# Docker Compose configuration for production environment with PostgreSQL, Redis, and all application services.

# Docker's default json-file driver keeps every log line forever. On a single-server
# deployment that fills the disk and takes the whole stack down with it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: bitrate-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitrate-network

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: bitrate-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      # Authenticates, and asserts on the reply. `redis-cli --raw incr ping` exits 0 even when
      # the server answers NOAUTH, so the old check reported healthy while the API could not
      # connect at all — and it incremented a key in the live database on every probe.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - bitrate-network

  # S3-compatible object store for audio (ADR-0050). Single node, internal network only: no
  # `ports:`, no nginx route, so nothing outside bitrate-network can reach it. The API serves
  # objects to browsers (signed token URLs), the store is never published.
  #
  # The identity file is generated at start from the env below, so no credential lives in the
  # repository or the image. The application identity is scoped to ONE bucket: it can read,
  # write and list there, and cannot create buckets or touch any other one. There is no
  # root/admin S3 identity at all; the bucket is created by seaweedfs-init through the master.
  # Credentials must be alphanumeric, because they are written into JSON by printf.
  #
  # Idle RSS is ~140 MB; GOMEMLIMIT keeps the Go heap under the 1G container limit so the
  # kernel OOM killer is not the thing that trims it.
  seaweedfs:
    logging: *default-logging
    image: chrislusf/seaweedfs:4.48
    container_name: bitrate-seaweedfs-prod
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        printf '{"identities":[{"name":"bitrate-app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:%s","Write:%s","List:%s","Tagging:%s"]}]}\n' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" > /tmp/s3.json
        exec /entrypoint.sh server -s3 -s3.config=/tmp/s3.json
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?S3_ACCESS_KEY is required for the object store}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?S3_SECRET_KEY is required for the object store}
      - S3_BUCKET=${S3_BUCKET:-bitrate-audio}
      - GOMEMLIMIT=800MiB
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      # 9333 is the master, 8333 the S3 gateway: healthy means both answer.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9333/cluster/healthz && wget -qO /dev/null http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # One-shot: creates the bucket if it is missing, then exits 0. Safe to re-run on every
  # `up -d`; an existing bucket and its objects are left untouched.
  seaweedfs-init:
    logging: *default-logging
    image: chrislusf/seaweedfs:4.48
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if echo s3.bucket.list | weed shell -master=seaweedfs:9333 | grep -q "^[[:space:]]*$$S3_BUCKET[[:space:]]"; then
          echo "bucket $$S3_BUCKET already exists"
        else
          echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=seaweedfs:9333
        fi
    environment:
      - S3_BUCKET=${S3_BUCKET:-bitrate-audio}
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks:
      - bitrate-network

  api:
    logging: *default-logging
    image: ghcr.io/lordpluha/bitrate/api:${IMAGE_TAG:-master}
    build:
      context: ..
      dockerfile: ./apps/api/Dockerfile
      target: production
      args:
        - NODE_ENV=production
    container_name: bitrate-api-prod
    restart: always
    # List form, deliberately. A bare name is passed through only when the variable is set;
    # `KEY=${KEY}` hands the container an empty string instead, and apps/api/env.schema.ts
    # validates the optional URL and token fields with z.url()/min(32) — an empty string fails
    # both. Optional has to mean absent, not empty.
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Production exposes the API only through the single nginx hop above.
      - TRUST_PROXY_HOPS=1
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      # Required by the schema. Without it the API exits at startup, which is what the
      # production stack did before this line existed.
      - WEB_HOST=${WEB_HOST}
      # Optional — passed through only when set in .env
      - SHADOW_DATABASE_URL
      - USER_WEB_HOST
      - ARTIST_WEB_HOST
      - ADMIN_WEB_HOST
      - API_BASE_URL
      - METRICS_TOKEN
      - SENTRY_DSN
      # Which release and which environment an event belongs to. Without them every error in
      # Sentry is unattributed and a spike cannot be traced to the deploy that caused it.
      - SENTRY_RELEASE
      - SENTRY_ENVIRONMENT
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASS
      - EMAIL_FROM
      - STORAGE_DRIVER
      # The object store is internal and fixed, so the endpoint is not configuration. These are
      # inert while STORAGE_DRIVER=local; the cutover is a separate change. The credentials are
      # the bucket-scoped application identity, never an admin one.
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_BUCKET=${S3_BUCKET:-bitrate-audio}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_FORCE_PATH_STYLE=true
      - S3_REGION
      - S3_PUBLIC_URL
      # Token lifetimes and cookie names. Absent here, the API fell back to its schema defaults, so
      # changing any of them in .env had no effect on production at all.
      - JWT_ACCESS_EXPIRES_IN
      - JWT_REFRESH_EXPIRES_IN
      - ACCESS_TOKEN_NAME
      - REFRESH_TOKEN_NAME
      # The parent domain the session cookies are scoped to, e.g. `.bitrate.me`. Without it the
      # cookies are host-only on the API subdomain, so the web apps' route guards never see a
      # session and every authenticated route redirects back to the login page.
      - COOKIE_DOMAIN
      - HEALTH_CHECK_TIMEOUT_MS
      - DEV_MAIL_LOG_TOKENS
      # Social sign-in. Without these four the Google and Facebook flows cannot work in production
      # no matter what .env holds — nothing was passing them through.
      - OAUTH_GOOGLE_CLIENT_ID
      - OAUTH_GOOGLE_CLIENT_SECRET
      - OAUTH_FACEBOOK_APP_ID
      - OAUTH_FACEBOOK_APP_SECRET
    volumes:
      # The API's own upload root, and the only durable one. CMD runs from WORKDIR /app, so
      # process.cwd() is /app and storage.config.ts puts every uploaded master, HLS ladder,
      # cover and avatar under /app/storage. That path was mounted nowhere: the bytes lived in
      # the container's writable layer and were destroyed by every `up -d` that recreated the
      # container — i.e. by every deploy.
      #
      # The two mounts this replaces (../apps/api/uploads, ../apps/api/public) pointed at paths
      # nothing in the API has ever written to. Docker created the empty host directories for
      # them, which is why they looked like they held the uploads.
      #
      # A named volume rather than a bind mount, because the container is non-root (uid 1001):
      # Docker seeds an empty named volume from the image directory and its ownership, so this
      # needs no chown on the host. Read it with `docker compose exec api tar -cf - -C /app storage`,
      # which is what infra/backup.sh does.
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  web-player:
    logging: *default-logging
    image: ghcr.io/lordpluha/bitrate/web-player:${IMAGE_TAG:-master}
    build:
      context: ..
      dockerfile: ./apps/web-player/Dockerfile
      target: production
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - API_URL=${API_URL:-http://api:3000}
        # Sentry is baked in at build time — `next build` inlines the DSN into the client
        # bundle, so a runtime variable would never reach the browser. Unset, the SDK
        # starts disabled; the source's only DSN is this variable.
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
        - NEXT_PUBLIC_SENTRY_ENVIRONMENT=${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
        - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:-}
        - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    container_name: bitrate-web-player-prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      API_URL: ${API_URL:-http://api:3000}
    depends_on:
      - api
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  web-artists:
    logging: *default-logging
    image: ghcr.io/lordpluha/bitrate/web-artists:${IMAGE_TAG:-master}
    build:
      context: ..
      dockerfile: ./apps/web-artists/Dockerfile
      target: production
      args:
        - VITE_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: bitrate-web-artists-prod
    restart: always
    environment:
      NODE_ENV: production
      VITE_API_URL: ${NEXT_PUBLIC_API_URL}
      API_URL: ${API_URL:-http://api:3000}
    depends_on:
      - api
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  admin:
    logging: *default-logging
    image: ghcr.io/lordpluha/bitrate/admin:${IMAGE_TAG:-master}
    build:
      context: ..
      dockerfile: ./apps/admin/Dockerfile
      target: production
      args:
        - NG_APP_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: bitrate-admin-prod
    restart: always
    depends_on:
      - api
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  cloudflared:
    logging: *default-logging
    image: cloudflare/cloudflared:latest
    container_name: bitrate-admin-cloudflared-prod
    restart: always
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - admin
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  # Static sites. Both serve a prebuilt bundle from nginx inside the container on 8080 and hold no
  # runtime state, so they need neither environment nor a dependency on the API.
  docs:
    logging: *default-logging
    image: ghcr.io/lordpluha/bitrate/docs:${IMAGE_TAG:-master}
    build:
      context: ..
      dockerfile: ./apps/docs/Dockerfile
      target: production
    container_name: bitrate-docs-prod
    restart: always
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  storybook:
    logging: *default-logging
    image: ghcr.io/lordpluha/bitrate/storybook:${IMAGE_TAG:-master}
    build:
      context: ..
      dockerfile: ./packages/ui-react/Dockerfile
      target: production
    container_name: bitrate-storybook-prod
    restart: always
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  nginx:
    logging: *default-logging
    image: nginx:alpine
    container_name: bitrate-nginx-prod
    restart: always
    environment:
      # Substituted into templates/prod.conf.template. Must match the certificate issued
      # under /etc/letsencrypt/live/<DOMAIN>/ or nginx will not start.
      DOMAIN: ${DOMAIN:?DOMAIN is required for the production nginx template}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Templates, not conf.d: the image's entrypoint renders ${DOMAIN} into conf.d at start,
      # so conf.d must stay writable and must not also carry the preprod HTTP-only server.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Blanks out the image's stock default.conf, which sorts before the rendered prod.conf
      # and so became the default server for port 80.
      - ./nginx/conf.d-disabled/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot-webroot:/var/www/certbot
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - api
      - web-player
      - web-artists
      - admin
      - docs
      - storybook
    networks:
      - bitrate-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # Uploaded audio, HLS artifacts, covers and avatars. Backed up off-host by
  # .github/workflows/backup.yml; see ADR-0033 for why this is a stopgap and
  # STORAGE_DRIVER=s3 is the durable answer for the audio.
  api_storage:
    driver: local
  # SeaweedFS data (ADR-0050). NOT covered by any backup yet: audio written here after the
  # STORAGE_DRIVER=s3 cutover has no off-host copy. Accepted risk, recorded in ADR-0050.
  seaweedfs_data:
    driver: local

networks:
  bitrate-network:
    driver: bridge
