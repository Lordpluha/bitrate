# Docker Compose configuration for production environment with PostgreSQL, Redis, and all application services.

# Docker's default json-file driver keeps every log line forever. On a single-server
# deployment that fills the disk and takes the whole stack down with it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: bitrate-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitrate-network

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: bitrate-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      # Authenticates, and asserts on the reply. `redis-cli --raw incr ping` exits 0 even when
      # the server answers NOAUTH, so the old check reported healthy while the API could not
      # connect at all — and it incremented a key in the live database on every probe.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - bitrate-network

  api:
    logging: *default-logging
    build:
      context: ..
      dockerfile: ./apps/api/Dockerfile
      target: production
      args:
        - NODE_ENV=production
    container_name: bitrate-api-prod
    restart: always
    # List form, deliberately. A bare name is passed through only when the variable is set;
    # `KEY=${KEY}` hands the container an empty string instead, and apps/api/env.schema.ts
    # validates the optional URL and token fields with z.url()/min(32) — an empty string fails
    # both. Optional has to mean absent, not empty.
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Production exposes the API only through the single nginx hop above.
      - TRUST_PROXY_HOPS=1
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      # Required by the schema. Without it the API exits at startup, which is what the
      # production stack did before this line existed.
      - WEB_HOST=${WEB_HOST}
      # Optional — passed through only when set in .env
      - SHADOW_DATABASE_URL
      - USER_WEB_HOST
      - ARTIST_WEB_HOST
      - API_BASE_URL
      - METRICS_TOKEN
      - SENTRY_DSN
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASS
      - EMAIL_FROM
      - STORAGE_DRIVER
      - S3_ENDPOINT
      - S3_REGION
      - S3_BUCKET
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_PUBLIC_URL
      - S3_FORCE_PATH_STYLE
    volumes:
      - ../apps/api/uploads:/app/apps/api/uploads
      - ../apps/api/public:/app/apps/api/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  web-player:
    logging: *default-logging
    build:
      context: ..
      dockerfile: ./apps/web-player/Dockerfile
      target: production
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - API_URL=${API_URL:-http://api:3000}
    container_name: bitrate-web-player-prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      API_URL: ${API_URL:-http://api:3000}
    depends_on:
      - api
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  web-artists:
    logging: *default-logging
    build:
      context: ..
      dockerfile: ./apps/web-artists/Dockerfile
      target: production
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: bitrate-web-artists-prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Static sites. Both serve a prebuilt bundle from nginx inside the container on 8080 and hold no
  # runtime state, so they need neither environment nor a dependency on the API.
  docs:
    logging: *default-logging
    build:
      context: ..
      dockerfile: ./apps/docs/Dockerfile
      target: production
    container_name: bitrate-docs-prod
    restart: always
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  storybook:
    logging: *default-logging
    build:
      context: ..
      dockerfile: ./packages/ui-react/Dockerfile
      target: production
    container_name: bitrate-storybook-prod
    restart: always
    networks:
      - bitrate-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  nginx:
    logging: *default-logging
    image: nginx:alpine
    container_name: bitrate-nginx-prod
    restart: always
    environment:
      # Substituted into templates/prod.conf.template. Must match the certificate issued
      # under /etc/letsencrypt/live/<DOMAIN>/ or nginx will not start.
      DOMAIN: ${DOMAIN:?DOMAIN is required for the production nginx template}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Templates, not conf.d: the image's entrypoint renders ${DOMAIN} into conf.d at start,
      # so conf.d must stay writable and must not also carry the preprod HTTP-only server.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot-webroot:/var/www/certbot
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - api
      - web-player
      - web-artists
      - docs
      - storybook
    networks:
      - bitrate-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bitrate-network:
    driver: bridge
